<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RA Hours">
<title>RA Hours</title>
<style>
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --ink2:#6E6E73; --ink3:#86868B;
  --line:#E3E3E8; --grid:#EEEEF1; --fill:#EFEFF3; --fill2:#F7F7F9;
  --accent:#E8590C; --accent-2:#C4470A; --accent-tint:#FFF2EA; --accent-soft:#FFE0CC;
  --irf:#E8590C; --uraf:#3A57D6; --plar:#1A9E77;
  --good:#1E8E3E; --good-tint:#E7F6EC; --warn:#9A5B00; --warn-tint:#FFF3D6; --bad:#D70015; --bad-tint:#FFEBED;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05);
  --shadow-lg:0 20px 60px rgba(0,0,0,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body.noscroll{overflow:hidden}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.num,b,td{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3,h4{margin:0;letter-spacing:-.022em}
p{margin:0}

/* ---------- Lock ---------- */
.lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#FBFBFD;overflow:hidden;transition:opacity .35s var(--ease),transform .35s var(--ease)}
.lock.out{opacity:0;transform:scale(1.04);pointer-events:none}
.lock-glow{position:absolute;inset:-20%;background:
  radial-gradient(40% 35% at 20% 15%,rgba(232,89,12,.20),transparent 70%),
  radial-gradient(35% 30% at 85% 85%,rgba(255,149,0,.16),transparent 70%),
  radial-gradient(30% 30% at 80% 10%,rgba(58,87,214,.07),transparent 70%);filter:blur(10px)}
.lock-in{position:relative;display:flex;flex-direction:column;align-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.app-icon{width:68px;height:68px;border-radius:17px;background:linear-gradient(160deg,#FF8A3D,#E8590C 55%,#C4470A);display:grid;place-items:center;color:#fff;box-shadow:0 10px 30px rgba(232,89,12,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.app-icon svg{width:34px;height:34px;stroke-width:2}
.lock h2{margin-top:18px;font-size:22px;font-weight:600}
#lock-msg{margin-top:4px;color:var(--ink2);font-size:15px;min-height:22px}
.dots{display:flex;gap:18px;margin:22px 0 30px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);transition:background .15s}
.dots i.on{background:var(--ink)}
.dots.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px}
.key{width:78px;height:78px;border-radius:50%;border:0;background:rgba(120,120,128,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .15s,transform .1s;backdrop-filter:blur(10px)}
.key:active{background:rgba(120,120,128,.3);transform:scale(.96)}
.key span{font-size:32px;font-weight:400;line-height:1}
.key small{font-size:9.5px;font-weight:600;letter-spacing:.18em;color:var(--ink2);margin-top:2px;min-height:12px}
.key.ghost{background:transparent;font-size:16px;color:var(--ink)}
.key.ghost:active{background:rgba(120,120,128,.12)}
.lock-foot{margin-top:28px;font-size:13px;color:var(--ink3);display:flex;gap:6px;align-items:center}
.lock-foot svg{width:15px;height:15px}

/* ---------- Top bar ---------- */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:rgba(245,245,247,.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid rgba(0,0,0,.08)}
.top-in{max-width:1120px;margin:0 auto;height:56px;padding:0 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;white-space:nowrap}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(160deg,#FF8A3D,#E8590C 55%,#C4470A);display:grid;place-items:center;color:#fff}
.logo svg{width:17px;height:17px;stroke-width:2.2}
.seg-nav{margin:0 auto;display:flex;background:rgba(118,118,128,.12);border-radius:10px;padding:2px}
.seg-nav button{border:0;background:transparent;padding:6px 16px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink);transition:background .2s,box-shadow .2s}
.seg-nav button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);font-weight:600}
.top-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.icon-btn{border:0;background:rgba(118,118,128,.12);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.icon-btn:active{transform:scale(.95)}
.btn-add{border:0;background:var(--accent);color:#fff;height:36px;border-radius:18px;padding:0 14px 0 10px;display:flex;align-items:center;gap:5px;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(232,89,12,.3)}
.btn-add svg{width:18px;height:18px;stroke-width:2.3}

/* ---------- Tab bar (phone) ---------- */
.tabbar{display:none}
.fab{display:none}
@media (max-width:760px){
  .seg-nav{display:none}
  .top-in{padding:0 16px}
  .btn-add{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(250,250,252,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid rgba(0,0,0,.1)}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:#8E8E93;padding:4px 0}
  .tabbar button.on{color:var(--accent)}
  .tabbar svg.i{width:25px;height:25px}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:19;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:0 10px 26px rgba(232,89,12,.42)}
  .fab svg{width:26px;height:26px;stroke-width:2.4}
  .fab:active{transform:scale(.94)}
}

/* ---------- Layout ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:22px 20px 60px}
@media (max-width:760px){.wrap{padding:14px 16px calc(150px + env(safe-area-inset-bottom))}}
.view{animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 18px}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
h1{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
@media (max-width:760px){h1{font-size:30px}}
.card{background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:17px;font-weight:600}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sub{color:var(--ink2);font-size:13.5px}
.muted{color:var(--ink3)}
.stack{display:grid;gap:16px}
.log-grid{display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:16px;align-items:start}
@media (max-width:900px){.log-grid{grid-template-columns:1fr}}
@media (max-width:760px){.stack,.log-grid{gap:12px}.card{padding:16px;border-radius:20px}}

/* ---------- Buttons & inputs ---------- */
.btn{border:0;height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s,background .15s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.tint{background:var(--accent-tint);color:var(--accent-2)}
.btn.plain{background:var(--fill);color:var(--ink)}
.btn.danger{background:var(--bad-tint);color:var(--bad)}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{border:0;background:none;color:var(--accent-2);font-weight:600;padding:0;font-size:14px}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=time],input[type=password],select{
  width:100%;height:44px;border-radius:12px;border:1px solid transparent;background:var(--fill);padding:0 12px;font-size:16px;outline:none;transition:border .15s,box-shadow .15s,background .15s;-webkit-appearance:none;appearance:none;min-width:0}
input[type=date],input[type=time]{display:flex;align-items:center}
input:focus,select:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 4px rgba(232,89,12,.14)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>span{font-size:13px;font-weight:600;color:var(--ink2)}
.field em{font-style:normal;font-weight:400;color:var(--ink3)}
.seg{display:flex;background:rgba(118,118,128,.12);border-radius:11px;padding:2px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;height:36px;border-radius:9px;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .2s,box-shadow .2s}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:6px}
.stepper button{border:0;border-radius:12px;background:var(--fill);font-size:22px;font-weight:400;color:var(--ink)}
.stepper button:active{background:var(--line)}
.stepper input{text-align:center;font-weight:600;font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:0;background:var(--fill2);border:1px solid var(--line);height:30px;padding:0 11px;border-radius:15px;font-size:13px;font-weight:500}
.chip:active,.chip.on{background:var(--accent-tint);border-color:var(--accent-soft);color:var(--accent-2)}
details.range{margin-top:8px}
details.range summary{font-size:13px;color:var(--accent-2);font-weight:600;cursor:pointer;list-style:none}
details.range summary::-webkit-details-marker{display:none}
.range-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px;color:var(--ink2);font-size:13px}
.hint{font-size:13.5px;line-height:1.4;padding:10px 12px;border-radius:12px;background:var(--fill2);color:var(--ink2);margin:2px 0 14px;display:flex;gap:8px;align-items:flex-start}
.hint svg{width:17px;height:17px;flex:none;margin-top:1px}
.hint.err{background:var(--bad-tint);color:var(--bad)}
.hint.ok{background:var(--good-tint);color:#17672D}
.hint.shake{animation:shake .4s}
.form-actions{display:flex;gap:10px}
.form-actions .primary{flex:1}

/* ---------- Toggle ---------- */
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:16px;background:rgba(120,120,128,.18);transition:background .25s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.08);transition:transform .25s var(--ease)}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{box-shadow:0 0 0 4px rgba(232,89,12,.2)}

/* ---------- Status pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.pill svg{width:13px;height:13px;stroke-width:2.4}
.pill.good{background:var(--good-tint);color:#17672D}
.pill.warn{background:var(--warn-tint);color:var(--warn)}
.pill.bad{background:var(--bad-tint);color:var(--bad)}
.pill.neutral{background:var(--fill);color:var(--ink2)}
.pill.accent{background:var(--accent-tint);color:var(--accent-2)}
.tagc{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 11%,white);color:var(--ink)}

/* ---------- Overview ---------- */
.meter{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;display:flex;gap:2px;margin-top:10px}
.meter i{display:block;height:100%;background:var(--c,var(--accent));border-radius:3px}
.meter i.ghost{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 45%,white) 0 3px,color-mix(in srgb,var(--c) 15%,white) 3px 6px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:12px;height:12px;border-radius:3px;background:var(--c)}
.legend .sw.ghost{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 50%,white) 0 2px,color-mix(in srgb,var(--c) 15%,white) 2px 4px)}
.legend .ln{width:16px;height:0;border-top:2px solid var(--c)}
.legend .ln.dash{border-top-style:dashed;opacity:.8}
.legend .ln.cap{border-top:2px solid var(--ink)}
.legend .ln.plan{border-top-style:dotted;border-top-width:3px}
.tc{padding-top:14px;margin-top:14px;border-top:.5px solid var(--line)}
.card-head+.tc{border-top:0;margin-top:0;padding-top:0}
.tc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.tc-name{font-size:16px;font-weight:650;display:flex;align-items:center;gap:8px}
.tc-name span{font-weight:400;color:var(--ink2)}
.tc-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tc-big{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1}
.tc-big small{font-size:14px;font-weight:500;color:var(--ink2)}
.chart.tchart{min-height:190px}
@media (max-width:560px){.tc-right{flex-direction:row;align-items:center;width:100%;justify-content:space-between}}
.chart{position:relative;width:100%;min-height:220px;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;fill:var(--ink3)}
.chart .vlab{fill:var(--ink2);font-weight:600;font-size:11px}
.chart .endlab{fill:var(--ink);font-weight:600;font-size:12px}
.chart .col{transition:opacity .15s}
.chart svg.hovering .col:not(.hl){opacity:.35}
.tip{position:fixed;left:0;top:0;z-index:90;pointer-events:none;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.08);padding:10px 12px;font-size:12.5px;min-width:170px;max-width:260px}
.tip h5{margin:0 0 6px;font-size:12.5px;font-weight:650}
.tip .tr{display:flex;align-items:center;gap:7px;justify-content:space-between;margin-top:3px}
.tip .tr span{display:flex;align-items:center;gap:6px;color:var(--ink2)}
.tip .tr b{font-weight:650}
.tip hr{border:0;border-top:.5px solid var(--line);margin:7px 0}

/* ---------- Log ---------- */
.timer-face{font-size:44px;font-weight:300;letter-spacing:-.02em;text-align:center;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.timer-sub{text-align:center;color:var(--ink2);font-size:13.5px;margin-bottom:14px}
.timer-run{display:flex;gap:10px}
.timer-run .btn{flex:1}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.filter{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.wgroup{margin-top:14px}
.wgroup-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 4px 8px;font-size:13px;color:var(--ink2);font-weight:600}
.wgroup-h .meter{width:90px;margin:0}
.elist{background:var(--fill2);border-radius:14px;overflow:hidden}
.erow{width:100%;border:0;background:transparent;display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:11px 14px 11px 12px;text-align:left;border-bottom:.5px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow:hover{background:rgba(0,0,0,.025)}
.erow .ebar{width:4px;height:32px;border-radius:2px;background:var(--c)}
.erow .emain{min-width:0}
.erow .emain b{display:block;font-size:14.5px;font-weight:600}
.erow .emain small{display:block;color:var(--ink2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .eright{text-align:right}
.erow .eright b{display:block;font-size:15px}
.erow .eright small{color:var(--good);font-size:12.5px;font-weight:600}
.empty{text-align:center;padding:30px 16px;color:var(--ink2)}
.empty svg{width:40px;height:40px;color:var(--ink3);stroke-width:1.4;margin-bottom:6px}
.miss-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:.5px solid var(--line)}
.miss-row:last-child{border-bottom:0}
.miss-row b{font-size:14.5px;font-weight:600;display:block}
.miss-row small{color:var(--ink2);font-size:12.5px}
.miss-row .usd{font-weight:650;color:var(--accent-2);font-size:14px}
.more{width:100%;border:0;background:none;color:var(--accent-2);font-weight:600;padding:12px;font-size:14px}

/* ---------- Calendar ---------- */
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav h3{min-width:150px;text-align:center;font-size:18px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;font-size:12px;font-weight:600;color:var(--ink3);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{position:relative;border:0;background:var(--fill2);border-radius:14px;min-height:84px;padding:7px 8px;display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:4px;transition:transform .1s,background .15s;overflow:hidden}
.cell:hover{background:#F0F0F3}
.cell:active{transform:scale(.97)}
.cell .n{font-size:14px;font-weight:600;line-height:1}
.cell .tg{font-size:10px;font-weight:600;color:var(--bad);line-height:1.1}
.cell .hv{margin-top:auto;font-size:12px;font-weight:650}
.cell .hv.plan{color:var(--ink2);font-weight:500}
.cell .cb{display:flex;gap:2px;height:6px}
.cell .cb i{border-radius:3px;background:var(--c)}
.cell .cb i.ghost{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 55%,white) 0 2px,color-mix(in srgb,var(--c) 18%,white) 2px 4px)}
.cell.blank{background:transparent;pointer-events:none}
.cell.wkend{background:repeating-linear-gradient(135deg,#F4F4F6 0 6px,#EDEDF0 6px 7px)}
.cell.wkend .n,.cell.out .n{color:var(--ink3)}
.cell.hol{background:var(--bad-tint)}
.cell.out{background:#FAFAFB}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.today .n{color:var(--accent-2)}
.cell.miss::after{content:"";position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}

        <button class="icon-btn" data-act="lock" aria-label="Lock"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg></button>
      </div>

  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad2 = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const dow = s => pd(s).getDay();                 // 0 = Sunday
const weekKey = s => addDays(s, -((dow(s) + 6) % 7)); // Monday of that week
const todayStr = () => ds(new Date());
const fmt = (s, o) => pd(s).toLocaleDateString('en-US', o);
const fmtShort = s => fmt(s, { month: 'short', day: 'numeric' });
const fmtDay = s => fmt(s, { weekday: 'short', month: 'short', day: 'numeric' });
const fmtLong = s => fmt(s, { weekday: 'long', month: 'long', day: 'numeric' });
const fmtRange = (a, b) => pd(a).getMonth() === pd(b).getMonth()
  ? `${fmtShort(a)} – ${pd(b).getDate()}` : `${fmtShort(a)} – ${fmtShort(b)}`;
const r2 = v => Math.round((+v || 0) * 100) / 100;
const fmtH = h => { h = r2(h); return Number.isInteger(h) ? String(h) : String(h); };
const money = v => { v = r2(v); return (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
const roundQ = x => Math.round(x * 4) / 4;
const minD = (a, b) => (a < b ? a : b), maxD = (a, b) => (a > b ? a : b);

const cyrb53 = (str, seed = 0) => {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
};
const hashPin = p => cyrb53('ra-tracker::' + p, 7);
const DEFAULT_PIN_HASH = '2a7t0ttm862';

const IC = {
  overview: '<svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="9" rx="2"/><rect x="13.5" y="3.5" width="7" height="5" rx="2"/><rect x="13.5" y="11.5" width="7" height="9" rx="2"/><rect x="3.5" y="15.5" width="7" height="5" rx="2"/></svg>',
  log: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  calendar: '<svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  settings: '<svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  warn: '<svg class="i" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.1"/></svg>',
  clock: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  info: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 7.8v.1"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  left: '<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  play: '<svg class="i" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></svg>',
  stop: '<svg class="i" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>',
  cash: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3v18M16.5 7.5c-.8-1.3-2.5-2-4.5-2-2.5 0-4.2 1.3-4.2 3.1 0 4.4 9 2.3 9 6.8 0 1.9-1.9 3.2-4.8 3.2-2.2 0-4-.8-4.8-2.2"/></svg>',
  week: '<svg class="i" viewBox="0 0 24 24"><path d="M4 19V9M9.3 19V5M14.6 19v-7M20 19v-4"/></svg>',
  flag: '<svg class="i" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  copy: '<svg class="i" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6a2.5 2.5 0 0 0-2.5-2.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/></svg>',
  key: '<svg class="i" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4.5"/><path d="M11.2 11.8L20 3M16.5 6.5l2.5 2.5M14 9l2 2"/></svg>',
  cal: '<svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
};

/* =====================================================================
   State (localStorage only)
   ===================================================================== */
const KEY = 'raTracker.v1';
const JOB_COLORS = ['#E8590C', '#3A57D6', '#1A9E77', '#B0258A'];
const DEFAULT = () => ({
  v: 1,
  jobs: [
    { id: 'irf',  grant: 'IRF',  prof: 'Prof. Mridula Sharma', start: '2026-09-21', end: '2026-11-30', rate: 20, hours: 125 },
    { id: 'uraf', grant: 'URAF', prof: 'Prof. Manu Sharma',    start: '2026-11-02', end: '2026-12-23', rate: 25, hours: 105 },
    { id: 'plar', grant: 'PLAR', prof: 'Dr. Ghazanfar Latif',  start: '2026-10-26', end: '2027-01-29', rate: 25, hours: 421 },
  ],
  entries: [],
  settings: {
    weeklyCap: 35, dailyCap: 7, catchupUntil: '2026-11-04', payAnchor: '2026-09-21', paydayOffset: 5, autoLock: 5, pinHash: DEFAULT_PIN_HASH,
    holidays: [
      { id: 'h1', date: '2026-09-30', name: 'Truth & Reconciliation Day', on: true },
      { id: 'h2', date: '2026-10-12', name: 'Thanksgiving', on: true },
      { id: 'h3', date: '2026-11-11', name: 'Remembrance Day', on: true },
      { id: 'h4', date: '2026-12-25', name: 'Christmas Day', on: true },
      { id: 'h5', date: '2026-12-26', name: 'Boxing Day', on: false },
      { id: 'h6', date: '2027-01-01', name: 'New Year’s Day', on: true },
    ],
  },
  pay: {},
  timer: null,
  lastJob: 'plar',
});

function load() {
  const base = DEFAULT();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = JSON.parse(raw);
      return {
        ...base, ...o,
        settings: { ...base.settings, ...(o.settings || {}) },
        jobs: (o.jobs && o.jobs.length) ? o.jobs : base.jobs,
        entries: Array.isArray(o.entries) ? o.entries : [],
        pay: o.pay || {},
      };
    }
  } catch (e) { /* fall through */ }
  return base;
}
let S = load();
let user = null;   // Supabase user once signed in
let storageOK = true;
// Local copy = fast start + offline cache. Supabase is the source of truth once signed in.
function cacheLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) { if (storageOK && !user) toast('Couldn’t save — this browser is blocking local storage'); storageOK = false; }
}
function save() { cacheLocal(); scheduleSync(); }
const colorOf = j => JOB_COLORS[S.jobs.indexOf(j)] || '#888';
// "$25" when every position pays the same, "$20–$25" when they differ.
const rateTxt = () => { const r = VJ().map(j => j.rate), lo = Math.min(...r), hi = Math.max(...r); return lo === hi ? money(lo) : `${money(lo)}–${money(hi)}`; };
const jobById = id => S.jobs.find(j => j.id === id);
// Visible positions: archived ones disappear from every screen except Settings.
// Their entries stay (and still count toward the weekly limit).
const VJ = () => { const v = S.jobs.filter(j => !j.archived); return v.length ? v : S.jobs; };
const isVis = id => VJ().some(j => j.id === id);

/* =====================================================================
   Rules & derived data
   ===================================================================== */
let HOL = {};
let D = null;
const isWeekend = d => { const w = dow(d); return w === 0 || w === 6; };
const isWorkday = d => !isWeekend(d) && !HOL[d];
const inJob = (j, d) => d >= j.start && d <= j.end;
const countWork = (a, b, j) => { let n = 0; for (let d = a; d <= b; d = addDays(d, 1)) if (isWorkday(d) && (!j || inJob(j, d))) n++; return n; };
const cap = () => +S.settings.weeklyCap || 35;
// Catch-up (back-filled hours up to this date): limits apply per position, dcap() a day and
// cap() a week. After it: cap() a week across all positions, no daily limit.
const dcap = () => +S.settings.dailyCap || 7;
const isCatchup = d => !!S.settings.catchupUntil && d <= S.settings.catchupUntil;
// Week total that counts toward the regular (all positions) limit.
const regWeek = (w, skipId) => S.entries.reduce((s, e) => s + (e.id !== skipId && weekKey(e.date) === w && !isCatchup(e.date) ? e.hours : 0), 0);
const wkLabel = w => isCatchup(w) ? `${fmtH(D.byWeek[w]?.total || 0)} h · catch-up` : `${fmtH(D.byWeek[w]?.total || 0)} / ${cap()} h`;

/* Spread hours across work days: level daily load, never over the weekly cap or
   the daily cap, each position only inside its own date window. Used for the
   "target from day one" baseline (useLogs=false) and the forward plan (useLogs=true). */
function schedule(from, remIn, useLogs) {
  const rem = { ...remIn }, days = {}, wkPlan = {};
  const end = D.span.end, list = [];
  for (let d = from; d <= end; d = addDays(d, 1)) if (isWorkday(d) && VJ().some(j => inJob(j, d))) list.push(d);
  for (let i = 0; i < list.length; i++) {
    const d = list[i];
    const A = VJ().filter(j => inJob(j, d) && rem[j.id] > 0.01);
    if (!A.length) continue;
    const live = VJ().filter(j => j.end >= d && rem[j.id] > 0.01);
    const R = live.reduce((s, j) => s + rem[j.id], 0);
    let N = 0; for (let x = i; x < list.length; x++) if (live.some(j => inJob(j, list[x]))) N++;
    const w = weekKey(d);
    let k = 0; for (let x = i; x < list.length && weekKey(list[x]) === w; x++) k++;
    const used = (useLogs ? regWeek(w) : 0) + (wkPlan[w] || 0);
    const dayCap = Math.max(0, (cap() - used) / k);
    const r = {}; let sumR = 0;
    A.forEach(j => { let n = 0; for (let x = i; x < list.length && list[x] <= j.end; x++) if (inJob(j, list[x])) n++; r[j.id] = rem[j.id] / n; sumR += r[j.id]; });
    const target = Math.min(dayCap, Math.max(R / N, sumR));
    const out = {};
    if (sumR >= target) A.forEach(j => out[j.id] = sumR ? r[j.id] * target / sumR : 0);
    else {
      A.forEach(j => out[j.id] = r[j.id]);
      let extra = target - sumR;
      for (let pass = 0; pass < 3 && extra > 1e-6; pass++) {
        const can = A.filter(j => rem[j.id] - out[j.id] > 1e-6);
        const tot = can.reduce((s, j) => s + rem[j.id] - out[j.id], 0);
        if (!tot) break;
        let gave = 0;
        can.forEach(j => { const add = Math.min(extra * (rem[j.id] - out[j.id]) / tot, rem[j.id] - out[j.id]); out[j.id] += add; gave += add; });
        extra -= gave;
      }
    }
    let tot = 0;
    A.forEach(j => {
      let h = Math.round(out[j.id] * 2) / 2;
      if (h > rem[j.id]) h = rem[j.id];
      if (rem[j.id] - h < 0.5) h = rem[j.id];
      out[j.id] = h; tot += h;
    });
    let guard = 0;
    while (tot > dayCap + 1e-9 && guard++ < 50) {
      const big = A.reduce((a, b) => (out[a.id] >= out[b.id] ? a : b));
      const dec = Math.min(out[big.id], Math.max(0.25, Math.ceil((tot - dayCap) * 4) / 4));
      out[big.id] -= dec; tot -= dec;
    }
    if (tot <= 0) continue;
    days[d] = { total: tot };
    A.forEach(j => { if (out[j.id] > 0) { days[d][j.id] = out[j.id]; rem[j.id] -= out[j.id]; } });

}

function derive() {
  HOL = {};
  (S.settings.holidays || []).forEach(h => { if (h.on && h.date) HOL[h.date] = h.name || 'Stat holiday'; });
  const T = todayStr();
  const span = { start: VJ().reduce((a, j) => minD(a, j.start), VJ()[0].start), end: VJ().reduce((a, j) => maxD(a, j.end), VJ()[0].end) };
  const byDate = {}, byWeek = {}, byJob = {};
  S.jobs.forEach(j => byJob[j.id] = 0);
  for (const e of S.entries) {
    if (!jobById(e.job)) continue;
    const b = byDate[e.date] || (byDate[e.date] = { total: 0 });
    b[e.job] = (b[e.job] || 0) + e.hours; b.total += e.hours;
    const w = weekKey(e.date), bw = byWeek[w] || (byWeek[w] = { total: 0 });
    bw[e.job] = (bw[e.job] || 0) + e.hours; bw.total += e.hours;
    byJob[e.job] += e.hours;
  }
  D = { T, Y: addDays(T, -1), span, byDate, byWeek, byJob };
  // Baseline target: how a perfect schedule would look from contract day one.
  const base = schedule(span.start, Object.fromEntries(VJ().map(j => [j.id, +j.hours || 0])), false);
  const cum = {}, run = {}; VJ().forEach(j => run[j.id] = 0);
  for (let d = span.start; d <= span.end; d = addDays(d, 1)) { const b = base.days[d]; if (b) VJ().forEach(j => run[j.id] += b[j.id] || 0); cum[d] = { ...run }; }
  D.base = { days: base.days, cum };
  // Forward plan from today with what's actually logged.
  const rem = Object.fromEntries(VJ().map(j => [j.id, Math.max(0, (+j.hours || 0) - byJob[j.id])]));
  D.plan = schedule(maxD(T, span.start), rem, true);

}
const expBy = (d, jid) => { if (d < D.span.start) return 0; d = minD(d, D.span.end); const c = D.base.cum[d]; return c ? (jid ? c[jid] || 0 : VJ().reduce((s, j) => s + (c[j.id] || 0), 0)) : 0; };
const logBy = (d, jid) => S.entries.reduce((s, e) => s + (e.date <= d && (!jid || e.job === jid) && isVis(e.job) ? e.hours : 0), 0);
const plannedWeek = (w, jid) => { let s = 0; for (let i = 0; i < 7; i++) { const p = D.plan.days[addDays(w, i)]; if (p) s += jid ? (p[jid] || 0) : p.total; } return s; };

function gap() {
  const per = VJ().map(j => {
    const target = expBy(D.Y, j.id), logged = logBy(D.T, j.id);
    const miss = Math.max(0, target - logged);
    return { j, target, logged, miss, usd: miss * j.rate, ahead: Math.max(0, logged - target) };
  });
  const sum = k => per.reduce((s, p) => s + p[k], 0);
  return { per, target: sum('target'), logged: sum('logged'), miss: sum('miss'), usd: sum('usd'), ahead: sum('ahead') };
}
function unloggedDays() {
  const out = [];
  for (let d = D.span.start; d <= minD(D.Y, D.span.end); d = addDays(d, 1)) {
    if (!isWorkday(d) || !VJ().some(j => inJob(j, d))) continue;
    if (!D.byDate[d]) out.push(d);
  }
  return out.reverse();
}
function jobStats(j) {
  const logged = D.byJob[j.id] || 0, left = Math.max(0, j.hours - logged);
  const target = expBy(D.Y, j.id), loggedNow = logBy(D.T, j.id);
  const diff = loggedNow - target;
  const daysLeft = D.T > j.end ? 0 : countWork(maxD(D.T, j.start), j.end, j);
  const perDay = daysLeft ? left / daysLeft : 0;
  const short = D.plan.short[j.id] || 0;
  let st;
  if (left <= 0.001) st = { k: 'good', t: 'Complete', i: 'check' };
  else if (D.T < j.start) st = { k: 'neutral', t: 'Starts ' + fmtShort(j.start), i: 'clock' };
  else if (D.T > j.end) st = { k: 'bad', t: `${fmtH(left)} h unused`, i: 'warn' };
  else if (short > 0.01) st = { k: 'bad', t: `Can’t fit ${fmtH(short)} h`, i: 'warn' };
  else if (diff >= -1) st = { k: 'good', t: diff > 1 ? 'Ahead' : 'On track', i: 'check' };
  else st = { k: 'warn', t: `${fmtH(-diff)} h behind`, i: 'warn' };
  return { j, c: colorOf(j), logged, left, target, diff, daysLeft, perDay, short, st,
    pct: j.hours ? Math.min(1, logged / j.hours) : 0, tpct: j.hours ? Math.min(1, target / j.hours) : 0,
    earned: logged * j.rate, budget: j.hours * j.rate, miss: Math.max(0, -diff) };
}

/* Validation for one entry (hard university rules) */
function validate(v) {
  const j = jobById(v.job);
  if (!j) return 'Choose a position.';
  if (!v.date) return 'Pick a date.';
  if (isWeekend(v.date)) return 'Weekends are off-limits under your RA terms.';
  if (HOL[v.date]) return `${fmtShort(v.date)} is ${HOL[v.date]} — a stat holiday, no RA work allowed.`;
  if (!inJob(j, v.date)) return `${j.grant} runs ${fmtShort(j.start)} – ${fmtShort(j.end)} only.`;
  if (!(v.hours > 0)) return 'Enter the hours you worked.';
  const others = S.entries.filter(e => e.id !== v.id);
  const day = others.reduce((s, e) => s + (e.date === v.date ? e.hours : 0), 0);
  if (day + v.hours > 24) return 'That’s more than 24 hours in one day.';
  const wk = weekKey(v.date);
  if (isCatchup(v.date)) {
    const mine = others.filter(e => e.job === j.id && isCatchup(e.date));
    const jd = mine.reduce((s, e) => s + (e.date === v.date ? e.hours : 0), 0);
    if (jd + v.hours > dcap() + 1e-9) return `Catch-up limit: ${dcap()} h a day per position. ${fmtH(Math.max(0, dcap() - jd))} h left for ${j.grant} on ${fmtShort(v.date)}.`;
    const jw = mine.reduce((s, e) => s + (weekKey(e.date) === wk ? e.hours : 0), 0);
    if (jw + v.hours > cap() + 1e-9) return `Catch-up limit: ${cap()} h a week per position. ${fmtH(Math.max(0, cap() - jw))} h left for ${j.grant} that week.`;
  } else {
    const wkUsed = regWeek(wk, v.id);
    if (wkUsed + v.hours > cap() + 1e-9) return `Week of ${fmtShort(wk)} would hit ${fmtH(wkUsed + v.hours)} h — the limit is ${cap()} h. ${fmtH(Math.max(0, cap() - wkUsed))} h left that week.`;
  }
  const jobUsed = others.reduce((s, e) => s + (e.job === j.id ? e.hours : 0), 0);
  if (jobUsed + v.hours > j.hours + 1e-9) return `Only ${fmtH(Math.max(0, j.hours - jobUsed))} h left on the ${j.grant} contract.`;
  return null;
}

/* One panel per position, each on its own scale: entered (solid), target from

function targetChart(host, j) {
  if (!host) return;

  const m = { t: 16, r: narrow ? 46 : 64, b: 26, l: 34 };
  const dates = []; for (let d = j.start; d <= j.end; d = addDays(d, 1)) dates.push(d);

  const aEnd = dates.indexOf(minD(j.end, maxD(D.T, lastEntry)));           // -1 = not started yet

function onSettingChange(t) {
  if (t.dataset.s) {
    const k = t.dataset.s;
    if (k === 'payAnchor') { if (!t.value) return; S.settings[k] = t.value; }
    else if (k === 'catchupUntil') S.settings[k] = t.value || null;
    else { const v = parseFloat(t.value); if (!(v >= 0)) return; S.settings[k] = v; }
    save(); renderAll();
    if (view === 'settings') $$('[data-s="' + k + '"]').forEach(x => { if (x !== t) x.value = t.value; });
    return true;
  }
  if (t.dataset.j) {
    const [id, f] = t.dataset.j.split(':'), j = jobById(id);
    if (f === 'rate' || f === 'hours') { const v = parseFloat(t.value); if (!(v >= 0)) return; j[f] = v; }
    else if (f === 'start' || f === 'end') {
      const nv = t.value; if (!nv) return;
      if ((f === 'start' && nv > j.end) || (f === 'end' && nv < j.start)) { toast('Start must be before end'); t.value = j[f]; return; }
      j[f] = nv;
    } else j[f] = t.value.trim() || j[f];
    save(); renderAll(); toast('Saved'); return true;
  }
  if (t.dataset.arch) {
    const j = jobById(t.dataset.arch);
    if (t.checked === false && VJ().length === 1 && !j.archived) { toast('Keep at least one position visible'); t.checked = true; return; }
    j.archived = !t.checked; save(); renderAll(); renderSettings(); toast(j.archived ? `${j.grant} hidden — its hours are kept` : `${j.grant} is back`); return true;
  }
  if (t.dataset.hol) { const h = S.settings.holidays.find(x => x.id === t.dataset.hol); h.on = t.checked; save(); renderAll(); return true; }
}

  st.entries.forEach(e => o.entries[e.id] = { user_id: uid, id: e.id, job_id: e.job, work_date: e.date, hours: r2(e.hours), note: e.note || null, from_period_total: !!e.bulk, created_at: new Date(e.created || 0).toISOString() });
  return o;
}
function fromServer(R) {
  const set = R.settings[0] || {}, d = DEFAULT();
  const jobs = R.jobs.slice().sort((a, b) => a.sort_order - b.sort_order)
    .map(j => ({ id: j.id, grant: j.grant_name, prof: j.professor, start: j.start_date, end: j.end_date, rate: +j.hourly_rate, hours: +j.contract_hours, archived: j.archived }));
  return {
    v: 1,
    jobs: jobs.length ? jobs : d.jobs,
    entries: R.entries.map(e => ({ id: e.id, job: e.job_id, date: e.work_date, hours: +e.hours, note: e.note || '', bulk: !!e.from_period_total, created: Date.parse(e.created_at) || 0 })),
    settings: {
      weeklyCap: +(set.weekly_cap ?? 35), dailyCap: +(set.daily_cap ?? 7), catchupUntil: set.catchup_until, payAnchor: set.pay_anchor || d.settings.payAnchor,
      paydayOffset: +(set.payday_offset ?? 5), autoLock: +(set.auto_lock_min ?? 5), pinHash: set.pin_hash || DEFAULT_PIN_HASH,
      holidays: R.holidays.map(h => ({ id: h.id, date: h.holiday_date, name: h.name, on: !!h.enabled })),
    },
    pay: Object.fromEntries(R.pay_periods.map(p => [p.period_start, { sub: !!p.timesheet_submitted, got: !!p.received, net: p.net_amount == null ? null : +p.net_amount }])),
    timer: set.timer || null,
    lastJob: set.last_job || d.lastJob,
  };
}
async function pull() {
  const names = Object.keys(TBL), R = {};
  const res = await Promise.all(names.map(t => sb.from(t).select('*')));
  res.forEach((r, i) => { if (r.error) throw r.error; R[names[i]] = r.data; });
  return R;
}
async function push() {
  const cur = toRows(S, user.id), b = base || { settings: {}, jobs: {}, holidays: {}, pay_periods: {}, entries: {} };
  const same = (x, y) => JSON.stringify(x) === JSON.stringify(y);
  const run = async q => { const { error } = await q; if (error) throw error; };
  const up = async t => { const rows = Object.keys(cur[t]).filter(k => !b[t]?.[k] || !same(cur[t][k], b[t][k])).map(k => cur[t][k]); if (rows.length) await run(sb.from(t).upsert(rows, { onConflict: TBL[t] })); };
  const del = async t => { const ids = Object.keys(b[t] || {}).filter(k => !cur[t][k]); if (ids.length) await run(sb.from(t).delete().in(t === 'pay_periods' ? 'period_start' : 'id', ids)); };
  // Order matters for the database rules: parents first, removed entries before new ones.
  await up('settings'); await up('jobs'); await up('holidays'); await del('holidays');
  await del('entries'); await up('entries'); await up('pay_periods'); await del('pay_periods'); await del('jobs');
  base = cur; saveBase();
}
const hasPending = () => !!(user && base && JSON.stringify(toRows(S, user.id)) !== JSON.stringify(base));
function scheduleSync() { if (!user || !sb) return; dirty = true; setStatus('pending'); clearTimeout(syncT); syncT = setTimeout(runSync, 350); }
async function runSync() {
  if (!user || !sb) return;
  if (syncing) { dirty = true; return; }
  syncing = true; dirty = false; setStatus('syncing');
  try { await push(); setStatus('synced'); }
  catch (err) {
    if (isNet(err)) setStatus('offline');
    else { toast('Not saved: ' + cleanErr(err)); await resetFromServer(); }
  } finally {
    syncing = false;
    if (dirty && status !== 'offline') { dirty = false; runSync(); }
  }
}
function applyServer(R) {
  const next = fromServer(R), nb = toRows(next, user.id);
  const changed = JSON.stringify(nb) !== JSON.stringify(toRows(S, user.id));
  S = next; base = nb; saveBase(); cacheLocal();
  if (changed && !APP.hidden) { renderAll(); if (view === 'settings') renderSettings(); }
}
async function resetFromServer() {
  try { applyServer(await pull()); setStatus('synced'); } catch (e) { setStatus(isNet(e) ? 'offline' : 'error'); }
}
async function refresh() {
  if (!user || !sb || syncing) return;
  lastPull = Date.now();
  try {
    if (hasPending()) { await runSync(); if (status !== 'synced') return; }
    applyServer(await pull()); setStatus('synced');
  } catch (e) { setStatus(isNet(e) ? 'offline' : 'error'); }
}
async function startCloud() {
  if (cloudSkipped) return setStatus('local');
  try { await client(); } catch (e) { setStatus('offline'); return; }
  const { data } = await sb.auth.getSession();
  user = data.session?.user || null;
  if (!user) { showAuth(); return; }
  cloudStarted = true;
  await initialSync();
}
async function initialSync() {
  setStatus('syncing');
  try {
    const R = await pull(), stored = loadBase();
    if (!R.settings.length && !R.jobs.length) {
      // Brand-new cloud: upload everything on this device (defaults + any local entries).
      try { localStorage.setItem('raTracker.preSync', JSON.stringify(S)); } catch (e) {}
      base = null; await push();
      toast(S.entries.length ? `Uploaded ${S.entries.length} entries to Supabase` : 'Connected to Supabase');
    } else if (stored && stored.uid === user.id) {
      // Returning device: send anything changed offline, then take the server copy.
      base = stored.rows; if (hasPending()) await push(); applyServer(await pull());
    } else {
      // First sign-in on this device: cloud wins, but keep entries that only exist here.
      const local = S, srv = fromServer(R), ids = new Set(srv.entries.map(e => e.id));
      const extra = local.entries.filter(e => !ids.has(e.id) && srv.jobs.some(j => j.id === e.job));
      base = toRows(srv, user.id); saveBase();
      S = srv; S.entries = srv.entries.concat(extra);
      Object.entries(local.pay || {}).forEach(([k, r]) => { if (!S.pay[k]) S.pay[k] = r; });
      cacheLocal();
      if (hasPending()) { await push(); if (extra.length) toast(`Added ${extra.length} entries from this device`); }
    }
    lastPull = Date.now();
    setStatus('synced'); renderAll(); if (view === 'settings') renderSettings();
  } catch (err) {
    if (isNet(err)) setStatus('offline');
    else { setStatus('error'); toast('Supabase: ' + cleanErr(err)); if (base) await resetFromServer(); }
  }
}
function showAuth() {
  const a = $('#auth'); a.hidden = false; a.classList.remove('out');
  $('#authErr').textContent = '';
  setTimeout(() => $('#authForm').elements.email.focus(), 50);
}
$('#authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('[type=submit]'), err = $('#authErr');
  const email = f.elements.email.value.trim(), password = f.elements.password.value;
  if (!email || !password) { err.textContent = 'Enter your email and password.'; return; }
  btn.disabled = true; err.textContent = '';
  try {
    await client();
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    user = data.user; f.elements.password.value = '';
    $('#auth').hidden = true; cloudSkipped = false; cloudStarted = true;
    await initialSync();
  } catch (ex) {
    err.textContent = isNet(ex) ? 'No connection — try again when you’re online.' : (ex.message || 'Sign-in failed');
  } finally { btn.disabled = false; }
});
/* =====================================================================
   AI agent access (token-based, see agent-setup.sql)
   An agent in another chat logs hours through the agent_* functions with a
   personal token. The token only reaches entries and can be revoked here.
   ===================================================================== */
const TOKEN_KEY = 'raTracker.agentToken';
let tokens = null;
const storedToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } };
function buildPrompt(tok) {
  const t = tok || '<PASTE_AGENT_TOKEN>', cap = S.settings.weeklyCap;
  const jobs = VJ().map(j => `- ${j.grant} (job "${j.id}"): ${j.prof}, ${j.start} to ${j.end}, $${j.rate}/h CAD, ${j.hours} h contract`).join('\n');
  return `You log my university RA work hours into my "RA Hours" tracker. It is a Supabase database you reach over HTTPS from your terminal (curl). When I describe work I did, turn it into entries and log them with the functions below. You need no other credentials; never ask for my password or a secret key.

## Connection
- POST ${SB_URL}/rest/v1/rpc/<function_name> with a JSON body of named parameters
- Headers (all required):
  apikey: ${SB_KEY}
  Content-Type: application/json
  Content-Profile: ra_tracker
- Every body includes "p_token": "${t}"
  (my personal agent token: it only reaches my hours, only through these functions)

## My positions
${jobs}

## Functions
1. agent_status {p_token} → {today, weekly_cap, this_week_start, this_week_hours, positions: [{job, grant, professor, start, end, rate, contract_hours, logged_hours, remaining_hours, earned_cad}], holidays: [date]}
   Call this first, every session.
2. agent_list {p_token, p_from?, p_to?} → [{id, job, date, hours, note}]. No dates = the current Mon–Sun week.
3. agent_log {p_token, p_job: ${VJ().map(j => '"' + j.grant + '"').join(' | ')}, p_date: "YYYY-MM-DD", p_hours, p_note?} → the new entry. Hours round to 0.25.
4. agent_update {p_token, p_id, p_changes: {job?, date?, hours?, note?}} → the updated entry.
5. agent_delete {p_token, p_id} → {"deleted": id}.

## Rules (the database enforces them; a break comes back as "RA rule: …")
- Weekdays only, never an enabled stat holiday, only inside that position's dates.
- From ${S.settings.catchupUntil ? addDays(S.settings.catchupUntil, 1) : 'now'} on: at most ${cap} h per Mon–Sun week across all positions, no daily limit.${S.settings.catchupUntil ? `\n- Catch-up (back-filled days up to ${S.settings.catchupUntil}): each position on its own, at most ${dcap()} h a day and ${cap} h a week.` : ''}\n- Never past a position's contract hours.
- Dates are America/Toronto. Work out "yesterday", "Monday" etc. from "today" in agent_status.
- Positions with "archived": true in agent_status are finished: don't log to them unless I ask.
- If I don't say which position or which day, ask. If I give one total for several days ("10 h on IRF this week"), propose an even split over the weekdays and confirm before logging.
- Call agent_list for those dates before logging, so you don't log the same work twice. Ask before deleting anything.
- p_note: a short description of the work in my words (≤ 140 characters).
- After acting, reply with a short table (date, position, hours, $ = hours × rate) and the new totals from agent_status.
- "Invalid or revoked agent token" → ask me for a new one (RA Hours → Settings → AI agent).

## Example
curl -s -X POST '${SB_URL}/rest/v1/rpc/agent_log' \\
  -H 'apikey: ${SB_KEY}' -H 'Content-Type: application/json' -H 'Content-Profile: ra_tracker' \\
  -d '{"p_token":"${t}","p_job":"IRF","p_date":"${D?.T || ds(new Date())}","p_hours":3.5,"p_note":"Literature review"}'`;
}
function agentHTML() {
  const tok = storedToken();
  if (user && tokens === null) loadTokens().then(() => { if (view === 'settings') renderSettings(); });
  return `
      <p class="group-title">AI agent</p>
      <div class="glist">
        <div class="gitem"><div class="gl">Let an AI log your hours<small>Copy the prompt into a new chat with an agent that can run terminal commands, then tell it what you worked on</small></div><button class="btn sm primary" data-act="copy-prompt">${IC.copy}Copy prompt</button></div>
        ${user ? `
        <div class="gitem"><div class="gl">Agent token<small>${tok ? 'Saved on this device and filled into the prompt' : 'Create one so the prompt works'}</small></div><button class="btn sm tint" data-act="new-token">${IC.key}${tok ? 'New token' : 'Create token'}</button></div>
        ${tok ? `<div class="gitem"><span class="secret" style="flex:1">${esc(tok)}</span><button class="btn sm plain" data-act="copy-token">${IC.copy}Copy</button></div>` : ''}
        ${(tokens || []).map(x => `<div class="gitem"><div class="gl">${esc(x.label)} · rah_…${esc(x.token_hint)}<small>Created ${fmtLong(x.created_at.slice(0, 10))} · ${x.last_used_at ? 'last used ' + fmtLong(x.last_used_at.slice(0, 10)) : 'never used'}</small></div><button class="btn sm danger" data-act="revoke" data-id="${x.id}" data-hint="${esc(x.token_hint)}">Revoke</button></div>`).join('')}` : `
        <div class="gitem"><div class="gl">Agent token<small>Sign in to Supabase first to create one</small></div><button class="btn sm plain" data-act="signin">Sign in</button></div>`}
        <div class="gitem" style="display:block"><textarea class="prompt" readonly spellcheck="false" aria-label="Agent prompt">${esc(buildPrompt(tok))}</textarea></div>
      </div>
      <p class="gnote">Anyone with this prompt can add and change your entries until you revoke the token. It never contains your password or secret key, and every entry still has to pass the university rules.</p>`;
}
async function loadTokens() {
  if (!user || !sb) { tokens = null; return; }
  const { data, error } = await sb.from('agent_tokens').select('id,label,token_hint,created_at,last_used_at').order('created_at', { ascending: false });
  tokens = error ? [] : data;
  if (error) toast('Couldn’t load tokens: ' + (/agent_tokens/.test(error.message) ? 'run agent-setup.sql first.' : cleanErr(error)));
}
async function createToken() {
  if (!user || !sb) return toast('Sign in first');
  const label = prompt('Label for this token', 'Claude');
  if (label === null) return;
  const { data, error } = await sb.rpc('create_agent_token', { p_label: label.trim() || 'Agent' });
  if (error) return toast('Couldn’t create token: ' + (/create_agent_token/.test(error.message) ? 'run agent-setup.sql first.' : cleanErr(error)));
  try { localStorage.setItem(TOKEN_KEY, data); } catch (e) {}
  tokens = null; await loadTokens(); renderSettings(); toast('Token created — the prompt now includes it');
}
async function revokeToken(id, hint) {
  if (!confirm('Revoke this token? Any agent using it loses access immediately.')) return;
  const { error } = await sb.from('agent_tokens').delete().eq('id', id);
  if (error) return toast('Couldn’t revoke: ' + cleanErr(error));
  if (storedToken().endsWith(hint)) try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  await loadTokens(); renderSettings(); toast('Token revoked');
}
async function copyText(s, msg) {
  try { await navigator.clipboard.writeText(s); toast(msg); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(msg); }
}

async function signOut() {
  if (!confirm('Sign out? Your data stays safe in Supabase; the copy on this device is removed.')) return;
  if (hasPending()) await runSync();
  try { await sb?.auth.signOut(); } catch (e) {}
  try { localStorage.removeItem(KEY); localStorage.removeItem(BASE_KEY); localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  user = null; base = null; tokens = null; cloudStarted = false; S = DEFAULT(); setStatus('local');
  lock();
}
addEventListener('online', () => { if (!LOCK.hidden) return; if (user) refresh(); else if (!cloudSkipped && !cloudStarted) startCloud(); });
const maybeRefresh = () => { if (document.visibilityState === 'visible' && LOCK.hidden && user && Date.now() - lastPull > 20000) refresh(); };
document.addEventListener('visibilitychange', maybeRefresh);
addEventListener('focus', maybeRefresh);

/* =====================================================================
   Lock screen
   ===================================================================== */
const LOCK = $('#lock'), APP = $('#app');
let buf = '', fails = 0, coolUntil = 0;
$('#pad').innerHTML = [['1', ''], ['2', 'ABC'], ['3', 'DEF'], ['4', 'GHI'], ['5', 'JKL'], ['6', 'MNO'], ['7', 'PQRS'], ['8', 'TUV'], ['9', 'WXYZ']]
  .map(([n, l]) => `<button class="key" data-k="${n}" aria-label="${n}"><span>${n}</span><small>${l}</small></button>`).join('') +
  `<span></span><button class="key" data-k="0" aria-label="0"><span>0</span><small></small></button><button class="key ghost" data-k="del" aria-label="Delete">Delete</button>`;
const dots = () => $$('#dots i').forEach((d, i) => d.classList.toggle('on', i < buf.length));
function press(k) {
  if (LOCK.hidden) return;
  if (Date.now() < coolUntil) return;
  if (k === 'del') buf = buf.slice(0, -1); else if (buf.length < 4) buf += k;
  dots();
  if (buf.length === 4) {
    const attempt = buf;
    setTimeout(() => {
      if (hashPin(attempt) === S.settings.pinHash) { fails = 0; unlock(); }
      else {
        fails++; buf = ''; const el = $('#dots'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); dots();
        if (fails >= 5) { coolUntil = Date.now() + 30000; $('#lock-msg').textContent = 'Too many tries — wait 30 seconds'; setTimeout(() => { $('#lock-msg').textContent = 'Enter Passcode'; fails = 0; }, 30000); }
        else $('#lock-msg').textContent = 'Wrong passcode';
      }
    }, 130);
  }
}
$('#pad').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
document.addEventListener('keydown', e => { if (LOCK.hidden) return; if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); });
let lastActive = Date.now();
const touch = () => { lastActive = Date.now(); try { sessionStorage.setItem('ra.active', lastActive); } catch (e) {} };
['pointerdown', 'keydown', 'scroll'].forEach(ev => addEventListener(ev, () => { if (LOCK.hidden && Date.now() - lastActive > 5000) touch(); }, { passive: true }));
function lock() {
  try { sessionStorage.removeItem('ra.active'); } catch (e) {}

  closeSheet(); hideTip(); $('#auth').hidden = true;
  LOCK.hidden = false; requestAnimationFrame(() => LOCK.classList.remove('out'));

}
function unlock() {

  APP.hidden = false;
  LOCK.classList.add('out'); setTimeout(() => { LOCK.hidden = true; }, 350);
  renderAll();

}
setInterval(() => {
  const m = +S.settings.autoLock;
  if (LOCK.hidden && m > 0 && Date.now() - lastActive > m * 60000) lock();
}, 10000);
document.addEventListener('visibilitychange', () => {
  const m = +S.settings.autoLock;
  if (document.visibilityState === 'visible' && LOCK.hidden && m > 0 && Date.now() - lastActive > m * 60000) lock();

// Boot: stay unlocked across a refresh only if recently active in this tab.
(() => {
  let a = 0; try { a = +sessionStorage.getItem('ra.active') || 0; } catch (e) {}
  const m = +S.settings.autoLock;
  if (a && (m === 0 || Date.now() - a < m * 60000)) { LOCK.hidden = true; unlock(); }
})();
})();

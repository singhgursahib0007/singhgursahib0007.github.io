<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RA Hours">
<title>RA Hours</title>
<style>
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --ink2:#6E6E73; --ink3:#86868B;
  --line:#E3E3E8; --grid:#EEEEF1; --fill:#EFEFF3; --fill2:#F7F7F9;
  --accent:#E8590C; --accent-2:#C4470A; --accent-tint:#FFF2EA; --accent-soft:#FFE0CC;
  --irf:#E8590C; --uraf:#3A57D6;
  --good:#1E8E3E; --good-tint:#E7F6EC; --warn:#9A5B00; --warn-tint:#FFF3D6; --bad:#D70015; --bad-tint:#FFEBED;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05);
  --shadow-lg:0 20px 60px rgba(0,0,0,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body.noscroll{overflow:hidden}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.num,b,.big,td{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3,h4{margin:0;letter-spacing:-.022em}
p{margin:0}

/* ---------- Lock ---------- */
.lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#FBFBFD;overflow:hidden;transition:opacity .35s var(--ease),transform .35s var(--ease)}
.lock.out{opacity:0;transform:scale(1.04);pointer-events:none}
.lock-glow{position:absolute;inset:-20%;background:
  radial-gradient(40% 35% at 20% 15%,rgba(232,89,12,.20),transparent 70%),
  radial-gradient(35% 30% at 85% 85%,rgba(255,149,0,.16),transparent 70%),
  radial-gradient(30% 30% at 80% 10%,rgba(58,87,214,.07),transparent 70%);filter:blur(10px)}
.lock-in{position:relative;display:flex;flex-direction:column;align-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.app-icon{width:68px;height:68px;border-radius:17px;background:linear-gradient(160deg,#FF8A3D,#E8590C 55%,#C4470A);display:grid;place-items:center;color:#fff;box-shadow:0 10px 30px rgba(232,89,12,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.app-icon svg{width:34px;height:34px;stroke-width:2}
.lock h2{margin-top:18px;font-size:22px;font-weight:600}
#lock-msg{margin-top:4px;color:var(--ink2);font-size:15px;min-height:22px}
.dots{display:flex;gap:18px;margin:22px 0 30px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);transition:background .15s}
.dots i.on{background:var(--ink)}
.dots.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px}
.key{width:78px;height:78px;border-radius:50%;border:0;background:rgba(120,120,128,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .15s,transform .1s;backdrop-filter:blur(10px)}
.key:active{background:rgba(120,120,128,.3);transform:scale(.96)}
.key span{font-size:32px;font-weight:400;line-height:1}
.key small{font-size:9.5px;font-weight:600;letter-spacing:.18em;color:var(--ink2);margin-top:2px;min-height:12px}
.key.ghost{background:transparent;font-size:16px;color:var(--ink)}
.key.ghost:active{background:rgba(120,120,128,.12)}
.lock-foot{margin-top:28px;font-size:13px;color:var(--ink3);display:flex;gap:6px;align-items:center}
.lock-foot svg{width:15px;height:15px}

/* ---------- Top bar ---------- */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:rgba(245,245,247,.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid rgba(0,0,0,.08)}
.top-in{max-width:1120px;margin:0 auto;height:56px;padding:0 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;white-space:nowrap}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(160deg,#FF8A3D,#E8590C 55%,#C4470A);display:grid;place-items:center;color:#fff}
.logo svg{width:17px;height:17px;stroke-width:2.2}
.seg-nav{margin:0 auto;display:flex;background:rgba(118,118,128,.12);border-radius:10px;padding:2px}
.seg-nav button{border:0;background:transparent;padding:6px 16px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink);transition:background .2s,box-shadow .2s}
.seg-nav button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);font-weight:600}
.top-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.icon-btn{border:0;background:rgba(118,118,128,.12);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.icon-btn:active{transform:scale(.95)}
.btn-add{border:0;background:var(--accent);color:#fff;height:36px;border-radius:18px;padding:0 14px 0 10px;display:flex;align-items:center;gap:5px;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(232,89,12,.3)}
.btn-add svg{width:18px;height:18px;stroke-width:2.3}

/* ---------- Tab bar (phone) ---------- */
.tabbar{display:none}
.fab{display:none}
@media (max-width:760px){
  .seg-nav{display:none}
  .top-in{padding:0 16px}
  .btn-add{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(250,250,252,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid rgba(0,0,0,.1)}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:#8E8E93;padding:4px 0}
  .tabbar button.on{color:var(--accent)}
  .tabbar svg.i{width:25px;height:25px}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:19;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:0 10px 26px rgba(232,89,12,.42)}
  .fab svg{width:26px;height:26px;stroke-width:2.4}
  .fab:active{transform:scale(.94)}
}

/* ---------- Layout ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:22px 20px 60px}
@media (max-width:760px){.wrap{padding:14px 16px calc(150px + env(safe-area-inset-bottom))}}
.view{animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 18px}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
h1{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
@media (max-width:760px){h1{font-size:30px}}
.card{background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:17px;font-weight:600}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sub{color:var(--ink2);font-size:13.5px}
.muted{color:var(--ink3)}
.stack{display:grid;gap:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.log-grid{display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:16px;align-items:start}
@media (max-width:900px){.g4{grid-template-columns:1fr 1fr}.log-grid{grid-template-columns:1fr}}
@media (max-width:760px){.g2{grid-template-columns:1fr}.g4,.g2,.stack,.log-grid{gap:12px}.card{padding:16px;border-radius:20px}}

/* ---------- Buttons & inputs ---------- */
.btn{border:0;height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s,background .15s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.tint{background:var(--accent-tint);color:var(--accent-2)}
.btn.plain{background:var(--fill);color:var(--ink)}
.btn.danger{background:var(--bad-tint);color:var(--bad)}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{border:0;background:none;color:var(--accent-2);font-weight:600;padding:0;font-size:14px}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=time],input[type=password],select{
  width:100%;height:44px;border-radius:12px;border:1px solid transparent;background:var(--fill);padding:0 12px;font-size:16px;outline:none;transition:border .15s,box-shadow .15s,background .15s;-webkit-appearance:none;appearance:none;min-width:0}
input[type=date],input[type=time]{display:flex;align-items:center}
input:focus,select:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 4px rgba(232,89,12,.14)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>span{font-size:13px;font-weight:600;color:var(--ink2)}
.field em{font-style:normal;font-weight:400;color:var(--ink3)}
.seg{display:flex;background:rgba(118,118,128,.12);border-radius:11px;padding:2px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;height:36px;border-radius:9px;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .2s,box-shadow .2s}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:6px}
.stepper button{border:0;border-radius:12px;background:var(--fill);font-size:22px;font-weight:400;color:var(--ink)}
.stepper button:active{background:var(--line)}
.stepper input{text-align:center;font-weight:600;font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:0;background:var(--fill2);border:1px solid var(--line);height:30px;padding:0 11px;border-radius:15px;font-size:13px;font-weight:500}
.chip:active,.chip.on{background:var(--accent-tint);border-color:var(--accent-soft);color:var(--accent-2)}
details.range{margin-top:8px}
details.range summary{font-size:13px;color:var(--accent-2);font-weight:600;cursor:pointer;list-style:none}
details.range summary::-webkit-details-marker{display:none}
.range-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px;color:var(--ink2);font-size:13px}
.hint{font-size:13.5px;line-height:1.4;padding:10px 12px;border-radius:12px;background:var(--fill2);color:var(--ink2);margin:2px 0 14px;display:flex;gap:8px;align-items:flex-start}
.hint svg{width:17px;height:17px;flex:none;margin-top:1px}
.hint.err{background:var(--bad-tint);color:var(--bad)}
.hint.ok{background:var(--good-tint);color:#17672D}
.hint.shake{animation:shake .4s}
.form-actions{display:flex;gap:10px}
.form-actions .primary{flex:1}

/* ---------- Toggle ---------- */
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:16px;background:rgba(120,120,128,.18);transition:background .25s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.08);transition:transform .25s var(--ease)}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{box-shadow:0 0 0 4px rgba(232,89,12,.2)}

/* ---------- Status pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.pill svg{width:13px;height:13px;stroke-width:2.4}
.pill.good{background:var(--good-tint);color:#17672D}
.pill.warn{background:var(--warn-tint);color:var(--warn)}
.pill.bad{background:var(--bad-tint);color:var(--bad)}
.pill.neutral{background:var(--fill);color:var(--ink2)}
.pill.accent{background:var(--accent-tint);color:var(--accent-2)}
.tagc{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 11%,white);color:var(--ink)}

/* ---------- Overview ---------- */
.nudge{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:20px 22px;color:#fff;background:linear-gradient(135deg,#FF7A2F 0%,#E8590C 45%,#B8410A 100%);box-shadow:0 14px 40px rgba(232,89,12,.28);display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.nudge::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.nudge .lbl{font-size:13px;font-weight:600;opacity:.9;text-transform:uppercase;letter-spacing:.05em}
.nudge .amt{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1.05;margin:4px 0 6px}
.nudge .amt small{font-size:18px;font-weight:600;opacity:.85;letter-spacing:-.01em}
.nudge p.d{font-size:14.5px;opacity:.95;max-width:560px}
.nudge .btn{background:#fff;color:var(--accent-2);position:relative;z-index:1}
.nudge.calm{background:linear-gradient(135deg,#FFFFFF,#FFF6F0);color:var(--ink);box-shadow:var(--shadow)}
.nudge.calm .amt{font-size:30px}
.nudge.calm .btn{background:var(--accent-tint)}
.nudge-stats{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap}
.nudge-stats div{font-size:12.5px;opacity:.9}
.nudge-stats b{display:block;font-size:19px;font-weight:700;opacity:1}
@media (max-width:760px){.nudge{padding:18px}.nudge .amt{font-size:38px}.nudge .btn{width:100%}}

.hero{display:flex;gap:26px;align-items:center}
.ring-svg{width:156px;height:156px;flex:none}
.ring-p{animation:ring 1.2s var(--ease) both}
@keyframes ring{from{stroke-dashoffset:var(--c0)}}
.hero-main{flex:1;min-width:0}
.big{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1.1}
.big .of{font-size:17px;font-weight:500;color:var(--ink2);letter-spacing:-.01em}
.hero-rows{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:14px}
.hrow{display:flex;gap:10px;align-items:flex-start}
.hrow .key2{width:4px;align-self:stretch;border-radius:2px;background:var(--c)}
.hrow b{font-size:16px;display:block}
.hrow small{color:var(--ink2);font-size:12.5px}
@media (max-width:560px){.hero{flex-direction:column;align-items:stretch;gap:14px}.ring-wrap{display:flex;justify-content:center}.big{font-size:34px}.hero-main{text-align:left}}

.kpi .lbl{font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kpi .lbl svg{width:15px;height:15px;color:var(--accent)}
.kpi .val{font-size:28px;font-weight:700;letter-spacing:-.03em;margin-top:6px;line-height:1.1}
.kpi .val small{font-size:14px;font-weight:500;color:var(--ink2);letter-spacing:0}
.kpi .foot{font-size:12.5px;color:var(--ink2);margin-top:6px}
.meter{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;display:flex;gap:2px;margin-top:10px}
.meter i{display:block;height:100%;background:var(--c,var(--accent));border-radius:3px}
.meter i.ghost{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 45%,white) 0 3px,color-mix(in srgb,var(--c) 15%,white) 3px 6px)}
@media (max-width:760px){.kpi .val{font-size:24px}}

.job{border-top:4px solid var(--c)}
.job-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.job h3{margin-top:10px;font-size:19px}
.job .sub{margin-top:2px}
.prog{position:relative;height:10px;border-radius:5px;background:color-mix(in srgb,var(--c) 12%,white);margin:16px 0 6px}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--c);transition:width .8s var(--ease)}
.prog b{position:absolute;top:-4px;width:2px;height:18px;border-radius:1px;background:var(--ink);transform:translateX(-1px)}
.prog-leg{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.job-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.job-grid div{background:var(--fill2);border-radius:12px;padding:10px 12px}
.job-grid small{display:block;font-size:11.5px;color:var(--ink2);font-weight:500}
.job-grid b{font-size:17px;font-weight:650}
.job-grid .hl{background:var(--accent-tint)}
.job-grid .hl b{color:var(--accent-2)}

.wk-list{display:grid;gap:8px}
.wk-row{display:grid;grid-template-columns:88px 1fr 64px;gap:12px;align-items:center;padding:8px 10px;border-radius:12px}
.wk-row.today{background:var(--accent-tint)}
.wk-row .dname{font-weight:600;font-size:14px}
.wk-row .dname small{display:block;font-weight:400;color:var(--ink2);font-size:12px}
.wk-row .tot{text-align:right;font-weight:600;font-size:14px}
.wk-row .tot small{display:block;font-weight:400;color:var(--ink2);font-size:11.5px}
.wk-row.off{opacity:.55}
.bline{display:flex;gap:2px;height:22px;align-items:stretch}
.bline i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11.5px;font-weight:600;color:#fff;border-radius:6px;background:var(--c);min-width:0;overflow:hidden;white-space:nowrap}
.bline i.ghost{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 32%,white) 0 4px,color-mix(in srgb,var(--c) 12%,white) 4px 8px);color:var(--ink)}
.bline .offtxt{font-size:12.5px;color:var(--ink2);align-self:center}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:12px;height:12px;border-radius:3px;background:var(--c)}
.legend .sw.ghost{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 50%,white) 0 2px,color-mix(in srgb,var(--c) 15%,white) 2px 4px)}
.legend .ln{width:16px;height:0;border-top:2px solid var(--c)}
.legend .ln.dash{border-top-style:dashed;opacity:.8}
.legend .ln.cap{border-top:2px solid var(--ink)}
.chart{position:relative;width:100%;min-height:220px;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;fill:var(--ink3)}
.chart .vlab{fill:var(--ink2);font-weight:600;font-size:11px}
.chart .endlab{fill:var(--ink);font-weight:600;font-size:12px}
.chart .col{transition:opacity .15s}
.chart svg.hovering .col:not(.hl){opacity:.35}
.tip{position:fixed;left:0;top:0;z-index:90;pointer-events:none;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.08);padding:10px 12px;font-size:12.5px;min-width:170px;max-width:260px}
.tip h5{margin:0 0 6px;font-size:12.5px;font-weight:650}
.tip .tr{display:flex;align-items:center;gap:7px;justify-content:space-between;margin-top:3px}
.tip .tr span{display:flex;align-items:center;gap:6px;color:var(--ink2)}
.tip .tr b{font-weight:650}
.tip hr{border:0;border-top:.5px solid var(--line);margin:7px 0}

/* ---------- Log ---------- */
.timer-face{font-size:44px;font-weight:300;letter-spacing:-.02em;text-align:center;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.timer-sub{text-align:center;color:var(--ink2);font-size:13.5px;margin-bottom:14px}
.timer-run{display:flex;gap:10px}
.timer-run .btn{flex:1}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.filter{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.wgroup{margin-top:14px}
.wgroup-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 4px 8px;font-size:13px;color:var(--ink2);font-weight:600}
.wgroup-h .meter{width:90px;margin:0}
.elist{background:var(--fill2);border-radius:14px;overflow:hidden}
.erow{width:100%;border:0;background:transparent;display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:11px 14px 11px 12px;text-align:left;border-bottom:.5px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow:hover{background:rgba(0,0,0,.025)}
.erow .ebar{width:4px;height:32px;border-radius:2px;background:var(--c)}
.erow .emain{min-width:0}
.erow .emain b{display:block;font-size:14.5px;font-weight:600}
.erow .emain small{display:block;color:var(--ink2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .eright{text-align:right}
.erow .eright b{display:block;font-size:15px}
.erow .eright small{color:var(--good);font-size:12.5px;font-weight:600}
.empty{text-align:center;padding:30px 16px;color:var(--ink2)}
.empty svg{width:40px;height:40px;color:var(--ink3);stroke-width:1.4;margin-bottom:6px}
.miss-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:.5px solid var(--line)}
.miss-row:last-child{border-bottom:0}
.miss-row b{font-size:14.5px;font-weight:600;display:block}
.miss-row small{color:var(--ink2);font-size:12.5px}
.miss-row .usd{font-weight:650;color:var(--accent-2);font-size:14px}
.more{width:100%;border:0;background:none;color:var(--accent-2);font-weight:600;padding:12px;font-size:14px}

/* ---------- Calendar ---------- */
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav h3{min-width:150px;text-align:center;font-size:18px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;font-size:12px;font-weight:600;color:var(--ink3);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{position:relative;border:0;background:var(--fill2);border-radius:14px;min-height:84px;padding:7px 8px;display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:4px;transition:transform .1s,background .15s;overflow:hidden}
.cell:hover{background:#F0F0F3}
.cell:active{transform:scale(.97)}
.cell .n{font-size:14px;font-weight:600;line-height:1}
.cell .tg{font-size:10px;font-weight:600;color:var(--bad);line-height:1.1}
.cell .hv{margin-top:auto;font-size:12px;font-weight:650}
.cell .hv.plan{color:var(--ink2);font-weight:500}
.cell .cb{display:flex;gap:2px;height:6px}
.cell .cb i{border-radius:3px;background:var(--c)}
.cell .cb i.ghost{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 55%,white) 0 2px,color-mix(in srgb,var(--c) 18%,white) 2px 4px)}
.cell.blank{background:transparent;pointer-events:none}
.cell.wkend{background:repeating-linear-gradient(135deg,#F4F4F6 0 6px,#EDEDF0 6px 7px)}
.cell.wkend .n,.cell.out .n{color:var(--ink3)}
.cell.hol{background:var(--bad-tint)}
.cell.out{background:#FAFAFB}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.today .n{color:var(--accent-2)}
.cell.miss::after{content:"";position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
@media (max-width:760px){
  .cal,.cal-dow{gap:4px}
  .cell{min-height:58px;border-radius:11px;padding:6px 5px;gap:3px}
  .cell .n{font-size:13px}
  .cell .tg{font-size:8.5px}
  .cell .hv{font-size:10.5px}
  .cell .cb{height:4px}
  .cell.miss::after{top:6px;right:5px;width:6px;height:6px}
  .cal-nav h3{min-width:120px;font-size:16px}
}
.wsum{display:grid;grid-template-columns:120px 1fr 110px;gap:14px;align-items:center;padding:10px 4px;border-bottom:.5px solid var(--line);font-size:14px}
.wsum:last-child{border-bottom:0}
.wsum .meter{margin:0;height:8px}
.wsum .r{text-align:right;font-weight:600}
.wsum .r small{display:block;font-weight:400;color:var(--ink2);font-size:12px}
@media (max-width:560px){.wsum{grid-template-columns:96px 1fr 84px;gap:10px;font-size:13px}}

/* ---------- Pay ---------- */
.period{display:grid;grid-template-columns:1.2fr 1.3fr 1fr;gap:14px;align-items:center;padding:16px 4px;border-bottom:.5px solid var(--line)}
.period:last-child{border-bottom:0}
.period.cur{background:linear-gradient(90deg,var(--accent-tint),transparent);border-radius:14px;padding-left:12px;padding-right:12px}
.period b.t{font-size:15.5px;font-weight:650;display:block}
.period small{color:var(--ink2);font-size:12.5px}
.period .hrs{display:flex;flex-direction:column;gap:4px;font-size:13px}
.period .hrs span{display:flex;align-items:center;gap:7px}
.period .amt{text-align:right}
.period .amt b{font-size:20px;font-weight:700;letter-spacing:-.02em;display:block}
.p-actions{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.p-actions label.tg2{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;background:var(--fill2);border-radius:12px;padding:6px 10px 6px 12px}
.p-actions .switch{transform:scale(.82);transform-origin:right center;margin-right:-6px}
.p-actions input.net{width:120px;height:36px;font-size:15px}
@media (max-width:760px){.period{grid-template-columns:1fr auto}.period .hrs{grid-column:1/-1;flex-direction:row;gap:14px;order:3}.p-actions{order:4}}
.sched{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
.sched .field{margin:0}
@media (max-width:620px){.sched{grid-template-columns:1fr 1fr}.sched .btn{grid-column:1/-1}}

/* ---------- Settings ---------- */
.group-title{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin:24px 6px 8px}
.group-title:first-child{margin-top:0}
.glist{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.gitem{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:52px;border-bottom:.5px solid var(--line)}
.gitem:last-child{border-bottom:0}
.gitem>label,.gitem>.gl{flex:1;font-size:15px;min-width:0}
.gitem .gl small{display:block;color:var(--ink2);font-size:12.5px}
.gitem input:not([type=checkbox]),.gitem select{max-width:210px;height:38px;font-size:16px;text-align:right;background:var(--fill2)}
.gitem input[type=date]{text-align:left}
.gnote{font-size:12.5px;color:var(--ink2);padding:8px 16px 0;line-height:1.45}
.gitem .x{border:0;background:var(--fill);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.gitem .x svg{width:14px;height:14px;stroke-width:2.4}
.prompt{display:block;width:100%;height:240px;resize:vertical;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);background:var(--fill2);border:0;border-radius:12px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.secret{display:flex;align-items:center;gap:10px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.add-hol{display:grid;grid-template-columns:150px 1fr auto;gap:8px;padding:12px 16px}
@media (max-width:560px){.add-hol{grid-template-columns:1fr 1fr}.add-hol .btn{grid-column:1/-1}.gitem input:not([type=checkbox]),.gitem select{max-width:150px}}

/* ---------- Sheet ---------- */
.sheet{position:fixed;inset:0;z-index:60;pointer-events:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.28);opacity:0;transition:opacity .3s}
.sheet-panel{position:absolute;left:50%;top:50%;width:min(480px,calc(100% - 32px));max-height:min(86vh,820px);overflow:auto;background:#fff;border-radius:24px;box-shadow:var(--shadow-lg);padding:24px;transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .35s var(--ease),opacity .25s;overscroll-behavior:contain}
.sheet.open{pointer-events:auto}
.sheet.open .sheet-bg{opacity:1}
.sheet.open .sheet-panel{transform:translate(-50%,-50%) scale(1);opacity:1}
.grabber{display:none}
.sheet-x{position:absolute;right:16px;top:16px;border:0;width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--ink2);display:grid;place-items:center}
.sheet-x svg{width:14px;height:14px;stroke-width:2.6}
.sheet h2{font-size:24px;font-weight:700;margin:2px 0 6px;padding-right:36px}
.sheet h4{font-size:15px;font-weight:650;margin:18px 0 10px}
@media (max-width:760px){
  .sheet-panel{left:0;right:0;top:auto;bottom:0;width:100%;max-height:92vh;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);opacity:1}
  .sheet.open .sheet-panel{transform:translateY(0)}
  .grabber{display:block;width:38px;height:5px;border-radius:3px;background:#D1D1D6;margin:0 auto 12px}
  .sheet-x{top:14px}
}
.daystat{display:inline-flex;gap:6px;align-items:center;margin:4px 0 12px}
.expbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.expbox div{background:var(--fill2);border-radius:12px;padding:10px}
.expbox small{display:block;font-size:11.5px;color:var(--ink2);font-weight:500}
.expbox b{font-size:17px}
.expbox .hl{background:var(--accent-tint)}
.expbox .hl b{color:var(--accent-2)}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:120;background:rgba(29,29,31,.92);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;transition:opacity .25s,transform .35s var(--ease);pointer-events:none;max-width:calc(100% - 32px);backdrop-filter:blur(10px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:760px){.toast{bottom:calc(150px + env(safe-area-inset-bottom))}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Cloud sync ---------- */
.auth-in{position:relative;width:min(360px,100%);display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 16px calc(24px + env(safe-area-inset-bottom));text-align:center}
.auth-in h2{margin-top:6px;font-size:22px;font-weight:600}
.auth-in .sub{margin-bottom:6px}
.auth-in input{background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.1)}
.auth-err{color:var(--bad);font-size:13.5px;min-height:19px}
.sync{position:relative}
.sync::after{content:"";position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px var(--bg);background:var(--ink3)}
.sync[data-st=synced]::after{background:var(--good)}
.sync[data-st=syncing]::after,.sync[data-st=pending]::after{background:var(--accent);animation:pulse 1s infinite}
.sync[data-st=offline]::after{background:#C98A00}
.sync[data-st=error]::after{background:var(--bad)}
</style>
</head>
<body>

<!-- ============ Lock screen ============ -->
<div id="lock" class="lock" role="dialog" aria-label="Enter passcode">
  <div class="lock-glow"></div>
  <div class="lock-in">
    <div class="app-icon"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></div>
    <h2>RA Hours</h2>
    <p id="lock-msg">Enter Passcode</p>
    <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="pad" id="pad"></div>
    <p class="lock-foot"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>Private to your account</p>
  </div>
</div>

<!-- ============ Supabase sign-in (once per device) ============ -->
<div id="auth" class="lock" hidden>
  <div class="lock-glow"></div>
  <form class="auth-in" id="authForm" novalidate>
    <div class="app-icon"><svg class="i" viewBox="0 0 24 24"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.6 9.1 4.75 4.75 0 0 0 7 18.5z"/></svg></div>
    <h2>Sign in to sync</h2>
    <p class="sub">Use the account you created in Supabase → Authentication. You only do this once per device.</p>
    <input type="email" name="email" placeholder="Email" autocomplete="username" required>
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
    <p class="auth-err" id="authErr" aria-live="polite"></p>
    <button class="btn primary block" type="submit">Sign in</button>
    <button class="link" type="button" data-act="skip-auth">Use on this device only for now</button>
  </form>
</div>

<!-- ============ App ============ -->
<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand"><span class="logo"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>RA Hours</div>
      <nav class="seg-nav" id="topnav"></nav>
      <div class="top-actions">
        <button class="btn-add" data-act="quick"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Log</button>
        <button class="icon-btn sync" id="syncbtn" data-act="syncnow" data-st="local" aria-label="Sync status" title="Not syncing"><svg class="i" viewBox="0 0 24 24"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.6 9.1 4.75 4.75 0 0 0 7 18.5z"/></svg></button>
        <button class="icon-btn" data-act="lock" aria-label="Lock"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg></button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <section id="v-overview" class="view"></section>
    <section id="v-log" class="view" hidden></section>
    <section id="v-calendar" class="view" hidden></section>
    <section id="v-pay" class="view" hidden></section>
    <section id="v-settings" class="view" hidden></section>
  </main>
  <button class="fab" data-act="quick" aria-label="Log hours"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="sheet" class="sheet" aria-hidden="true">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="grabber"></div>
    <button class="sheet-x" data-close aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div id="sheet-body"></div>
  </div>
</div>
<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad2 = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const dow = s => pd(s).getDay();                 // 0 = Sunday
const weekKey = s => addDays(s, -((dow(s) + 6) % 7)); // Monday of that week
const todayStr = () => ds(new Date());
const fmt = (s, o) => pd(s).toLocaleDateString('en-US', o);
const fmtShort = s => fmt(s, { month: 'short', day: 'numeric' });
const fmtDay = s => fmt(s, { weekday: 'short', month: 'short', day: 'numeric' });
const fmtLong = s => fmt(s, { weekday: 'long', month: 'long', day: 'numeric' });
const fmtRange = (a, b) => pd(a).getMonth() === pd(b).getMonth()
  ? `${fmtShort(a)} – ${pd(b).getDate()}` : `${fmtShort(a)} – ${fmtShort(b)}`;
const r2 = v => Math.round((+v || 0) * 100) / 100;
const fmtH = h => { h = r2(h); return Number.isInteger(h) ? String(h) : String(h); };
const money = v => { v = r2(v); return (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
const roundQ = x => Math.round(x * 4) / 4;
const minD = (a, b) => (a < b ? a : b), maxD = (a, b) => (a > b ? a : b);

const cyrb53 = (str, seed = 0) => {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
};
const hashPin = p => cyrb53('ra-tracker::' + p, 7);
const DEFAULT_PIN_HASH = '2a7t0ttm862';

const IC = {
  overview: '<svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="9" rx="2"/><rect x="13.5" y="3.5" width="7" height="5" rx="2"/><rect x="13.5" y="11.5" width="7" height="9" rx="2"/><rect x="3.5" y="15.5" width="7" height="5" rx="2"/></svg>',
  log: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  calendar: '<svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  pay: '<svg class="i" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/></svg>',
  settings: '<svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  warn: '<svg class="i" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.1"/></svg>',
  clock: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  info: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 7.8v.1"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  left: '<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',

/* Spread hours across work days: level daily load, never over the weekly cap or

function schedule(from, remIn, useLogs) {
  const rem = { ...remIn }, days = {}, wkPlan = {};
  const end = D.span.end, list = [];
  for (let d = from; d <= end; d = addDays(d, 1)) if (isWorkday(d) && S.jobs.some(j => inJob(j, d))) list.push(d);
  for (let i = 0; i < list.length; i++) {
    const d = list[i];
    const A = S.jobs.filter(j => inJob(j, d) && rem[j.id] > 0.01);
    if (!A.length) continue;
    const live = S.jobs.filter(j => j.end >= d && rem[j.id] > 0.01);
    const R = live.reduce((s, j) => s + rem[j.id], 0);
    let N = 0; for (let x = i; x < list.length; x++) if (live.some(j => inJob(j, list[x]))) N++;
    const w = weekKey(d);
    let k = 0; for (let x = i; x < list.length && weekKey(list[x]) === w; x++) k++;
    const used = (useLogs ? (D.byWeek[w]?.total || 0) : 0) + (wkPlan[w] || 0);
    const dayCap = Math.max(0, Math.min(dcap() - (useLogs ? (D.byDate[d]?.total || 0) : 0), (cap() - used) / k));
    const r = {}; let sumR = 0;
    A.forEach(j => { let n = 0; for (let x = i; x < list.length && list[x] <= j.end; x++) if (inJob(j, list[x])) n++; r[j.id] = rem[j.id] / n; sumR += r[j.id]; });
    const target = Math.min(dayCap, Math.max(R / N, sumR));
    const out = {};
    if (sumR >= target) A.forEach(j => out[j.id] = sumR ? r[j.id] * target / sumR : 0);
    else {
      A.forEach(j => out[j.id] = r[j.id]);
      let extra = target - sumR;
      for (let pass = 0; pass < 3 && extra > 1e-6; pass++) {
        const can = A.filter(j => rem[j.id] - out[j.id] > 1e-6);
        const tot = can.reduce((s, j) => s + rem[j.id] - out[j.id], 0);
        if (!tot) break;
        let gave = 0;
        can.forEach(j => { const add = Math.min(extra * (rem[j.id] - out[j.id]) / tot, rem[j.id] - out[j.id]); out[j.id] += add; gave += add; });
        extra -= gave;

    let tot = 0;
    A.forEach(j => {
      let h = Math.round(out[j.id] * 2) / 2;

      if (rem[j.id] - h < 0.5) h = rem[j.id];

      const dec = Math.min(out[big.id], Math.max(0.25, Math.ceil((tot - dayCap) * 4) / 4));
      out[big.id] -= dec; tot -= dec;

    days[d] = { total: tot };
    A.forEach(j => { if (out[j.id] > 0) { days[d][j.id] = out[j.id]; rem[j.id] -= out[j.id]; } });

}

function derive() {

  const byDate = {}, byWeek = {}, byJob = {};
  S.jobs.forEach(j => byJob[j.id] = 0);
  for (const e of S.entries) {
    if (!jobById(e.job)) continue;
    const b = byDate[e.date] || (byDate[e.date] = { total: 0 });
    b[e.job] = (b[e.job] || 0) + e.hours; b.total += e.hours;
    const w = weekKey(e.date), bw = byWeek[w] || (byWeek[w] = { total: 0 });

function validate(v) {

  if (HOL[v.date]) return `${fmtShort(v.date)} is ${HOL[v.date]} — a stat holiday, no RA work allowed.`;
  if (!inJob(j, v.date)) return `${j.grant} runs ${fmtShort(j.start)} – ${fmtShort(j.end)} only.`;
  if (!(v.hours > 0)) return 'Enter the hours you worked.';
  const others = S.entries.filter(e => e.id !== v.id);
  const day = others.reduce((s, e) => s + (e.date === v.date ? e.hours : 0), 0);
  if (day + v.hours > 24) return 'That’s more than 24 hours in one day.';
  const wk = weekKey(v.date);
  const wkUsed = others.reduce((s, e) => s + (weekKey(e.date) === wk ? e.hours : 0), 0);
  if (wkUsed + v.hours > cap() + 1e-9) return `Week of ${fmtShort(wk)} would hit ${fmtH(wkUsed + v.hours)} h — the limit is ${cap()} h. ${fmtH(Math.max(0, cap() - wkUsed))} h left that week.`;
  const jobUsed = others.reduce((s, e) => s + (e.job === j.id ? e.hours : 0), 0);

const tip = $('#tip');
let tipTouch = false;
function showTip(html, x, y) {
  tip.innerHTML = html; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let L = x + 14, T = y + 14;
  if (L + r.width > innerWidth - 8) L = x - r.width - 14;
  if (T + r.height > innerHeight - 8) T = y - r.height - 14;
  tip.style.transform = `translate(${Math.max(8, L)}px,${Math.max(8, T)}px)`;
}
function hideTip() { tip.hidden = true; }
document.addEventListener('pointerdown', e => { if (!e.target.closest('.chart')) hideTip(); });
function niceMax(v, steps = 4) {
  if (!(v > 0)) return { max: steps, step: 1 };
  const raw = v / steps, p = 10 ** Math.floor(Math.log10(raw)), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  return { max: Math.ceil(v / step - 1e-9) * step, step };
}
const tr = (c, label, val) => `<div class="tr"><span><i class="dot" style="--c:${c}"></i>${label}</span><b>${val}</b></div>`;

function lineChart(host) {
  if (!host) return;
  const W = Math.max(280, host.clientWidth), narrow = W < 520, H = narrow ? 230 : 280;
  const m = { t: 14, r: narrow ? 44 : 64, b: 26, l: 34 };
  const dates = []; for (let d = D.span.start; d <= D.span.end; d = addDays(d, 1)) dates.push(d);
  const n = dates.length, step = (W - m.l - m.r) / (n - 1);
  const X = i => m.l + i * step;
  const lastEntry = S.entries.reduce((a, e) => maxD(a, e.date), '0');
  const actEnd = minD(D.span.end, maxD(D.T, lastEntry));
  const ser = S.jobs.map(j => {
    let cum = 0;
    const act = dates.map(d => { cum += D.byDate[d]?.[j.id] || 0; return cum; });
    const tgt = dates.map(d => d < j.start ? null : (D.base.cum[d]?.[j.id] || 0));
    return { j, c: colorOf(j), act, tgt };
  });
  const top = Math.max(...S.jobs.map(j => +j.hours || 0), ...ser.map(s => s.act[n - 1]));
  const { max: ymax, step: ys } = niceMax(top);
  const Y = v => H - m.b - (v / ymax) * (H - m.t - m.b);
  let g = '';
  for (let v = 0; v <= ymax + 1e-9; v += ys) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EEEEF1"/><text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${fmtH(v)}</text>`;
  let lastLab = -1e9;
  dates.forEach((d, i) => {
    if (dow(d) === 1 && X(i) - lastLab > (narrow ? 56 : 70)) { g += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${fmtShort(d)}</text>`; lastLab = X(i); }
  });
  const ti = dates.indexOf(D.T);
  if (ti >= 0) g += `<line x1="${X(ti)}" x2="${X(ti)}" y1="${m.t}" y2="${H - m.b}" stroke="#1D1D1F" stroke-opacity=".25"/><text x="${X(ti)}" y="${m.t - 2}" text-anchor="middle" class="vlab">Today</text>`;
  const aEnd = dates.indexOf(actEnd);
  ser.forEach(s => {
    const tp = s.tgt.map((v, i) => v == null ? null : `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean);
    g += `<polyline points="${tp.join(' ')}" fill="none" stroke="${s.c}" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    const si = Math.max(0, dates.indexOf(s.j.start));
    if (aEnd >= si) {
      const ap = []; for (let i = si; i <= aEnd; i++) ap.push(`${X(i).toFixed(1)},${Y(s.act[i]).toFixed(1)}`);
      const area = `M${X(si)},${Y(0)} L${ap.join(' L')} L${X(aEnd)},${Y(0)}Z`;
      g += `<path d="${area}" fill="${s.c}" fill-opacity=".08"/><polyline points="${ap.join(' ')}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      g += `<circle cx="${X(aEnd)}" cy="${Y(s.act[aEnd])}" r="4.5" fill="${s.c}" stroke="#fff" stroke-width="2"/>`;
    }
  });
  // end labels (avoid collisions)
  const labs = ser.filter(s => actEnd >= s.j.start).map(s => ({ y: Y(s.act[Math.max(0, aEnd)]), t: `${fmtH(s.act[Math.max(0, aEnd)])} h`, x: X(Math.max(0, aEnd)) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < labs.length; i++) if (labs[i].y - labs[i - 1].y < 14) labs[i].y = labs[i - 1].y + 14;
  labs.forEach(l => g += `<text x="${l.x + 9}" y="${l.y + 4}" class="endlab">${l.t}</text>`);
  // final target labels at right
  ser.forEach(s => g += `<text x="${W - m.r + 6}" y="${Y(s.tgt[n - 1] || 0) + 4}" class="vlab">${fmtH(s.j.hours)}</text>`);
  const cross = `<g class="cross" visibility="hidden"><line class="cl" y1="${m.t}" y2="${H - m.b}" stroke="#1D1D1F" stroke-opacity=".35"/>${ser.map(s => `<circle class="cd" r="4.5" fill="${s.c}" stroke="#fff" stroke-width="2"/>`).join('')}</g>`;
  host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative hours entered versus target">${g}${cross}<rect class="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/></svg>`;
  const svg = host.firstChild, cg = svg.querySelector('.cross'), cl = cg.querySelector('.cl'), cds = cg.querySelectorAll('.cd');
  const move = e => {
    const r = svg.getBoundingClientRect();
    const i = clamp(Math.round((e.clientX - r.left - m.l) / step), 0, n - 1), d = dates[i];
    cg.setAttribute('visibility', 'visible'); cl.setAttribute('x1', X(i)); cl.setAttribute('x2', X(i));
    let rows = '';
    ser.forEach((s, k) => {
      const showA = d <= actEnd && d >= s.j.start;
      cds[k].setAttribute('visibility', showA ? 'visible' : 'hidden');
      cds[k].setAttribute('cx', X(i)); cds[k].setAttribute('cy', Y(s.act[i]));
      if (d < s.j.start) { rows += tr(s.c, esc(s.j.grant), 'not started'); return; }
      const t = s.tgt[i] || 0;
      rows += tr(s.c, esc(s.j.grant) + (showA ? ' entered' : ' target'), showA ? `${fmtH(s.act[i])} h` : `${fmtH(t)} h`);
      if (showA) { const gp = t - s.act[i]; rows += `<div class="tr"><span style="padding-left:15px">target ${fmtH(t)} h</span><b style="color:${gp > 0.01 ? 'var(--accent-2)' : 'var(--good)'}">${gp > 0.01 ? '−' + fmtH(gp) + ' h' : 'on track'}</b></div>`; }
    });
    showTip(`<h5>${fmtDay(d)}${HOL[d] ? ' · ' + esc(HOL[d]) : isWeekend(d) ? ' · weekend' : ''}</h5>${rows}`, e.clientX, e.clientY);
  };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerdown', e => { tipTouch = e.pointerType === 'touch'; move(e); });
  svg.addEventListener('pointerleave', () => { if (!tipTouch) { cg.setAttribute('visibility', 'hidden'); hideTip(); } });
}

function roundTop(x, y, w, h, r) {
  r = Math.min(r, h, w / 2);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
let chartSeq = 0;
function barChart(host, cfg) {
  if (!host) return;
  const W = Math.max(280, host.clientWidth), narrow = W < 520, H = narrow ? 220 : 260;
  const m = { t: 22, r: cfg.cap ? (narrow ? 8 : 12) : 8, b: 26, l: cfg.money ? 46 : 34 };
  const cats = cfg.cats, n = cats.length, band = (W - m.l - m.r) / n, bw = Math.min(24, band * .62);
  const totals = cats.map(c => c.segs.reduce((s, x) => s + x.v, 0));
  const { max: ymax, step: ys } = niceMax(Math.max(cfg.cap ? cfg.cap * 1.08 : 0, ...totals, cfg.floor || 0));
  const Y = v => H - m.b - (v / ymax) * (H - m.t - m.b);
  const fv = cfg.money ? money : v => fmtH(v);
  const id = 'b' + (++chartSeq);
  let defs = '<defs>' + S.jobs.map((j, k) => `<pattern id="${id}h${k}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="${colorOf(j)}" fill-opacity=".14"/><rect width="2" height="5" fill="${colorOf(j)}" fill-opacity=".5"/></pattern>`).join('') + '</defs>';
  let g = '';
  for (let v = 0; v <= ymax + 1e-9; v += ys) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EEEEF1"/><text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${cfg.money ? '$' + (v >= 1000 ? (v / 1000) + 'k' : v) : fmtH(v)}</text>`;
  let cols = '';
  const every = band < 34 ? Math.ceil(34 / band) : 1;
  cats.forEach((c, i) => {
    const x = m.l + band * i + band / 2 - bw / 2;
    let y = Y(0), parts = '';
    const segs = c.segs.filter(s => s.v > 0);
    segs.forEach((s, k) => {
      const h = Y(0) - Y(s.v), top = k === segs.length - 1;
      const gapPx = k > 0 ? 2 : 0, hh = Math.max(0, h - gapPx), yy = y - gapPx - hh;
      const fill = s.ghost ? `url(#${id}h${S.jobs.findIndex(j => j.id === s.job)})` : s.color;
      parts += top ? `<path d="${roundTop(x, yy, bw, hh, 4)}" fill="${fill}"/>` : `<rect x="${x}" y="${yy}" width="${bw}" height="${hh}" fill="${fill}"/>`;
      y = yy;
    });
    const real = c.segs.filter(s => !s.ghost).reduce((a, s) => a + s.v, 0), tot = totals[i];
    if (!narrow || band >= 30) {
      if (real > 0) parts += `<text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" class="vlab">${cfg.money ? money(real).replace('.00', '') : fmtH(real)}</text>`;
      else if (tot > 0) parts += `<text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle">~${cfg.money ? money(tot) : fmtH(tot)}</text>`;
    }
    if (i % every === 0) parts += `<text x="${x + bw / 2}" y="${H - 7}" text-anchor="middle"${c.now ? ' class="vlab"' : ''}>${esc(c.label)}</text>`;
    cols += `<g class="col" data-i="${i}">${parts}<rect class="hitc" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${H - m.t - m.b}" fill="transparent"/></g>`;
  });
  if (cfg.cap) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(cfg.cap)}" y2="${Y(cfg.cap)}" stroke="#1D1D1F" stroke-width="1.5"/><text x="${W - m.r}" y="${Y(cfg.cap) - 6}" text-anchor="end" class="vlab">${cfg.cap} h limit</text>`;
  host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.label)}">${defs}${g}${cols}</svg>`;
  const svg = host.firstChild;
  const on = e => {
    const col = e.target.closest('.col'); if (!col) return;
    svg.classList.add('hovering'); $$('.col', svg).forEach(c => c.classList.toggle('hl', c === col));
    showTip(cats[+col.dataset.i].tip, e.clientX, e.clientY);
  };
  svg.addEventListener('pointermove', on);
  svg.addEventListener('pointerdown', e => { tipTouch = e.pointerType === 'touch'; on(e); });
  svg.addEventListener('pointerleave', () => { if (!tipTouch) { svg.classList.remove('hovering'); hideTip(); } });
}
function weekChart(host) {

}
function bindForm(form, after) {
  const F = form.elements;
  let job = form.querySelector('[data-job].on').dataset.job;
  const read = () => ({ id: form.dataset.id || null, job, date: F.date.value, hours: roundQ(parseFloat(F.hours.value)), note: F.note.value.trim() });
  const hint = form.querySelector('.hint');
  const upd = () => {
    const v = read();
    let err = validate(v);
    if (!(v.hours > 0) && err === 'Enter the hours you worked.') err = null;
    const j = jobById(job);
    if (err) { hint.className = 'hint err'; hint.innerHTML = IC.warn + `<span>${esc(err)}</span>`; }
    else if (v.date && v.hours > 0) {
      const wk = weekKey(v.date), used = S.entries.filter(e => e.id !== v.id && weekKey(e.date) === wk).reduce((s, e) => s + e.hours, 0);
      hint.className = 'hint ok'; hint.innerHTML = IC.check + `<span>+${money(v.hours * j.rate)} · week of ${fmtShort(wk)} → ${fmtH(used + v.hours)} / ${cap()} h</span>`;
    } else if (v.date) {
      const wk = weekKey(v.date), used = S.entries.filter(e => e.id !== v.id && weekKey(e.date) === wk).reduce((s, e) => s + e.hours, 0);
      const tg = D.base.days[v.date]?.[job];
      hint.className = 'hint'; hint.innerHTML = IC.info + `<span>${fmtH(Math.max(0, cap() - used))} h left that week${tg ? ` · target for this day ${fmtH(tg)} h` : ''} · ${fmtH(Math.max(0, j.hours - (D.byJob[job] || 0)))} h left on ${esc(j.grant)}</span>`;
    } else { hint.className = 'hint'; hint.innerHTML = IC.info + '<span>Pick a weekday inside the contract dates.</span>'; }
    if (!form.dataset.id) formMem = { job, date: v.date };
  };
  form.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.job) {
      job = b.dataset.job;
      form.querySelectorAll('[data-job]').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b); });
      const j = jobById(job); F.date.min = j.start; F.date.max = j.end;
      upd();
    } else if (b.dataset.step) {
      F.hours.value = Math.max(0, roundQ((parseFloat(F.hours.value) || 0) + parseFloat(b.dataset.step))) || ''; upd();
    } else if (b.dataset.quick) {
      F.hours.value = b.dataset.quick; upd();
    } else if (b.hasAttribute('data-del')) {
      if (confirm('Delete this entry?')) { S.entries = S.entries.filter(x => x.id !== form.dataset.id); save(); renderAll(); closeSheet(); toast('Entry deleted'); }
    }
  });
  form.addEventListener('input', e => {
    if (e.target === F.from || e.target === F.to) {
      const a = F.from.value, b = F.to.value;
      if (a && b) { const [h1, m1] = a.split(':').map(Number), [h2, m2] = b.split(':').map(Number); const h = roundQ((h2 * 60 + m2 - h1 * 60 - m1) / 60); if (h > 0) F.hours.value = h; }
    }
    upd();
  });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = read(), err = validate(v);
    if (err) { hint.className = 'hint err'; hint.innerHTML = IC.warn + `<span>${esc(err)}</span>`; hint.classList.remove('shake'); void hint.offsetWidth; hint.classList.add('shake'); return; }
    const j = jobById(v.job);
    if (v.id) { const x = S.entries.find(z => z.id === v.id); Object.assign(x, { job: v.job, date: v.date, hours: v.hours, note: v.note }); }
    else S.entries.push({ id: uid(), job: v.job, date: v.date, hours: v.hours, note: v.note, created: Date.now() });
    S.lastJob = v.job; save();
    toast(v.id ? 'Entry updated' : `Logged ${fmtH(v.hours)} h · +${money(v.hours * j.rate)}`);
    after && after(v);
    renderAll();
  });
  upd();
}

/* =====================================================================
   Calendar view
   ===================================================================== */
function dayInfo(d) {
  if (isWeekend(d)) return { k: 'neutral', t: 'Weekend — no RA work allowed', i: 'info' };
  if (HOL[d]) return { k: 'bad', t: `${HOL[d]} — stat holiday, no work`, i: 'warn' };
  const js = S.jobs.filter(j => inJob(j, d));
  if (!js.length) return { k: 'neutral', t: 'Outside both contract periods', i: 'info' };
  return { k: 'good', t: 'Work day · ' + js.map(j => j.grant).join(' & '), i: 'check', jobs: js };
}
function renderCalendar() {
  const months = []; for (let m = D.span.start.slice(0, 7); m <= D.span.end.slice(0, 7);) { months.push(m); const [y, mo] = m.split('-').map(Number); m = mo === 12 ? `${y + 1}-01` : `${y}-${pad2(mo + 1)}`; }
  if (!calMonth || !months.includes(calMonth)) calMonth = months.includes(D.T.slice(0, 7)) ? D.T.slice(0, 7) : months[0];
  const mi = months.indexOf(calMonth);
  const [y, mo] = calMonth.split('-').map(Number);
  const first = `${calMonth}-01`, lead = (dow(first) + 6) % 7, dim = new Date(y, mo, 0).getDate(), last = `${calMonth}-${pad2(dim)}`;
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<div class="cell blank"></div>';
  let mH = 0, mUSD = 0, mWork = 0, mMissing = 0;
  for (let k = 1; k <= dim; k++) {
    const d = `${calMonth}-${pad2(k)}`, b = D.byDate[d], p = d >= D.T ? D.plan.days[d] : null;
    const wk = isWeekend(d), hol = HOL[d], out = !S.jobs.some(j => inJob(j, d));
    const work = !wk && !hol && !out;
    if (work) mWork++;
    const missing = work && d < D.T && !b;
    if (missing) mMissing++;
    if (b) { mH += b.total; mUSD += S.jobs.reduce((s, j) => s + (b[j.id] || 0) * j.rate, 0); }
    const lt = b?.total || 0, pt = p?.total || 0, tt = lt + pt;
    const bars = tt ? `<span class="cb" style="width:${Math.min(100, tt / dcap() * 100)}%">${S.jobs.map(j => (b?.[j.id] ? `<i style="--c:${colorOf(j)};flex:${b[j.id]}"></i>` : '') + (p?.[j.id] ? `<i class="ghost" style="--c:${colorOf(j)};flex:${p[j.id]}"></i>` : '')).join('')}</span>` : '';
    const cls = ['cell', wk && 'wkend', hol && 'hol', out && !wk && 'out', d === D.T && 'today', missing && 'miss'].filter(Boolean).join(' ');
    const label = `${fmtLong(d)}${hol ? ', ' + hol : ''}${lt ? `, ${fmtH(lt)} hours logged` : ''}${pt ? `, ${fmtH(pt)} planned` : ''}${missing ? ', nothing logged' : ''}`;
    cells += `<button class="${cls}" data-day="${d}" aria-label="${esc(label)}"><span class="n">${k}</span>${hol ? `<span class="tg">${innerWidth < 760 ? 'Stat' : esc(hol)}</span>` : ''}${bars}${lt ? `<span class="hv">${fmtH(lt)}h</span>` : pt ? `<span class="hv plan">~${fmtH(pt)}h</span>` : ''}</button>`;
  }
  const weeks = [];
  for (let w = weekKey(first); w <= last; w = addDays(w, 7)) weeks.push(w);
  $('#v-calendar').innerHTML = `
    <div class="head"><div><p class="eyebrow">Weekends &amp; stat holidays blocked</p><h1>Calendar</h1></div></div>
    <div class="stack">
      <div class="card">
        <div class="card-head">
          <div class="cal-nav"><button class="icon-btn" data-cal="-1" ${mi <= 0 ? 'disabled style="opacity:.3"' : ''} aria-label="Previous month">${IC.left}</button><h3>${pd(first).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</h3><button class="icon-btn" data-cal="1" ${mi >= months.length - 1 ? 'disabled style="opacity:.3"' : ''} aria-label="Next month">${IC.right}</button></div>
          <div class="legend">${S.jobs.map(j => `<span><i class="sw" style="--c:${colorOf(j)}"></i>${esc(j.grant)}</span>`).join('')}<span><i class="sw ghost" style="--c:var(--ink2)"></i>Suggested</span><span><i class="dot" style="--c:var(--accent)"></i>Nothing logged</span></div>
        </div>
        <div class="cal-dow">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(x => `<span>${innerWidth < 760 ? x[0] : x}</span>`).join('')}</div>
        <div class="cal">${cells}</div>
        <p class="sub" style="margin-top:14px">${fmtH(mH)} h · ${money(mUSD)} entered this month · ${mWork} work days${mMissing ? ` · <b style="color:var(--accent-2)">${mMissing} empty</b>` : ''}</p>
      </div>
      <div class="card">
        <div class="card-head" style="margin-bottom:4px"><h3>Weeks</h3><p class="sub">Entered + suggested vs. the ${cap()} h limit</p></div>

          return `<div class="wsum"><span>${fmtRange(w, addDays(w, 6))}</span><span class="meter">${S.jobs.map(j => { const h = D.byWeek[w]?.[j.id] || 0; return h ? `<i style="--c:${colorOf(j)};width:${h / cap() * 100}%"></i>` : ''; }).join('')}${S.jobs.map(j => { const h = plannedWeek(w, j.id); return h ? `<i class="ghost" style="--c:${colorOf(j)};width:${h / cap() * 100}%"></i>` : ''; }).join('')}</span><span class="r">${fmtH(used)}${pl ? ` +${fmtH(pl)}` : ''} / ${cap()} h<small>target ${fmtH(tg)} h</small></span></div>`;
        }).join('')}
      </div>
    </div>`;
}
function openDay(d) {
  const info = dayInfo(d), es = S.entries.filter(e => e.date === d && jobById(e.job));
  const p = D.plan.days[d], wk = weekKey(d), used = D.byWeek[wk]?.total || 0;
  const tgtBy = expBy(d), logBy_ = logBy(d), g = tgtBy - logBy_;
  const usdGap = S.jobs.reduce((s, j) => s + Math.max(0, expBy(d, j.id) - logBy(d, j.id)) * j.rate, 0);
  const dayT = D.base.days[d];
  let job = info.jobs ? (info.jobs.find(j => j.id === S.lastJob) || info.jobs[0]).id : null;
  // if this day's target is for one job only, prefill with it
  let hours = '';
  if (info.jobs && !es.length && dayT) {
    const firstMissing = info.jobs.find(j => dayT[j.id]);
    if (firstMissing) { job = firstMissing.id; if (d < D.T) hours = dayT[job]; }
  }
  const html = `
    <p class="eyebrow">${fmt(d, { weekday: 'long' })}</p>
    <h2>${fmt(d, { month: 'long', day: 'numeric', year: 'numeric' })}</h2>

      <div class="${g > 0.01 ? 'hl' : ''}"><small>${g > 0.01 ? (d >= D.T ? 'Still to log' : 'Missing') : 'Ahead'}</small><b>${g > 0.01 ? fmtH(g) + ' h · ' + money(usdGap) : fmtH(-g) + ' h'}</b></div>
    </div>` : ''}
    <p class="sub" style="margin:8px 0 2px">Week of ${fmtShort(wk)}: ${fmtH(used)} / ${cap()} h used${dayT ? ` · target this day: ${S.jobs.filter(j => dayT[j.id]).map(j => `${esc(j.grant)} ${fmtH(dayT[j.id])} h`).join(', ')}` : ''}${p && d >= D.T ? ` · suggested: ${S.jobs.filter(j => p[j.id]).map(j => `${esc(j.grant)} ${fmtH(p[j.id])} h`).join(', ')}` : ''}</p>

    ${info.jobs ? `<h4>${es.length ? 'Add more' : 'Add hours'}</h4>${formHTML({ job, date: d, hours })}` : ''}`;
  openSheet(html, body => { const f = body.querySelector('form'); if (f) bindForm(f, () => closeSheet()); });
}

      if (usd) { hint.className = 'hint ok'; hint.innerHTML = IC.check + `<span>${money(usd)} gross for this period</span>`; }
    };

      for (const j of S.jobs) {
        const raw = f.elements[j.id].value; if (raw === '' || f.elements[j.id].disabled) continue;
        const total = roundQ(parseFloat(raw)); if (!(total >= 0)) continue;
        const res = spread(entries, p, j, total);

function spread(entries, p, j, total) {
  const others = entries.filter(e => !(e.job === j.id && e.date >= p.start && e.date <= p.end));
  const used = others.filter(e => e.job === j.id).reduce((s, e) => s + e.hours, 0);
  if (used + total > j.hours + 1e-9) return { err: `${j.grant}: only ${fmtH(Math.max(0, j.hours - used))} h left on the contract outside this period.` };
  if (total === 0) return { entries: others };
  const days = []; for (let d = p.start; d <= p.end; d = addDays(d, 1)) if (isWorkday(d) && inJob(j, d)) days.push(d);
  const fill = pool => {
    const wu = {}, du = {}; others.forEach(e => { const w = weekKey(e.date); wu[w] = (wu[w] || 0) + e.hours; du[e.date] = (du[e.date] || 0) + e.hours; });
    const alloc = {}; let left = total, moved = true;
    while (left > 1e-9 && moved) {
      moved = false;
      for (const d of pool) {
        if (left <= 1e-9) break;
        const w = weekKey(d), st = Math.min(0.25, left);
        if ((wu[w] || 0) + st <= cap() + 1e-9 && (du[d] || 0) + (alloc[d] || 0) + st <= 24) { alloc[d] = (alloc[d] || 0) + st; wu[w] = (wu[w] || 0) + st; left -= st; moved = true; }
      }
    }
    return { alloc, left };
  };
  const past = days.filter(d => d <= D.T);
  let res = past.length ? fill(past) : { left: total };
  if (res.left > 1e-9) res = fill(days);
  if (res.left > 1e-9) return { err: `${j.grant}: ${fmtH(total)} h doesn’t fit in this period under the ${cap()} h/week limit (max about ${fmtH(total - res.left)} h).` };
  const now = Date.now();
  const add = Object.entries(res.alloc).map(([d, h]) => ({ id: uid(), job: j.id, date: d, hours: r2(h), note: '', bulk: true, created: now }));
  return { entries: others.concat(add) };
}

const loadBase = () => { try { return JSON.parse(localStorage.getItem(BASE_KEY)); } catch (e) { return null; } };

function toRows(st, uid) {
  const s = st.settings, o = { settings: {}, jobs: {}, holidays: {}, pay_periods: {}, entries: {} };
  o.settings[uid] = {
    user_id: uid, weekly_cap: Math.round((+s.weeklyCap || 35) * 10) / 10, daily_cap: Math.round((+s.dailyCap || 8) * 10) / 10,
    pay_anchor: s.payAnchor, payday_offset: Math.round(+s.paydayOffset || 0), auto_lock_min: Math.round(+s.autoLock || 0),
    pin_hash: s.pinHash || null, last_job: st.lastJob || null, timer: st.timer ? { job: st.timer.job, start: st.timer.start } : null,
  };
  st.jobs.forEach((j, i) => o.jobs[j.id] = { user_id: uid, id: j.id, grant_name: j.grant, professor: j.prof, start_date: j.start, end_date: j.end, hourly_rate: r2(j.rate), contract_hours: r2(j.hours), sort_order: i });
  (s.holidays || []).forEach(h => o.holidays[h.id] = { user_id: uid, id: h.id, holiday_date: h.date, name: h.name, enabled: !!h.on });
  Object.entries(st.pay || {}).forEach(([k, r]) => o.pay_periods[k] = { user_id: uid, period_start: k, timesheet_submitted: !!r.sub, received: !!r.got, net_amount: r.net == null || isNaN(r.net) ? null : r2(r.net) });
  st.entries.forEach(e => o.entries[e.id] = { user_id: uid, id: e.id, job_id: e.job, work_date: e.date, hours: r2(e.hours), note: e.note || null, from_period_total: !!e.bulk, created_at: new Date(e.created || 0).toISOString() });
  return o;
}
function fromServer(R) {
  const set = R.settings[0] || {}, d = DEFAULT();
  const jobs = R.jobs.slice().sort((a, b) => a.sort_order - b.sort_order)
    .map(j => ({ id: j.id, grant: j.grant_name, prof: j.professor, start: j.start_date, end: j.end_date, rate: +j.hourly_rate, hours: +j.contract_hours }));
  return {
    v: 1,
    jobs: jobs.length === 2 ? jobs : d.jobs,
    entries: R.entries.map(e => ({ id: e.id, job: e.job_id, date: e.work_date, hours: +e.hours, note: e.note || '', bulk: !!e.from_period_total, created: Date.parse(e.created_at) || 0 })),
    settings: {
      weeklyCap: +(set.weekly_cap ?? 35), dailyCap: +(set.daily_cap ?? 8), payAnchor: set.pay_anchor || d.settings.payAnchor,
      paydayOffset: +(set.payday_offset ?? 5), autoLock: +(set.auto_lock_min ?? 5), pinHash: set.pin_hash || DEFAULT_PIN_HASH,
      holidays: R.holidays.map(h => ({ id: h.id, date: h.holiday_date, name: h.name, on: !!h.enabled })),
    },
    pay: Object.fromEntries(R.pay_periods.map(p => [p.period_start, { sub: !!p.timesheet_submitted, got: !!p.received, net: p.net_amount == null ? null : +p.net_amount }])),
    timer: set.timer || null,
    lastJob: set.last_job || d.lastJob,
  };
}
async function pull() {
  const names = Object.keys(TBL), R = {};
  const res = await Promise.all(names.map(t => sb.from(t).select('*')));
  res.forEach((r, i) => { if (r.error) throw r.error; R[names[i]] = r.data; });
  return R;
}
async function push() {
  const cur = toRows(S, user.id), b = base || { settings: {}, jobs: {}, holidays: {}, pay_periods: {}, entries: {} };
  const same = (x, y) => JSON.stringify(x) === JSON.stringify(y);
  const run = async q => { const { error } = await q; if (error) throw error; };
  const up = async t => { const rows = Object.keys(cur[t]).filter(k => !b[t]?.[k] || !same(cur[t][k], b[t][k])).map(k => cur[t][k]); if (rows.length) await run(sb.from(t).upsert(rows, { onConflict: TBL[t] })); };
  const del = async t => { const ids = Object.keys(b[t] || {}).filter(k => !cur[t][k]); if (ids.length) await run(sb.from(t).delete().in(t === 'pay_periods' ? 'period_start' : 'id', ids)); };
  // Order matters for the database rules: parents first, removed entries before new ones.
  await up('settings'); await up('jobs'); await up('holidays'); await del('holidays');
  await del('entries'); await up('entries'); await up('pay_periods'); await del('pay_periods'); await del('jobs');
  base = cur; saveBase();
}
const hasPending = () => !!(user && base && JSON.stringify(toRows(S, user.id)) !== JSON.stringify(base));
function scheduleSync() { if (!user || !sb) return; dirty = true; setStatus('pending'); clearTimeout(syncT); syncT = setTimeout(runSync, 350); }
async function runSync() {
  if (!user || !sb) return;
  if (syncing) { dirty = true; return; }
  syncing = true; dirty = false; setStatus('syncing');
  try { await push(); setStatus('synced'); }
  catch (err) {
    if (isNet(err)) setStatus('offline');
    else { toast('Not saved: ' + cleanErr(err)); await resetFromServer(); }
  } finally {
    syncing = false;
    if (dirty && status !== 'offline') { dirty = false; runSync(); }
  }
}
function applyServer(R) {
  const next = fromServer(R), nb = toRows(next, user.id);
  const changed = JSON.stringify(nb) !== JSON.stringify(toRows(S, user.id));
  S = next; base = nb; saveBase(); cacheLocal();
  if (changed && !APP.hidden) { renderAll(); if (view === 'settings') renderSettings(); }
}
async function resetFromServer() {
  try { applyServer(await pull()); setStatus('synced'); } catch (e) { setStatus(isNet(e) ? 'offline' : 'error'); }
}
async function refresh() {
  if (!user || !sb || syncing) return;
  lastPull = Date.now();
  try {
    if (hasPending()) { await runSync(); if (status !== 'synced') return; }
    applyServer(await pull()); setStatus('synced');
  } catch (e) { setStatus(isNet(e) ? 'offline' : 'error'); }
}
async function startCloud() {
  if (cloudSkipped) return setStatus('local');
  try { await client(); } catch (e) { setStatus('offline'); return; }
  const { data } = await sb.auth.getSession();
  user = data.session?.user || null;
  if (!user) { showAuth(); return; }
  cloudStarted = true;
  await initialSync();
}
async function initialSync() {
  setStatus('syncing');
  try {
    const R = await pull(), stored = loadBase();
    if (!R.settings.length && !R.jobs.length) {
      // Brand-new cloud: upload everything on this device (defaults + any local entries).
      try { localStorage.setItem('raTracker.preSync', JSON.stringify(S)); } catch (e) {}
      base = null; await push();
      toast(S.entries.length ? `Uploaded ${S.entries.length} entries to Supabase` : 'Connected to Supabase');
    } else if (stored && stored.uid === user.id) {
      // Returning device: send anything changed offline, then take the server copy.
      base = stored.rows; if (hasPending()) await push(); applyServer(await pull());
    } else {
      // First sign-in on this device: cloud wins, but keep entries that only exist here.
      const local = S, srv = fromServer(R), ids = new Set(srv.entries.map(e => e.id));
      const extra = local.entries.filter(e => !ids.has(e.id) && srv.jobs.some(j => j.id === e.job));
      base = toRows(srv, user.id); saveBase();
      S = srv; S.entries = srv.entries.concat(extra);
      Object.entries(local.pay || {}).forEach(([k, r]) => { if (!S.pay[k]) S.pay[k] = r; });
      cacheLocal();
      if (hasPending()) { await push(); if (extra.length) toast(`Added ${extra.length} entries from this device`); }
    }
    lastPull = Date.now();
    setStatus('synced'); renderAll(); if (view === 'settings') renderSettings();
  } catch (err) {
    if (isNet(err)) setStatus('offline');
    else { setStatus('error'); toast('Supabase: ' + cleanErr(err)); if (base) await resetFromServer(); }
  }
}
function showAuth() {
  const a = $('#auth'); a.hidden = false; a.classList.remove('out');
  $('#authErr').textContent = '';
  setTimeout(() => $('#authForm').elements.email.focus(), 50);
}
$('#authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('[type=submit]'), err = $('#authErr');
  const email = f.elements.email.value.trim(), password = f.elements.password.value;
  if (!email || !password) { err.textContent = 'Enter your email and password.'; return; }
  btn.disabled = true; err.textContent = '';
  try {
    await client();
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    user = data.user; f.elements.password.value = '';
    $('#auth').hidden = true; cloudSkipped = false; cloudStarted = true;
    await initialSync();
  } catch (ex) {
    err.textContent = isNet(ex) ? 'No connection — try again when you’re online.' : (ex.message || 'Sign-in failed');
  } finally { btn.disabled = false; }
});
/* =====================================================================
   AI agent access (token-based, see agent-setup.sql)
   An agent in another chat logs hours through the agent_* functions with a
   personal token. The token only reaches entries and can be revoked here.
   ===================================================================== */
const TOKEN_KEY = 'raTracker.agentToken';
let tokens = null;
const storedToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } };
function buildPrompt(tok) {
  const t = tok || '<PASTE_AGENT_TOKEN>', cap = S.settings.weeklyCap;
  const jobs = S.jobs.map(j => `- ${j.grant} (job "${j.id}"): ${j.prof}, ${j.start} to ${j.end}, $${j.rate}/h CAD, ${j.hours} h contract`).join('\n');
  return `You log my university RA work hours into my "RA Hours" tracker. It is a Supabase database you reach over HTTPS from your terminal (curl). When I describe work I did, turn it into entries and log them with the functions below. You need no other credentials; never ask for my password or a secret key.

## Connection
- POST ${SB_URL}/rest/v1/rpc/<function_name> with a JSON body of named parameters
- Headers (all required):
  apikey: ${SB_KEY}
  Content-Type: application/json
  Content-Profile: ra_tracker
- Every body includes "p_token": "${t}"
  (my personal agent token: it only reaches my hours, only through these functions)

## My positions
${jobs}

## Functions
1. agent_status {p_token} → {today, weekly_cap, this_week_start, this_week_hours, positions: [{job, grant, professor, start, end, rate, contract_hours, logged_hours, remaining_hours, earned_cad}], holidays: [date]}
   Call this first, every session.
2. agent_list {p_token, p_from?, p_to?} → [{id, job, date, hours, note}]. No dates = the current Mon–Sun week.
3. agent_log {p_token, p_job: "IRF" | "URAF", p_date: "YYYY-MM-DD", p_hours, p_note?} → the new entry. Hours round to 0.25.
4. agent_update {p_token, p_id, p_changes: {job?, date?, hours?, note?}} → the updated entry.
5. agent_delete {p_token, p_id} → {"deleted": id}.

## Rules (the database enforces them; a break comes back as "RA rule: …")
- Weekdays only, never an enabled stat holiday, only inside that position's dates.
- At most ${cap} h per Mon–Sun week across both positions, and never past a position's contract hours.
- Dates are America/Toronto. Work out "yesterday", "Monday" etc. from "today" in agent_status.
- If I don't say which position or which day, ask. If I give one total for several days ("10 h on IRF this week"), propose a split over the weekdays (≤ 8 h a day) and confirm before logging.
- Call agent_list for those dates before logging, so you don't log the same work twice. Ask before deleting anything.
- p_note: a short description of the work in my words (≤ 140 characters).
- After acting, reply with a short table (date, position, hours, $ = hours × rate) and the new totals from agent_status.
- "Invalid or revoked agent token" → ask me for a new one (RA Hours → Settings → AI agent).

## Example
curl -s -X POST '${SB_URL}/rest/v1/rpc/agent_log' \\
  -H 'apikey: ${SB_KEY}' -H 'Content-Type: application/json' -H 'Content-Profile: ra_tracker' \\
  -d '{"p_token":"${t}","p_job":"IRF","p_date":"${D?.T || ds(new Date())}","p_hours":3.5,"p_note":"Literature review"}'`;
}
function agentHTML() {
  const tok = storedToken();
  if (user && tokens === null) loadTokens().then(() => { if (view === 'settings') renderSettings(); });
  return `
      <p class="group-title">AI agent</p>
      <div class="glist">
        <div class="gitem"><div class="gl">Let an AI log your hours<small>Copy the prompt into a new chat with an agent that can run terminal commands, then tell it what you worked on</small></div><button class="btn sm primary" data-act="copy-prompt">${IC.copy}Copy prompt</button></div>
        ${user ? `
        <div class="gitem"><div class="gl">Agent token<small>${tok ? 'Saved on this device and filled into the prompt' : 'Create one so the prompt works'}</small></div><button class="btn sm tint" data-act="new-token">${IC.key}${tok ? 'New token' : 'Create token'}</button></div>
        ${tok ? `<div class="gitem"><span class="secret" style="flex:1">${esc(tok)}</span><button class="btn sm plain" data-act="copy-token">${IC.copy}Copy</button></div>` : ''}
        ${(tokens || []).map(x => `<div class="gitem"><div class="gl">${esc(x.label)} · rah_…${esc(x.token_hint)}<small>Created ${fmtLong(x.created_at.slice(0, 10))} · ${x.last_used_at ? 'last used ' + fmtLong(x.last_used_at.slice(0, 10)) : 'never used'}</small></div><button class="btn sm danger" data-act="revoke" data-id="${x.id}" data-hint="${esc(x.token_hint)}">Revoke</button></div>`).join('')}` : `
        <div class="gitem"><div class="gl">Agent token<small>Sign in to Supabase first to create one</small></div><button class="btn sm plain" data-act="signin">Sign in</button></div>`}
        <div class="gitem" style="display:block"><textarea class="prompt" readonly spellcheck="false" aria-label="Agent prompt">${esc(buildPrompt(tok))}</textarea></div>
      </div>
      <p class="gnote">Anyone with this prompt can add and change your entries until you revoke the token. It never contains your password or secret key, and every entry still has to pass the university rules.</p>`;
}
async function loadTokens() {
  if (!user || !sb) { tokens = null; return; }
  const { data, error } = await sb.from('agent_tokens').select('id,label,token_hint,created_at,last_used_at').order('created_at', { ascending: false });
  tokens = error ? [] : data;
  if (error) toast('Couldn’t load tokens: ' + (/agent_tokens/.test(error.message) ? 'run agent-setup.sql first.' : cleanErr(error)));
}
async function createToken() {
  if (!user || !sb) return toast('Sign in first');
  const label = prompt('Label for this token', 'Claude');
  if (label === null) return;
  const { data, error } = await sb.rpc('create_agent_token', { p_label: label.trim() || 'Agent' });
  if (error) return toast('Couldn’t create token: ' + (/create_agent_token/.test(error.message) ? 'run agent-setup.sql first.' : cleanErr(error)));
  try { localStorage.setItem(TOKEN_KEY, data); } catch (e) {}
  tokens = null; await loadTokens(); renderSettings(); toast('Token created — the prompt now includes it');
}
async function revokeToken(id, hint) {
  if (!confirm('Revoke this token? Any agent using it loses access immediately.')) return;
  const { error } = await sb.from('agent_tokens').delete().eq('id', id);
  if (error) return toast('Couldn’t revoke: ' + cleanErr(error));
  if (storedToken().endsWith(hint)) try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  await loadTokens(); renderSettings(); toast('Token revoked');
}
async function copyText(s, msg) {
  try { await navigator.clipboard.writeText(s); toast(msg); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(msg); }
}

async function signOut() {
  if (!confirm('Sign out? Your data stays safe in Supabase; the copy on this device is removed.')) return;
  if (hasPending()) await runSync();
  try { await sb?.auth.signOut(); } catch (e) {}
  try { localStorage.removeItem(KEY); localStorage.removeItem(BASE_KEY); localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  user = null; base = null; tokens = null; cloudStarted = false; S = DEFAULT(); setStatus('local');
  lock();
}
addEventListener('online', () => { if (!LOCK.hidden) return; if (user) refresh(); else if (!cloudSkipped && !cloudStarted) startCloud(); });
const maybeRefresh = () => { if (document.visibilityState === 'visible' && LOCK.hidden && user && Date.now() - lastPull > 20000) refresh(); };
document.addEventListener('visibilitychange', maybeRefresh);
addEventListener('focus', maybeRefresh);

/* =====================================================================
   Lock screen
   ===================================================================== */
const LOCK = $('#lock'), APP = $('#app');
let buf = '', fails = 0, coolUntil = 0;
$('#pad').innerHTML = [['1', ''], ['2', 'ABC'], ['3', 'DEF'], ['4', 'GHI'], ['5', 'JKL'], ['6', 'MNO'], ['7', 'PQRS'], ['8', 'TUV'], ['9', 'WXYZ']]
  .map(([n, l]) => `<button class="key" data-k="${n}" aria-label="${n}"><span>${n}</span><small>${l}</small></button>`).join('') +
  `<span></span><button class="key" data-k="0" aria-label="0"><span>0</span><small></small></button><button class="key ghost" data-k="del" aria-label="Delete">Delete</button>`;
const dots = () => $$('#dots i').forEach((d, i) => d.classList.toggle('on', i < buf.length));
function press(k) {
  if (LOCK.hidden) return;
  if (Date.now() < coolUntil) return;
  if (k === 'del') buf = buf.slice(0, -1); else if (buf.length < 4) buf += k;
  dots();
  if (buf.length === 4) {
    const attempt = buf;
    setTimeout(() => {
      if (hashPin(attempt) === S.settings.pinHash) { fails = 0; unlock(); }
      else {
        fails++; buf = ''; const el = $('#dots'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); dots();
        if (fails >= 5) { coolUntil = Date.now() + 30000; $('#lock-msg').textContent = 'Too many tries — wait 30 seconds'; setTimeout(() => { $('#lock-msg').textContent = 'Enter Passcode'; fails = 0; }, 30000); }
        else $('#lock-msg').textContent = 'Wrong passcode';
      }
    }, 130);
  }
}
$('#pad').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
document.addEventListener('keydown', e => { if (LOCK.hidden) return; if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); });
let lastActive = Date.now();
const touch = () => { lastActive = Date.now(); try { sessionStorage.setItem('ra.active', lastActive); } catch (e) {} };
['pointerdown', 'keydown', 'scroll'].forEach(ev => addEventListener(ev, () => { if (LOCK.hidden && Date.now() - lastActive > 5000) touch(); }, { passive: true }));
function lock() {
  try { sessionStorage.removeItem('ra.active'); } catch (e) {}
  buf = ''; dots(); $('#lock-msg').textContent = 'Enter Passcode';
  closeSheet(); hideTip(); $('#auth').hidden = true;
  LOCK.hidden = false; requestAnimationFrame(() => LOCK.classList.remove('out'));
  APP.hidden = true;
}
function unlock() {
  touch();
  APP.hidden = false;
  LOCK.classList.add('out'); setTimeout(() => { LOCK.hidden = true; }, 350);
  firstRings = true;
  renderAll();
  let v = 'overview'; try { v = sessionStorage.getItem('ra.view') || 'overview'; } catch (e) {}
  show(TABS.some(t => t[0] === v) ? v : 'overview');
  if (user) maybeRefresh(); else if (!cloudStarted) startCloud();
}
setInterval(() => {
  const m = +S.settings.autoLock;
  if (LOCK.hidden && m > 0 && Date.now() - lastActive > m * 60000) lock();
}, 10000);
document.addEventListener('visibilitychange', () => {
  const m = +S.settings.autoLock;
  if (document.visibilityState === 'visible' && LOCK.hidden && m > 0 && Date.now() - lastActive > m * 60000) lock();
});

// Boot: stay unlocked across a refresh only if recently active in this tab.
(() => {
  let a = 0; try { a = +sessionStorage.getItem('ra.active') || 0; } catch (e) {}
  const m = +S.settings.autoLock;
  if (a && (m === 0 || Date.now() - a < m * 60000)) { LOCK.hidden = true; unlock(); }
})();
})();
</script>

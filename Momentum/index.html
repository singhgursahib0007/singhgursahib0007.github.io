<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0B0C0F">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Momentum">
<meta name="description" content="Fast personal to-do list with streaks, a completion heatmap and agent access.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Momentum</title>
<style>
:root{
  --bg:#0A0B0E; --bg2:#0E0F13; --panel:#111217; --card:#16181D; --card2:#1C1F25; --hover:#22252C;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --ink:#F4F5F7; --ink2:#A6ABB5; --ink3:#6E737E;
  --accent:#FF6B2C; --accent-ink:#fff; --chart:#F25F1C; --chart2:#6F7FE8;
  --good:#34C77B; --move:#3B82F6; --bad:#EF4444; --p3:#FF5A5F; --p2:#F5B547; --p1:#5B9DFF;
  --r:16px; --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --tabh:62px; --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.011em;overscroll-behavior-y:none}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:0;padding:0}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3,h4,p{margin:0}
b{font-weight:650}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(600px 380px at 12% -8%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),
  radial-gradient(500px 340px at 105% 110%,color-mix(in srgb,var(--chart2) 10%,transparent),transparent 70%)}
::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ---------------- Shell ---------------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:1fr;min-height:100dvh}
.side,.rail{display:none}
.main{min-width:0;padding:calc(14px + var(--safe-t)) 16px calc(var(--tabh) + 92px + var(--safe-b))}
.view{max-width:760px;margin:0 auto;animation:vin .3s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}
@media (min-width:1024px){
  .app{grid-template-columns:248px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;padding:22px 14px 16px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.015),transparent)}
  .main{padding:34px 40px 60px}
  .tabbar{display:none!important}
}
@media (min-width:1360px){
  .app{grid-template-columns:248px minmax(0,1fr) 320px}
  .rail{display:block;position:sticky;top:0;height:100dvh;overflow:auto;padding:30px 22px;border-left:1px solid var(--line)}
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.02em;padding:0 8px 18px}
.logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 80%,white),var(--accent));color:var(--accent-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.logo svg{width:17px;height:17px;stroke-width:2.8}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--ink2);font-weight:550;font-size:14.5px;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--card);color:var(--ink)}
.nav button.on{background:var(--card2);color:var(--ink)}
.nav button.on svg{color:var(--accent)}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.nav kbd{margin-left:auto;font:11px var(--mono);color:var(--ink3)}
.nav .cnt+kbd{margin-left:8px}
.side-h{font-size:11.5px;font-weight:650;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;padding:22px 10px 8px}
.wk{display:grid;gap:1px}
.wk button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;font-size:13.5px;color:var(--ink2)}
.wk button:hover{background:var(--card)}
.wk button.on{background:var(--card2);color:var(--ink)}
.wk .wd{width:30px;font-weight:600;color:var(--ink)}
.wk .wdate{color:var(--ink3)}
.wk .wc{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink3)}
.wk .wbar{width:34px;height:4px;border-radius:2px;background:var(--card2);overflow:hidden}
.wk .wbar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.side-foot{margin-top:auto;display:grid;gap:10px}
.streak{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.streak .fl{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.streak b{display:block;font-size:15px}
.streak small{color:var(--ink3);font-size:12px}
.syncline{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;font-size:12.5px;color:var(--ink3);text-align:left}
.syncline:hover{background:var(--card)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
[data-st=synced] .dot,.dot[data-st=synced]{background:var(--good)}
[data-st=syncing] .dot,[data-st=pending] .dot,.dot[data-st=syncing],.dot[data-st=pending]{background:var(--accent);animation:pulse 1s infinite}
[data-st=offline] .dot,.dot[data-st=offline]{background:var(--p2)}
[data-st=error] .dot,.dot[data-st=error]{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}

/* tab bar (phone/tablet) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;padding:6px 6px calc(6px + var(--safe-b));background:rgba(14,15,19,.82);backdrop-filter:saturate(170%) blur(22px);-webkit-backdrop-filter:saturate(170%) blur(22px);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:10.5px;font-weight:550;color:var(--ink3);transition:color .15s}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--accent)}

/* ---------------- Today ---------------- */
.dh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 2px 14px;touch-action:pan-y}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink3);letter-spacing:.01em}
h1{font-size:34px;font-weight:750;letter-spacing:-.035em;line-height:1.08;margin-top:2px}
h1 .dd{font-size:16px;font-weight:550;color:var(--ink3);letter-spacing:-.01em;margin-left:10px}
.dh-nav{display:flex;gap:6px;align-items:center}
.ib{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink2);transition:background .15s,color .15s,transform .1s}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib:active{transform:scale(.94)}
.ib.txt{width:auto;padding:0 12px;font-size:13px;font-weight:600}
.ib.sync{position:relative}
.ib.sync .dot{position:absolute;right:6px;top:6px;width:7px;height:7px;box-shadow:0 0 0 2px var(--card)}
.prog{display:flex;align-items:center;gap:12px;margin:0 2px 16px}
.prog .bar{flex:1;height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.prog .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--accent));transition:width .6s var(--ease)}
.prog span{font-size:13px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.strip button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;border-radius:14px;background:var(--card);border:1px solid var(--line);transition:background .15s,border-color .15s,transform .1s}
.strip button:active{transform:scale(.96)}
.strip .sd{font-size:11px;font-weight:650;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.strip .sn{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.strip .sb{width:22px;height:3px;border-radius:2px;background:var(--card2);overflow:hidden}
.strip .sb i{display:block;height:100%;background:var(--accent)}
.strip button.today .sn{color:var(--accent)}
.strip button.on{background:color-mix(in srgb,var(--accent) 14%,var(--card));border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.strip button.past .sn{color:var(--ink2)}

/* quick add */
.qa{position:relative;margin-bottom:18px;z-index:5}
.qa-box{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.25);transition:border-color .15s,box-shadow .15s}
.qa-box:focus-within{border-color:color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent),0 10px 30px rgba(0,0,0,.3)}
.qa-plus{color:var(--accent);display:grid}
.qa-plus svg{width:20px;height:20px;stroke-width:2.4}
.qa input{flex:1;min-width:0;height:42px;border:0;background:transparent;outline:none;font-size:16px}
.qa input::placeholder{color:var(--ink3)}
.qa-go{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);opacity:.35;transition:opacity .15s,transform .1s}
.qa-go.ready{opacity:1}
.qa-go:active{transform:scale(.92)}
.qa-chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 4px 0;min-height:0}
.qa-chips:empty{display:none}
.qa-hint{font-size:12px;color:var(--ink3);margin:8px 6px 0}
.qa-hint code{font:11.5px var(--mono);color:var(--ink2);background:var(--card2);padding:1px 5px;border-radius:5px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;background:var(--card2);color:var(--ink2);border:1px solid var(--line)}
.chip svg{width:12px;height:12px;stroke-width:2.3}
.chip.acc{background:color-mix(in srgb,var(--accent) 16%,transparent);color:color-mix(in srgb,var(--accent) 80%,#fff);border-color:transparent}
.chip button{display:grid;color:inherit;margin-right:-3px}
@media (max-width:1023px){
  .qa{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + var(--safe-b));margin:0;padding:10px 12px 10px;background:linear-gradient(180deg,transparent,rgba(10,11,14,.92) 30%);}
  .qa-hint{display:none}
}

/* lists */
.list{display:grid;gap:6px;position:relative}
.task{position:relative;border-radius:14px;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.task-in{position:relative;z-index:1;display:flex;align-items:flex-start;gap:12px;padding:12px 10px 12px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);transition:transform .32s var(--ease),background .15s,border-color .15s}
.task:hover .task-in{background:#191B21}
.task.sel .task-in{border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.task.swiping .task-in{transition:none}
.task.shift{transition:transform .22s var(--ease)}
.task.lifted{z-index:20;transition:none}
.task.lifted .task-in{background:var(--hover);border-color:var(--line2);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.task.new .task-in{animation:newin .5s var(--spring)}
@keyframes newin{from{transform:translateY(-8px) scale(.97);opacity:0;border-color:var(--accent)}}
.sw-bg{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:13px;font-weight:650;color:#fff;background:var(--card2);overflow:hidden}
.sw-bg span{display:flex;align-items:center;gap:7px;opacity:0;transition:opacity .12s}
.sw-bg svg{width:18px;height:18px;stroke-width:2.4}
.task[data-sw=r] .sw-bg,.task[data-sw=done] .sw-bg{background:color-mix(in srgb,var(--good) 45%,var(--card2))}
.task[data-sw=done] .sw-bg{background:var(--good)}
.task[data-sw=r] .sw-done,.task[data-sw=done] .sw-done{opacity:1}
.task[data-sw=l] .sw-bg{background:color-mix(in srgb,var(--move) 40%,var(--card2))}
.task[data-sw=move] .sw-bg{background:var(--move)}
.task[data-sw=del] .sw-bg{background:var(--bad)}
.task[data-sw=l] .sw-move,.task[data-sw=move] .sw-move{opacity:1}
.task[data-sw=del] .sw-del{opacity:1}
.sw-move,.sw-del{margin-left:auto}
.task[data-sw=del] .sw-move{display:none}
.chk{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;border:2px solid var(--ink3);display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s,transform .2s var(--spring)}
.chk svg{width:13px;height:13px;stroke-width:3.2}
.chk.p1{border-color:var(--p1)}.chk.p2{border-color:var(--p2)}.chk.p3{border-color:var(--p3)}
.chk:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chk:active{transform:scale(.85)}
.task.done .chk,.task.checking .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.task.checking .chk{animation:pop .35s var(--spring)}
@keyframes pop{50%{transform:scale(1.25)}}
.t-main{flex:1;min-width:0}
.t-title{font-size:15.5px;font-weight:500;line-height:1.35;word-wrap:break-word;transition:color .2s}
.task.done .t-title,.task.checking .t-title{color:var(--ink3);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink3) 70%,transparent)}
.t-meta{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:5px}
.m{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink3);font-weight:550}
.m svg{width:12.5px;height:12.5px;stroke-width:2.1}
.m.pri.p3{color:var(--p3)}.m.pri.p2{color:var(--p2)}.m.pri.p1{color:var(--p1)}
.m.tag{color:color-mix(in srgb,var(--accent) 75%,#fff)}
.m.carried{color:var(--p2)}
.handle{flex:none;width:26px;height:26px;margin:-2px -4px 0 0;display:grid;place-items:center;color:var(--ink3);border-radius:8px;cursor:grab;opacity:0;transition:opacity .15s;touch-action:none}
.task:hover .handle{opacity:1}
.handle:hover{background:var(--card2);color:var(--ink)}
@media (hover:none){.handle{display:none}}
.sec{display:flex;align-items:center;gap:8px;margin:22px 4px 10px;font-size:13px;font-weight:650;color:var(--ink2)}
.sec .n{color:var(--ink3);font-weight:550}
.sec .sp{flex:1}
.sec button.lnk{font-size:12.5px;font-weight:650;color:var(--accent)}
.sec-t{display:flex;align-items:center;gap:6px}
.sec-t svg{transition:transform .2s}
.sec-t.closed svg{transform:rotate(-90deg)}
.carry{border-radius:18px;padding:12px;margin-bottom:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--p2) 9%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--p2) 22%,transparent)}
.carry .sec{margin:2px 4px 12px}
.carry .sec svg{color:var(--p2)}
.carry .task-in{background:var(--card)}
.empty{text-align:center;padding:38px 20px;color:var(--ink3);border:1px dashed var(--line2);border-radius:18px}
.empty .big{width:52px;height:52px;margin:0 auto 12px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.empty .big svg{width:26px;height:26px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.allclear{display:flex;align-items:center;gap:12px;padding:16px;border-radius:16px;margin-bottom:6px;background:linear-gradient(135deg,color-mix(in srgb,var(--good) 16%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--good) 28%,transparent)}
.allclear .ok{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--good);color:#04140B}
.allclear .ok svg{stroke-width:2.8}
.allclear small{display:block;color:var(--ink2);font-size:13px}
.gest{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:14px;font-size:12px;color:var(--ink3)}
.gest span{display:inline-flex;align-items:center;gap:5px}
.gest i{width:8px;height:8px;border-radius:50%}

/* ---------------- Plan ---------------- */
.group{margin-bottom:22px}
.g-head{display:flex;align-items:center;gap:10px;margin:0 4px 8px}
.g-head b{font-size:15px}
.g-head small{color:var(--ink3);font-size:12.5px;font-weight:550}
.g-head .sp{flex:1}
.g-head .ib{width:30px;height:30px;border-radius:9px}
.g-empty{padding:12px 14px;border-radius:14px;border:1px dashed var(--line);color:var(--ink3);font-size:13px}
.g-head.today b{color:var(--accent)}

/* ---------------- Cards / insights ---------------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.card h3{font-size:15.5px;font-weight:650}
.card .sub{font-size:12.5px;color:var(--ink3);margin-top:2px}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.grid{display:grid;gap:12px}
.k4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.k4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
.kpi .kl{font-size:12.5px;font-weight:600;color:var(--ink3);display:flex;align-items:center;gap:6px}
.kpi .kl svg{width:14px;height:14px;color:var(--accent)}
.kpi .kv{font-size:28px;font-weight:750;letter-spacing:-.035em;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .kv small{font-size:14px;font-weight:550;color:var(--ink3);letter-spacing:0}
.kpi .kf{font-size:12px;color:var(--ink3);margin-top:5px}
.seg{display:inline-flex;background:var(--card2);border-radius:10px;padding:2px;border:1px solid var(--line)}
.seg button{padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--hover);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.chart{position:relative;width:100%;min-height:180px;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;fill:var(--ink3)}
.chart .vl{fill:var(--ink2);font-weight:600}
.chart svg.hov .col:not(.hl){opacity:.35}
.chart .col{transition:opacity .12s}
.hm-wrap{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding-bottom:4px}
.hm-wrap svg{display:block}
.hm-wrap text{font-family:var(--font);font-size:10.5px;fill:var(--ink3)}
.hm-legend{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink3);margin-top:10px;justify-content:flex-end}
.hm-legend i{width:11px;height:11px;border-radius:3px}
.callout{display:flex;gap:10px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--card2);font-size:13px;color:var(--ink2)}
.callout svg{color:var(--accent)}
.hbar{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .tr{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:4px;background:var(--chart)}
.hbar .v{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst{display:grid}
.lst .it{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.lst .it:last-child{border-bottom:0}
.lst .it .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst .it .b{font-size:12px;font-weight:650;color:var(--p2);font-variant-numeric:tabular-nums}
.tip{position:fixed;left:0;top:0;z-index:90;pointer-events:none;background:rgba(28,30,37,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.5);padding:9px 12px;font-size:12.5px;min-width:150px}
.tip h5{margin:0 0 5px;font-size:12.5px;font-weight:650}
.tip .r{display:flex;justify-content:space-between;gap:14px;margin-top:2px;color:var(--ink2)}
.tip .r span{display:flex;align-items:center;gap:6px}
.tip .r b{color:var(--ink)}
.tip i{width:8px;height:8px;border-radius:2px;background:var(--c);display:inline-block}

/* ---------------- Agent / settings ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:12px;font-weight:650;font-size:14px;transition:transform .1s,background .15s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sec2{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.sec2:hover{background:var(--hover)}
.btn.dng{background:color-mix(in srgb,var(--bad) 16%,transparent);color:#FF8A8A}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.inp,textarea.inp,select.inp{width:100%;height:42px;border-radius:12px;background:var(--card2);border:1px solid var(--line);padding:0 12px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none;min-width:0}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;line-height:1.4}
.inp:focus{border-color:color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent)}
input[type=date].inp,input[type=time].inp{color-scheme:dark}
.prompt{width:100%;min-height:340px;font:12.5px/1.55 var(--mono);color:#D8DCE4;background:#0C0D11;border:1px solid var(--line2);border-radius:14px;padding:14px;resize:vertical;outline:none;white-space:pre;overflow:auto}
.steps{display:grid;gap:10px;counter-reset:s}
.step{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;color:var(--ink2)}
.step::before{counter-increment:s;content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-weight:700;font-size:12px}
.tok{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.tok:last-child{border-bottom:0}
.tok code{font:12px var(--mono);color:var(--ink2)}
.tok .grow{flex:1;min-width:0}
.tok small{display:block;color:var(--ink3);font-size:12px}
.secret{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:#0C0D11;border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);font:12.5px var(--mono);word-break:break-all}
.gt{font-size:12px;font-weight:650;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;margin:24px 6px 8px}
.gt:first-child{margin-top:0}
.gl{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gi{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:54px;border-bottom:1px solid var(--line)}
.gi:last-child{border-bottom:0}
.gi .l{flex:1;min-width:0;font-size:14.5px}
.gi .l small{display:block;color:var(--ink3);font-size:12.5px}
.gi .inp{max-width:220px;height:36px;font-size:15px}
.gnote{font-size:12.5px;color:var(--ink3);padding:8px 8px 0;line-height:1.5}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:14px;background:#2A2D35;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .25s var(--ease)}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.swatches{display:flex;gap:10px}
.swatches button{width:28px;height:28px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--card),0 0 0 2px transparent;transition:box-shadow .15s,transform .1s}
.swatches button.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c)}
.swatches button:active{transform:scale(.9)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13.5px;color:var(--ink2);align-items:center}
kbd{font:12px var(--mono);background:var(--card2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--ink)}

/* ---------------- Rail ---------------- */
.rail h4{font-size:12px;font-weight:650;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;margin:24px 2px 10px}
.rail h4:first-child{margin-top:0}
.ring-card{display:flex;align-items:center;gap:16px}
.ring-card b{font-size:26px;letter-spacing:-.03em;display:block;font-variant-numeric:tabular-nums}
.ring-card small{color:var(--ink3);font-size:12.5px}
.ring-p{transition:stroke-dashoffset .8s var(--ease)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.mini b{display:block;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mini small{color:var(--ink3);font-size:12px}

/* ---------------- Sheet / toast / auth ---------------- */
.sheet{position:fixed;inset:0;z-index:60;pointer-events:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .25s}
.sheet-p{position:absolute;left:50%;top:50%;width:min(520px,calc(100% - 32px));max-height:min(88dvh,860px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);padding:22px;transform:translate(-50%,-47%) scale(.97);opacity:0;transition:transform .3s var(--ease),opacity .2s;overscroll-behavior:contain}
.sheet.open{pointer-events:auto}
.sheet.open .sheet-bg{opacity:1}
.sheet.open .sheet-p{transform:translate(-50%,-50%) scale(1);opacity:1}
.sheet-p{visibility:hidden}
.sheet.open .sheet-p{visibility:visible}
.grab{display:none}
.sheet-x{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--ink2)}
.sheet-x svg{width:14px;height:14px;stroke-width:2.6}
@media (max-width:760px){
  .sheet-p{left:0;right:0;top:auto;bottom:0;width:100%;max-height:92dvh;border-radius:22px 22px 0 0;padding:10px 18px calc(20px + var(--safe-b));transform:translateY(100%);opacity:1;border-bottom:0}
  .sheet.open .sheet-p{transform:translateY(0)}
  .grab{display:block;width:38px;height:5px;border-radius:3px;background:#3A3D46;margin:0 auto 12px}
}
textarea.ed-title{resize:none;overflow:hidden}
.ed-title{font-size:19px!important;font-weight:650;border:0!important;background:transparent!important;padding:4px 36px 4px 0!important;box-shadow:none!important;resize:none}
.ed-row{display:grid;gap:8px;margin-top:16px}
.ed-row>label,.ed-row>.lab{font-size:12.5px;font-weight:650;color:var(--ink3)}
.ed-chips{display:flex;gap:6px;flex-wrap:wrap}
.ed-chips button{height:30px;padding:0 11px;border-radius:15px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2)}
.ed-chips button.on,.ed-chips button:active{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:color-mix(in srgb,var(--accent) 50%,transparent);color:var(--ink)}
.ed-toggle{display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px 14px;border-radius:14px;background:var(--card)}
.ed-toggle .l{flex:1;font-size:14px}
.ed-toggle small{display:block;color:var(--ink3);font-size:12px}
.ed-info{font-size:12px;color:var(--ink3);margin-top:14px;line-height:1.6}
.ed-act{display:flex;gap:8px;margin-top:18px}
.ed-act .pri{flex:1}
.toast{position:fixed;left:50%;bottom:calc(30px + var(--safe-b));z-index:120;display:flex;align-items:center;gap:14px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:rgba(36,39,47,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);color:var(--ink);padding:10px 12px 10px 16px;border-radius:14px;font-size:14px;font-weight:550;box-shadow:0 14px 40px rgba(0,0,0,.5);transition:opacity .2s,transform .3s var(--ease);max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--accent);font-weight:700;padding:4px 6px;border-radius:8px}
@media (max-width:1023px){.toast{bottom:calc(var(--tabh) + 84px + var(--safe-b))}}
.auth{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);padding:20px}
.auth .glow{z-index:0}
.auth form{position:relative;z-index:1;width:min(380px,100%);display:grid;gap:12px;text-align:center}
.auth .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 6px}
.auth .logo svg{width:34px;height:34px}
.auth h2{font-size:26px;font-weight:750;letter-spacing:-.03em}
.auth p.s{color:var(--ink2);font-size:14px;margin-bottom:6px}
.auth .err{color:#FF8A8A;font-size:13.5px;min-height:19px}
.auth .skip{color:var(--ink3);font-size:13px;font-weight:600;margin-top:2px}
.auth .skip:hover{color:var(--ink2)}
.fx{position:fixed;pointer-events:none;z-index:110;left:0;top:0}
.fx i{position:absolute;width:8px;height:12px;border-radius:2px;animation:conf 1.1s var(--ease) forwards}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="glow"></div>

<!-- Sign in (once per device) -->
<div id="auth" class="auth" hidden>
  <div class="glow"></div>
  <form id="authForm" novalidate>
    <div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>Momentum</h2>
    <p class="s">Sign in with your Supabase account to sync across devices. Same login as RA Hours.</p>
    <input class="inp" type="email" name="email" placeholder="Email" autocomplete="username">
    <input class="inp" type="password" name="password" placeholder="Password" autocomplete="current-password">
    <p class="err" id="authErr" aria-live="polite"></p>
    <button class="btn pri" type="submit">Sign in</button>
    <button class="skip" type="button" data-act="skip-auth">Use on this device only for now</button>
  </form>
</div>

<div class="app" id="app">
  <aside class="side">
    <div class="brand"><span class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Momentum</div>
    <nav class="nav" id="nav"></nav>
    <p class="side-h">This week</p>
    <div class="wk" id="sideWeek"></div>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <main class="main">
    <section id="v-today" class="view">
      <div id="dayHead"></div>
      <div class="strip" id="strip"></div>
      <div class="qa-slot"></div>
      <div id="todayBody"></div>
    </section>
    <section id="v-plan" class="view" hidden>
      <div class="dh"><div><p class="eyebrow">Next two weeks</p><h1>Plan</h1></div><div class="dh-nav" id="planNav"></div></div>
      <div class="qa-slot"></div>
      <div id="planBody"></div>
    </section>
    <section id="v-insights" class="view" hidden></section>
    <section id="v-agent" class="view" hidden></section>
    <section id="v-settings" class="view" hidden></section>
  </main>

  <aside class="rail" id="rail"></aside>
</div>

<!-- Quick add: moves into the active view's slot -->
<form id="qa" class="qa" autocomplete="off">
  <div class="qa-box">
    <span class="qa-plus"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
    <input id="qaIn" type="text" placeholder="Add a task…" enterkeyhint="done" aria-label="Add a task">
    <button class="qa-go" type="submit" aria-label="Add"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></button>
  </div>
  <div class="qa-chips" id="qaChips"></div>
  <p class="qa-hint">Type <code>tomorrow</code> <code>fri</code> for a date · <code>!</code>–<code>!!!</code> priority · <code>#tag</code> · <code>~</code> keep carrying · paste several lines to add many</p>
</form>

<nav class="tabbar" id="tabbar"></nav>

<div id="sheet" class="sheet" aria-hidden="true">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-p" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <button class="sheet-x" data-close aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastAct" hidden>Undo</button></div>
<div id="tip" class="tip" hidden></div>
<div id="fx" class="fx"></div>

<script>
(() => {
'use strict';

/* ======================================================================
   Helpers
   ====================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad2 = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const dow = s => pd(s).getDay();
const weekKey = s => addDays(s, -((dow(s) + 6) % 7));        // Monday
const T = () => ds(new Date());
const fmt = (s, o) => pd(s).toLocaleDateString('en-US', o);
const fmtShort = s => fmt(s, { month: 'short', day: 'numeric' });
const fmtDay = s => fmt(s, { weekday: 'short', month: 'short', day: 'numeric' });
const timeStr = ms => new Date(ms).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
const dayOf = ms => ds(new Date(ms));
const daysBetween = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
function rel(d) {
  const t = T(), n = daysBetween(t, d);
  if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow'; if (n === -1) return 'Yesterday';
  if (n > 1 && n < 7) return fmt(d, { weekday: 'long' });
  return fmtDay(d);
}
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
  const r = crypto.getRandomValues(new Uint8Array(1))[0] & 15; return (c === 'x' ? r : (r & 3) | 8).toString(16); }));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
function durStr(ms) {
  const h = ms / 36e5;
  if (h < 1) return Math.max(1, Math.round(ms / 6e4)) + 'm';
  if (h < 48) return (h < 10 ? h.toFixed(1).replace(/\.0$/, '') : Math.round(h)) + 'h';
  return (h / 24).toFixed(1).replace(/\.0$/, '') + 'd';
}

const ic = d => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
const IC = {
  today: ic('<rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/>'),
  plan: ic('<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/>'),
  insights: ic('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  agent: ic('<rect x="4" y="7" width="16" height="12" rx="4"/><path d="M12 3v4M9 12.5v1M15 12.5v1M2 12v3M22 12v3"/>'),
  settings: ic('<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>'),
  check: ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  plus: ic('<path d="M12 5v14M5 12h14"/>'),
  left: ic('<path d="M15 5l-7 7 7 7"/>'),
  right: ic('<path d="M9 5l7 7-7 7"/>'),
  down: ic('<path d="M6 9l6 6 6-6"/>'),
  arrowR: ic('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  trash: ic('<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/>'),
  flag: ic('<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'),
  repeat: ic('<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>'),
  note: ic('<path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/>'),
  bot: ic('<rect x="5" y="8" width="14" height="11" rx="3.5"/><path d="M12 4v4M9.5 13v1M14.5 13v1"/>'),
  grip: ic('<circle cx="9" cy="6" r="1.2" fill="currentColor"/><circle cx="15" cy="6" r="1.2" fill="currentColor"/><circle cx="9" cy="12" r="1.2" fill="currentColor"/><circle cx="15" cy="12" r="1.2" fill="currentColor"/><circle cx="9" cy="18" r="1.2" fill="currentColor"/><circle cx="15" cy="18" r="1.2" fill="currentColor"/>'),
  fire: ic('<path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 1.8 1 2.8 2 3 0-3-1-5.5 1-8.5z"/>'),
  cloud: ic('<path d="M7 18.5h10.5a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.6 9.1 4.75 4.75 0 0 0 7 18.5z"/>'),
  copy: ic('<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>'),
  key: ic('<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/>'),
  clock: ic('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
  target: ic('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>'),
  bolt: ic('<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'),
  download: ic('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),
  sparkle: ic('<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>'),
  inbox: ic('<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 2h6l1-2h5"/>'),
};

/* ======================================================================
   State — local copy (instant, offline) + Supabase sync
   ====================================================================== */
const KEY = 'momentum.v1', BASE_KEY = 'momentum.base', TOKEN_KEY = 'momentum.agentToken';
const ACCENTS = {

function agg() {

  }

}

  for (const x of days) { run = prev && addDays(prev, 1) === x ? run + 1 : 1; best = Math.max(best, run); prev = x; }

}

function buildPrompt(tok) {

## Connection
- Endpoint: ${SB_URL}/rest/v1/rpc/<function_name>
- Method: POST with a JSON body of named parameters
- Headers (all required):
  apikey: ${SB_KEY}
  Content-Type: application/json
  Content-Profile: todo
- Every call must include "p_token": "${t}"
  (my personal agent token: it only reaches my tasks, and only through these functions)
- My timezone: ${S.settings.tz}. Dates are YYYY-MM-DD in my local time.

## Functions
1. agent_list {p_token, p_from?, p_to?, p_include_done? = true, p_search?}
   → {"today": date, "tasks": [{id, title, notes, date, position, priority, tag, carry, carried_times, done, done_at, created_at}]}
   No dates = today only. p_search without dates searches every date.
2. agent_add {p_token, p_title, p_date? = today, p_notes?, p_priority? 0-3, p_tag?, p_carry? = false}
   → the new task, placed at the bottom of that day.
3. agent_update {p_token, p_id, p_changes}
   p_changes is an object with any of: title, notes, date, priority, tag, carry, done, position.
   done:true completes it (time recorded), done:false reopens it, a new date moves it to the bottom of that day.
   → the updated task.
4. agent_reorder {p_token, p_date, p_ids: [id, …]} sets that day's order, first = top → that day's tasks.
5. agent_delete {p_token, p_id} deletes permanently → {"deleted": id}.

## Meanings
priority: 0 none, 1 low, 2 medium, 3 high. tag: one short word without "#". carry: true = rolls to the next day by itself until done. carried_times: how often it was pushed to a later day.

## Rules
- Call agent_list first to get ids and "today". Never guess ids. Work out "tomorrow", "next Monday" etc. from "today".
- Ask me to confirm before deleting anything, or before changing more than 5 tasks at once.
- Keep my wording for titles; only fix obvious typos.
- After acting, reply with a short summary of what changed and on which day.
- Errors come back as JSON with "message". "Invalid or revoked agent token" → ask me for a new token (Momentum → Agent).

  s = s.replace(/\s#([\w-]{1,40})(?=\s)/, (m, t) => { o.tag = t; return ' '; });
  s = s.replace(/\s~(?=\s)/, () => { o.carry = true; return ' '; });

  s = s.replace(/\s(tomorrow|tmrw?|tmr)(?=\s)/i, () => { o.date = addDays(T(), 1); return ' '; });
  s = s.replace(/\snext week(?=\s)/i, () => { o.date = addDays(weekKey(T()), 7); return ' '; });

const iso = ms => new Date(ms || 0).toISOString();
const sortKeys = o => Object.fromEntries(Object.keys(o || {}).sort().map(k => [k, o[k]]));
function toRows(st, uid) {
  const s = st.settings, o = { settings: {}, tasks: {} };
  o.settings[uid] = { user_id: uid, display_name: s.name || null, timezone: s.tz || 'America/Toronto', auto_carry: !!s.autoCarry, accent: s.accent || 'orange', prefs: sortKeys(s.prefs) };
  for (const t of st.tasks) o.tasks[t.id] = {
    id: t.id, user_id: uid, title: t.title, notes: t.notes || null, list_date: t.date, origin_date: t.origin || t.date, position: +t.pos || 0,
    priority: t.pri | 0, tag: t.tag || null, carry: !!t.carry, carry_count: t.carries | 0, done: !!t.done, done_at: t.done && t.doneAt ? iso(t.doneAt) : null,
    source: t.source === 'agent' ? 'agent' : 'app', created_at: iso(t.createdAt),
  };
  return o;
}
function fromServer(R) {
  const s = R.settings[0] || {}, d = DEF_SETTINGS();
  return {
    tasks: R.tasks.map(r => ({ id: r.id, title: r.title, notes: r.notes || '', date: r.list_date, origin: r.origin_date, pos: +r.position, pri: r.priority | 0, tag: r.tag || '', carry: !!r.carry, carries: r.carry_count | 0, done: !!r.done, doneAt: r.done_at ? Date.parse(r.done_at) : null, createdAt: Date.parse(r.created_at) || 0, source: r.source })),
    settings: { name: s.display_name || '', tz: s.timezone || d.tz, autoCarry: !!s.auto_carry, accent: s.accent || d.accent, prefs: { ...d.prefs, ...(s.prefs || {}) } },
  };
}
async function fetchAll(t) {
  const out = [];
  for (let i = 0; ; i += 1000) { const { data, error } = await sb.from(t).select('*').range(i, i + 999); if (error) throw error; out.push(...data); if (data.length < 1000) break; }
  return out;
}
async function pull() { const [settings, tasks] = await Promise.all([fetchAll('settings'), fetchAll('tasks')]); return { settings, tasks }; }
async function push() {
  const cur = toRows(S, user.id), b = base || { settings: {}, tasks: {} };
  const same = (x, y) => JSON.stringify(x) === JSON.stringify(y);
  const run = async q => { const { error } = await q; if (error) throw error; };
  for (const t of ['settings', 'tasks']) {
    const dels = Object.keys(b[t] || {}).filter(k => !cur[t][k]);
    for (let i = 0; i < dels.length; i += 200) await run(sb.from(t).delete().in(TBL[t], dels.slice(i, i + 200)));
    const ups = Object.keys(cur[t]).filter(k => !b[t]?.[k] || !same(cur[t][k], b[t][k])).map(k => cur[t][k]);
    for (let i = 0; i < ups.length; i += 400) await run(sb.from(t).upsert(ups.slice(i, i + 400), { onConflict: TBL[t] }));
  }
  base = cur; saveBase(); lastPush = Date.now();
}
const hasPending = () => !!(user && base && JSON.stringify(toRows(S, user.id)) !== JSON.stringify(base));
function scheduleSync() { if (!user || !sb) return; dirty = true; setStatus('pending'); clearTimeout(syncT); syncT = setTimeout(runSync, 350); }
async function runSync() {
  if (!user || !sb) return;
  if (syncing) { dirty = true; return; }
  syncing = true; dirty = false; setStatus('syncing');
  try { await push(); setStatus('synced'); }
  catch (err) { if (isNet(err)) setStatus('offline'); else { toast('Not saved: ' + cleanErr(err)); setStatus('error'); await resetFromServer(); } }
  finally { syncing = false; if (dirty && status !== 'offline') { dirty = false; runSync(); } }
}
function applyServer(R) {
  const next = fromServer(R), tz = S.settings.tz, before = JSON.stringify(toRows(S, user.id));
  base = toRows(next, user.id); saveBase();
  next.settings.tz = tz; S = next; cacheLocal(); applyAccent();
  rollover();
  if (hasPending()) scheduleSync();
  if (JSON.stringify(toRows(S, user.id)) !== before) { renderAll(); if (view === 'settings') renderSettings(); if (view === 'agent') renderAgent(); }
}
async function resetFromServer() { try { applyServer(await pull()); setStatus('synced'); } catch (e) { setStatus(isNet(e) ? 'offline' : 'error'); } }
async function refresh(force) {
  if (!user || !sb || syncing) return;
  if (!force && Date.now() - lastPull < 15000) return;
  lastPull = Date.now();
  try {
    if (hasPending()) { await runSync(); if (status !== 'synced') return; }
    applyServer(await pull()); setStatus('synced');
  } catch (e) { setStatus(isNet(e) ? 'offline' : 'error'); }
}
function subscribe() {
  if (rt || !sb || !user) return;
  try {
    rt = sb.channel('momentum-' + user.id)
      .on('postgres_changes', { event: '*', schema: 'todo', table: 'tasks', filter: 'user_id=eq.' + user.id }, () => {
        if (Date.now() - lastPush < 2500 || syncing) return;
        clearTimeout(rtT); rtT = setTimeout(() => refresh(true), 500);
      }).subscribe();
  } catch (e) { rt = null; }
}
async function startCloud(interactive) {
  if (cloudSkipped) return setStatus('local');
  try { await client(); } catch (e) { setStatus('offline'); if (interactive) toast('No connection'); return; }
  const { data } = await sb.auth.getSession();
  user = data.session?.user || null;
  if (!user) { showAuth(); return; }
  cloudStarted = true;
  await initialSync();
}
async function initialSync() {
  setStatus('syncing');
  try {
    const R = await pull(), stored = loadBase();
    if (!R.settings.length && !R.tasks.length) {
      try { localStorage.setItem('momentum.preSync', JSON.stringify(S)); } catch (e) {}
      base = null; await push();
      toast(S.tasks.length ? `Uploaded ${plural(S.tasks.length, 'task')} to Supabase` : 'Connected to Supabase');
    } else if (stored && stored.uid === user.id) {
      base = stored.rows; if (hasPending()) await push(); applyServer(await pull());
    } else {
      const local = S, srv = fromServer(R), ids = new Set(srv.tasks.map(t => t.id));
      const extra = local.tasks.filter(t => !ids.has(t.id));
      base = toRows(srv, user.id); saveBase();
      srv.settings.tz = local.settings.tz;
      S = srv; S.tasks = srv.tasks.concat(extra); cacheLocal(); applyAccent();
      if (hasPending()) { await push(); if (extra.length) toast(`Added ${plural(extra.length, 'task')} from this device`); }
    }
    if (hasPending()) scheduleSync();
    lastPull = Date.now(); setStatus('synced'); rollover(); renderAll();
    if (view === 'settings') renderSettings(); if (view === 'agent') { tokens = null; renderAgent(); }
    subscribe();
  } catch (err) {
    if (isNet(err)) setStatus('offline');
    else { setStatus('error'); toast('Supabase: ' + cleanErr(err)); }
  }
}
function showAuth() { const a = $('#auth'); a.hidden = false; $('#authErr').textContent = ''; setTimeout(() => $('#authForm').elements.email.focus(), 60); }
$('#authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('[type=submit]'), err = $('#authErr');
  const email = f.elements.email.value.trim(), password = f.elements.password.value;
  if (!email || !password) { err.textContent = 'Enter your email and password.'; return; }
  btn.disabled = true; err.textContent = '';
  try {
    await client();
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    user = data.user; f.elements.password.value = ''; $('#auth').hidden = true; cloudSkipped = false; cloudStarted = true;
    await initialSync();
  } catch (ex) { err.textContent = isNet(ex) ? 'No connection — try again when you’re online.' : (ex.message || 'Sign-in failed'); }
  finally { btn.disabled = false; }
});
async function signOut() {
  if (!confirm('Sign out? Your tasks stay in Supabase; the copy on this device is removed.')) return;
  if (hasPending()) await runSync();
  try { if (rt) await sb.removeChannel(rt); } catch (e) {} rt = null;
  try { await sb?.auth.signOut(); } catch (e) {}
  try { [KEY, BASE_KEY, TOKEN_KEY].forEach(k => localStorage.removeItem(k)); } catch (e) {}
  user = null; base = null; cloudStarted = false; tokens = null; S = { tasks: [], settings: DEF_SETTINGS() };
  applyAccent(); setStatus('local'); renderAll(); show('today'); showAuth();
}
addEventListener('online', () => { if (user) refresh(true); else if (!cloudSkipped && !cloudStarted) startCloud(); });
const maybeRefresh = () => { if (document.visibilityState === 'visible') { dayTick(); if (user) refresh(); } };
document.addEventListener('visibilitychange', maybeRefresh);
addEventListener('focus', maybeRefresh);

/* ======================================================================
   Boot
   ====================================================================== */
let curDay = T();
function dayTick() {
  const t = T();
  if (t !== curDay) { if (selDate === curDay) selDate = t; curDay = t; rollover(); renderAll(); }
}
setInterval(dayTick, 30000);
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { renderRail(); if (view === 'insights') renderInsights(); }, 150); });

applyAccent();
rollover();
const params = new URLSearchParams(location.search);
let first = params.get('tab') || (() => { try { return sessionStorage.getItem('momentum.view'); } catch (e) { return null; } })() || 'today';
if (!TABS.some(t => t[0] === first)) first = 'today';
renderAll(); show(first);
if (params.get('add') === '1') setTimeout(() => $('#qaIn').focus(), 200);
else if (matchMedia('(min-width:1024px)').matches && first === 'today') $('#qaIn').focus();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => {});
startCloud();
})();
</script>

    --accent-soft: rgba(0,122,255,.12);
    --line: rgba(60,60,67,.12);
    --danger: #FF3B30;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --ease: cubic-bezier(.32,.72,.28,1);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    display:flex; flex-direction:column;
    touch-action: manipulation;
  }
  /* ---------- Header ---------- */
  header {
    padding: calc(14px + var(--safe-t)) 16px 10px;
    display:flex; align-items:center; gap:10px;
    position:relative; z-index:5;
  }
  .back-btn {
    width:36px; height:36px; border:none; border-radius:50%;
    background: var(--card); box-shadow: var(--shadow);
    display:flex; align-items:center; justify-content:center;
    color: var(--accent); cursor:pointer; flex:0 0 auto;
    opacity:0; pointer-events:none; transform:scale(.8);
    transition: opacity .25s var(--ease), transform .25s var(--ease);
  }
  .back-btn.show { opacity:1; pointer-events:auto; transform:scale(1); }
  .back-btn:active { transform:scale(.9); }
  .head-titles { flex:1; min-width:0; }
  .head-titles h1 { font-size:17px; font-weight:700; letter-spacing:-.02em; }
  .head-titles p { font-size:12px; color:var(--text-2); margin-top:1px; }
  .dots { display:flex; gap:6px; align-items:center; }
  .dots span {
    width:6px; height:6px; border-radius:3px; background:var(--text-3);
    transition: all .35s var(--ease);
  }
  .dots span.on { background:var(--accent); width:18px; }

  /* ---------- Screens ---------- */
  main { flex:1; position:relative; overflow:hidden; }
  .screen {
    position:absolute; inset:0;
    padding: 8px 16px calc(20px + var(--safe-b));
    display:flex; flex-direction:column;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    opacity:0; transform: translateX(24px);
    pointer-events:none;
    transition: opacity .3s var(--ease), transform .3s var(--ease);
  }
  .screen.active { opacity:1; transform:none; pointer-events:auto; }
  .screen.left { transform: translateX(-24px); }
  @media (prefers-reduced-motion: reduce) {
    .screen, .back-btn, .dots span { transition:none !important; }
  }
  .step-label {
    font-size:12px; font-weight:600; color:var(--accent);
    text-transform:uppercase; letter-spacing:.08em; margin:8px 2px 4px;
  }
  h2 { font-size:26px; font-weight:800; letter-spacing:-.03em; margin:0 2px 4px; }
  .sub { font-size:14px; color:var(--text-2); margin:0 2px 18px; line-height:1.4; }

  /* ---------- Option cards ---------- */
  .opt-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .opt-grid.layouts { grid-template-columns:repeat(2,1fr); }
  .opt {
    background:var(--card); border:2px solid transparent; border-radius:var(--radius-md);
    box-shadow:var(--shadow); padding:14px 10px 12px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    transition: transform .15s var(--ease), border-color .2s var(--ease);
  }
  .opt:active { transform:scale(.96); }
  .opt.selected { border-color:var(--accent); }
  .opt .shape { display:flex; align-items:center; justify-content:center; height:64px; }
  .opt .shape .rect { background:linear-gradient(135deg,#D8DCE3,#C2C8D2); border-radius:8px; }
  .opt svg { border-radius:8px; overflow:hidden; display:block; }
  .opt .name { font-size:13px; font-weight:600; }

  /* ---------- Capture ---------- */
  .capture-preview {
    aspect-ratio:1; max-height:34vh; margin:0 auto 20px; width:min(100%,320px);
    background:var(--card); border-radius:var(--radius-lg); box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    color:var(--text-3);
  }
  .capture-preview img { width:100%; height:100%; object-fit:cover; }
  .big-btn {
    display:flex; align-items:center; gap:14px; width:100%;
    background:var(--card); border:none; border-radius:var(--radius-md);
    box-shadow:var(--shadow); padding:16px; margin-bottom:12px;
    font-size:16px; font-weight:600; color:var(--text); cursor:pointer;
    font-family:inherit; text-align:left;
    transition: transform .15s var(--ease);
  }
  .big-btn:active { transform:scale(.97); }
  .big-btn .icon {
    width:44px; height:44px; border-radius:12px; flex:0 0 auto;
    background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
  }
  .big-btn small { display:block; font-size:12.5px; font-weight:400; color:var(--text-2); margin-top:2px; }

  /* ---------- Editor ---------- */
  #editorScreen { padding-bottom: calc(12px + var(--safe-b)); }
  .canvas-wrap {
    position:relative; margin:4px auto 12px; border-radius:var(--radius-lg);
    overflow:hidden; box-shadow:var(--shadow); background:var(--card);
    touch-action:none; line-height:0; max-width:100%;
  }
  #previewCanvas { display:block; width:100%; height:100%; }
  .hint { text-align:center; font-size:12px; color:var(--text-2); margin-bottom:12px; }

  .toolbar { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
  .tool {
    background:var(--card); border:none; border-radius:var(--radius-sm);
    box-shadow:var(--shadow); padding:10px 4px 8px; cursor:pointer; color:var(--text);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-family:inherit; font-size:11px; font-weight:600;
    transition: transform .15s var(--ease);
  }
  .tool:active { transform:scale(.93); }
  .tool svg { color:var(--accent); }

  .adjust-row {
    display:flex; align-items:center; gap:10px; background:var(--card);
    border-radius:var(--radius-sm); box-shadow:var(--shadow);
    padding:8px 10px; margin-bottom:16px;
  }
  .seg { display:flex; background:var(--bg); border-radius:9px; padding:2px; flex:1; }
  .seg button {
    flex:1; border:none; background:transparent; padding:7px 0; border-radius:7px;
    font-family:inherit; font-size:13px; font-weight:600; color:var(--text-2); cursor:pointer;
    transition: all .2s var(--ease);
  }
  .seg button.on { background:var(--card); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,.12); }
  .zoom-btn {
    width:38px; height:38px; border-radius:50%; border:none; flex:0 0 auto;
    background:var(--accent-soft); color:var(--accent); font-size:20px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition: transform .15s var(--ease);
  }
  .zoom-btn:active { transform:scale(.88); }

  .cta-row { display:flex; gap:10px; margin-top:auto; }
  .cta {
    flex:1; border:none; border-radius:var(--radius-md); padding:16px;
    font-family:inherit; font-size:16px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .15s var(--ease), opacity .2s;
  }
  .cta:active { transform:scale(.97); }
  .cta.primary { background:var(--accent); color:#fff; box-shadow:0 6px 18px rgba(0,122,255,.35); }
  .cta.secondary { background:var(--card); color:var(--accent); box-shadow:var(--shadow); }
  .cta[disabled] { opacity:.5; pointer-events:none; }

  /* ---------- Bottom sheet ---------- */
  .sheet-backdrop {
    position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:20;
    opacity:0; pointer-events:none; transition:opacity .25s var(--ease);
  }
  .sheet-backdrop.show { opacity:1; pointer-events:auto; }
  .sheet {
    position:fixed; left:8px; right:8px; bottom:calc(8px + var(--safe-b)); z-index:21;
    transform:translateY(110%); transition:transform .3s var(--ease);
  }
  .sheet.show { transform:none; }
  .sheet .group { background:rgba(255,255,255,.96); backdrop-filter:blur(20px); border-radius:14px; overflow:hidden; margin-bottom:8px; }
  .sheet button {
    width:100%; border:none; background:transparent; padding:17px;
    font-family:inherit; font-size:17px; color:var(--accent); cursor:pointer;
    border-top:0.5px solid var(--line);
  }
  .sheet .group button:first-child { border-top:none; }
  .sheet .cancel { background:rgba(255,255,255,.96); backdrop-filter:blur(20px); border-radius:14px; font-weight:700; }

  /* ---------- Toast ---------- */
  .toast {
    position:fixed; left:50%; bottom:calc(28px + var(--safe-b)); transform:translate(-50%,20px);
    background:rgba(28,28,30,.92); color:#fff; font-size:13.5px; font-weight:600;
    padding:11px 18px; border-radius:100px; z-index:30; opacity:0; pointer-events:none;
    transition:all .3s var(--ease); backdrop-filter:blur(8px); max-width:86vw; text-align:center;
  }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  @media (min-width:640px) {
    main { max-width:520px; margin:0 auto; width:100%; }
    header { max-width:520px; margin:0 auto; width:100%; }
  }
  button:focus-visible, .opt:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>

<header>
  <button class="back-btn" id="backBtn" aria-label="Back">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="head-titles">
    <h1>Before · After</h1>
    <p id="headSub">Photo composer</p>
  </div>
  <div class="dots" id="dots"></div>
</header>

<main id="main"></main>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="group">
    <button id="sheetCamera">Take photo</button>
    <button id="sheetGallery">Choose from library</button>
  </div>
  <button class="cancel" id="sheetCancel">Cancel</button>
</div>

<div class="toast" id="toast"></div>

<input type="file" accept="image/*" capture="environment" id="inputCamera" hidden>
<input type="file" accept="image/*" id="inputGallery" hidden>

<script>
"use strict";

/* ============================================================
   Data
============================================================ */
const DIMS = { portrait:[1080,1440], landscape:[1440,1080], square:[1080,1080] };
const EXPORT_SCALE = 2; // high-res export (2160px+ long side)

const LAYOUTS = {
  side: {
    name: "Side by side",
    regions: [
      { rect:[0,0,.5,1],  label:"BEFORE", anchor:"bl" },
      { rect:[.5,0,.5,1], label:"AFTER",  anchor:"br" }
    ],
    dividers: [[[.5,0],[.5,1]]]
  },
  stack: {
    name: "Top & bottom",
    regions: [
      { rect:[0,0,1,.5],  label:"BEFORE", anchor:"bl" },
      { rect:[0,.5,1,.5], label:"AFTER",  anchor:"bl" }
    ],
    dividers: [[[0,.5],[1,.5]]]
  },
  featureLeft: {
    name: "Feature left",
    regions: [
      { rect:[0,0,.62,1],   label:"BEFORE", anchor:"bl" },
      { rect:[.62,0,.38,1], label:"AFTER",  anchor:"br" }
    ],
    dividers: [[[.62,0],[.62,1]]]
  },
  featureTop: {
    name: "Feature top",
    regions: [
      { rect:[0,0,1,.62],   label:"BEFORE", anchor:"bl" },
      { rect:[0,.62,1,.38], label:"AFTER",  anchor:"bl" }
    ],
    dividers: [[[0,.62],[1,.62]]]
  },
  diagonal: {
    name: "Diagonal",
    regions: [
      { rect:[0,0,1,1], poly:[[0,0],[.65,0],[.35,1],[0,1]], label:"BEFORE", anchor:"bl" },
      { rect:[0,0,1,1], poly:[[.65,0],[1,0],[1,1],[.35,1]], label:"AFTER",  anchor:"br" }
    ],
    dividers: [[[.65,0],[.35,1]]]
  },
  framed: {
    name: "Framed",
    regions: [
      { rect:[.035,.05,.45,.9],  label:"BEFORE", anchor:"bl" },
      { rect:[.515,.05,.45,.9],  label:"AFTER",  anchor:"br" }
    ],
    dividers: []
  }
};

const state = {
  step: 0,
  orientation: "portrait",
  layout: "side",
  imgs: { before:null, after:null },
  t: {
    before: { zoom:1, ox:0, oy:0 },
    after:  { zoom:1, ox:0, oy:0 }
  },
  sel: "before",
  captureTarget: "before"
};

/* ============================================================
   Screens scaffold
============================================================ */
const STEPS = [
  { id:"orientationScreen", sub:"Step 1 of 5" },
  { id:"layoutScreen",      sub:"Step 2 of 5" },
  { id:"beforeScreen",      sub:"Step 3 of 5" },
  { id:"afterScreen",       sub:"Step 4 of 5" },
  { id:"editorScreen",      sub:"Step 5 of 5" }
];

const main = document.getElementById("main");
main.innerHTML = `
  <section class="screen" id="orientationScreen">
    <div class="step-label">Step 1</div>
    <h2>Choose a canvas</h2>
    <p class="sub">Pick the orientation for your comparison image.</p>
    <div class="opt-grid" id="orientationGrid"></div>
  </section>

  <section class="screen" id="layoutScreen">
    <div class="step-label">Step 2</div>
    <h2>Pick a layout</h2>
    <p class="sub">How should the two photos sit together?</p>
    <div class="opt-grid layouts" id="layoutGrid"></div>
  </section>

  <section class="screen" id="beforeScreen">
    <div class="step-label">Step 3</div>
    <h2>Before photo</h2>
    <p class="sub">This appears first — the starting point.</p>
    <div class="capture-preview" id="beforePreview">${photoPlaceholder()}</div>
    <button class="big-btn" data-src="camera" data-slot="before">
      <span class="icon">${camIcon()}</span>
      <span>Take photo<small>Open the camera</small></span>
    </button>
    <button class="big-btn" data-src="gallery" data-slot="before">
      <span class="icon">${libIcon()}</span>
      <span>Choose from library<small>Pick an existing photo</small></span>
    </button>
  </section>

  <section class="screen" id="afterScreen">
    <div class="step-label">Step 4</div>
    <h2>After photo</h2>
    <p class="sub">The result — show off the change.</p>
    <div class="capture-preview" id="afterPreview">${photoPlaceholder()}</div>
    <button class="big-btn" data-src="camera" data-slot="after">
      <span class="icon">${camIcon()}</span>
      <span>Take photo<small>Open the camera</small></span>
    </button>
    <button class="big-btn" data-src="gallery" data-slot="after">
      <span class="icon">${libIcon()}</span>
      <span>Choose from library<small>Pick an existing photo</small></span>
    </button>
  </section>

  <section class="screen" id="editorScreen">
    <div class="step-label">Step 5</div>
    <h2>Compose &amp; export</h2>
    <div class="canvas-wrap" id="canvasWrap"><canvas id="previewCanvas"></canvas></div>
    <p class="hint">Drag to move · pinch or scroll to zoom · double-tap to reset a photo</p>
    <div class="toolbar">
      <button class="tool" id="swapBtn">${swapIcon()}Swap</button>
      <button class="tool" id="retakeBeforeBtn">${camIcon(18)}Before</button>
      <button class="tool" id="retakeAfterBtn">${camIcon(18)}After</button>
      <button class="tool" id="resetBtn">${resetIcon()}Reset</button>
    </div>
    <div class="adjust-row">
      <div class="seg" id="selSeg">
        <button data-sel="before" class="on">Before</button>
        <button data-sel="after">After</button>
      </div>
      <button class="zoom-btn" id="zoomOut" aria-label="Zoom out">−</button>
      <button class="zoom-btn" id="zoomIn" aria-label="Zoom in">+</button>
    </div>
    <div class="cta-row">
      <button class="cta secondary" id="downloadBtn">${dlIcon()}Save PNG</button>
      <button class="cta primary" id="shareBtn">${shareIcon()}Share</button>
    </div>
  </section>
`;

function camIcon(s=22){ return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`; }
function libIcon(s=22){ return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`; }
function swapIcon(){ return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"/><path d="M21 7H7"/><path d="M7 21l-4-4 4-4"/><path d="M3 17h14"/></svg>`; }
function resetIcon(){ return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>`; }
function dlIcon(){ return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>`; }
function shareIcon(){ return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>`; }
function photoPlaceholder(){ return `<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`; }

/* ============================================================
   Navigation
============================================================ */
const dotsEl = document.getElementById("dots");
STEPS.forEach(()=> dotsEl.appendChild(document.createElement("span")));
const backBtn = document.getElementById("backBtn");
const headSub = document.getElementById("headSub");

function goto(step){
  state.step = step;
  STEPS.forEach((s,i)=>{
    const el = document.getElementById(s.id);
    el.classList.toggle("active", i===step);
    el.classList.toggle("left", i<step);
  });
  [...dotsEl.children].forEach((d,i)=> d.classList.toggle("on", i<=step));
  backBtn.classList.toggle("show", step>0);
  headSub.textContent = STEPS[step].sub;
  if (step===4) requestAnimationFrame(()=>{ sizePreview(); render(); });
}
backBtn.addEventListener("click", ()=> goto(Math.max(0, state.step-1)));

/* ============================================================
   Step 1 — orientation
============================================================ */
const orientationGrid = document.getElementById("orientationGrid");
[["portrait","Portrait",38,58],["landscape","Landscape",58,38],["square","Square",48,48]].forEach(([key,name,w,h])=>{
  const b = document.createElement("button");
  b.className = "opt" + (key===state.orientation ? " selected":"");
  b.innerHTML = `<span class="shape"><span class="rect" style="width:${w}px;height:${h}px"></span></span><span class="name">${name}</span>`;
  b.addEventListener("click", ()=>{
    state.orientation = key;
    [...orientationGrid.children].forEach(c=>c.classList.remove("selected"));
    b.classList.add("selected");
    buildLayoutGrid();
    setTimeout(()=>goto(1), 180);
  });
  orientationGrid.appendChild(b);
});

/* ============================================================
   Step 2 — layout
============================================================ */
const layoutGrid = document.getElementById("layoutGrid");
function layoutThumb(key){
  const [W,H] = DIMS[state.orientation];
  const vw = 100, vh = 100 * H / W;
  const lay = LAYOUTS[key];
  const fills = ["#C7CDD7","#AEB6C4"];
  let shapes = "";
  lay.regions.forEach((r,i)=>{
    if (r.poly) {
      const pts = r.poly.map(p=>`${p[0]*vw},${p[1]*vh}`).join(" ");
      shapes += `<polygon points="${pts}" fill="${fills[i]}"/>`;
    } else {
      const [x,y,w,h] = r.rect;
      shapes += `<rect x="${x*vw}" y="${y*vh}" width="${w*vw}" height="${h*vh}" fill="${fills[i]}"/>`;
    }
  });
  let divs = lay.dividers.map(d=>
    `<line x1="${d[0][0]*vw}" y1="${d[0][1]*vh}" x2="${d[1][0]*vw}" y2="${d[1][1]*vh}" stroke="#fff" stroke-width="3"/>`).join("");
  const scale = Math.min(64/vw, 64/vh) * (state.orientation==="square" ? .92 : 1);
  return `<svg width="${vw*scale}" height="${vh*scale}" viewBox="0 0 ${vw} ${vh}"><rect width="${vw}" height="${vh}" fill="#fff"/>${shapes}${divs}</svg>`;
}
function buildLayoutGrid(){
  layoutGrid.innerHTML = "";
  Object.keys(LAYOUTS).forEach(key=>{
    const b = document.createElement("button");
    b.className = "opt" + (key===state.layout ? " selected":"");
    b.innerHTML = `<span class="shape">${layoutThumb(key)}</span><span class="name">${LAYOUTS[key].name}</span>`;
    b.addEventListener("click", ()=>{
      state.layout = key;
      [...layoutGrid.children].forEach(c=>c.classList.remove("selected"));
      b.classList.add("selected");
      setTimeout(()=>goto(state.imgs.before && state.imgs.after ? 4 : 2), 180);
    });
    layoutGrid.appendChild(b);
  });
}
buildLayoutGrid();

/* ============================================================
   Steps 3 & 4 — capture
============================================================ */
const inputCamera = document.getElementById("inputCamera");
const inputGallery = document.getElementById("inputGallery");

document.querySelectorAll(".big-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    state.captureTarget = btn.dataset.slot;
    (btn.dataset.src==="camera" ? inputCamera : inputGallery).click();
  });
});

async function handleFile(file){
  if (!file || !file.type.startsWith("image/")) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  try {
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
  } catch {
    toast("Couldn't read that image — try another one.");
    URL.revokeObjectURL(url);
    return;
  }
  const slot = state.captureTarget;
  if (state.imgs[slot] && state.imgs[slot]._url) URL.revokeObjectURL(state.imgs[slot]._url);
  img._url = url;
  state.imgs[slot] = img;
  state.t[slot] = { zoom:1, ox:0, oy:0 };

  const prev = document.getElementById(slot+"Preview");
  prev.innerHTML = "";
  const thumb = document.createElement("img");
  thumb.src = url; thumb.alt = slot+" photo";
  prev.appendChild(thumb);

  if (state.step===2 && slot==="before") setTimeout(()=>goto(3), 350);
  else if (state.step===3 && slot==="after") setTimeout(()=>goto(4), 350);
  else if (state.step===4) render();
}
inputCamera.addEventListener("change", e=>{ handleFile(e.target.files[0]); e.target.value=""; });
inputGallery.addEventListener("change", e=>{ handleFile(e.target.files[0]); e.target.value=""; });

/* ============================================================
   Rendering (shared by preview + export)
============================================================ */
const canvas = document.getElementById("previewCanvas");
const wrap = document.getElementById("canvasWrap");
const ctx = canvas.getContext("2d");

function regionPath(c, r, W, H){
  c.beginPath();
  if (r.poly) {
    r.poly.forEach((p,i)=> i ? c.lineTo(p[0]*W, p[1]*H) : c.moveTo(p[0]*W, p[1]*H));
    c.closePath();
  } else {
    const [x,y,w,h] = r.rect;
    c.rect(x*W, y*H, w*W, h*H);
  }
}

function clampT(slot){
  const lay = LAYOUTS[state.layout];
  const idx = slot==="before" ? 0 : 1;
  const r = lay.regions[idx];
  const img = state.imgs[slot];
  const t = state.t[slot];
  t.zoom = Math.min(6, Math.max(1, t.zoom));
  if (!img) return;
  const [W,H] = DIMS[state.orientation];
  const bw = r.rect[2]*W, bh = r.rect[3]*H;
  const s = Math.max(bw/img.naturalWidth, bh/img.naturalHeight) * t.zoom;
  const maxOx = (img.naturalWidth*s - bw) / 2 / bw;
  const maxOy = (img.naturalHeight*s - bh) / 2 / bh;
  t.ox = Math.min(maxOx, Math.max(-maxOx, t.ox));
  t.oy = Math.min(maxOy, Math.max(-maxOy, t.oy));
}

function drawScene(c, W, H){
  const lay = LAYOUTS[state.layout];
  c.fillStyle = "#FFFFFF";
  c.fillRect(0,0,W,H);
  const slots = ["before","after"];

  lay.regions.forEach((r,i)=>{
    const slot = slots[i];
    const img = state.imgs[slot];
    const t = state.t[slot];
    clampT(slot);
    c.save();
    regionPath(c, r, W, H);
    c.clip();
    const bx=r.rect[0]*W, by=r.rect[1]*H, bw=r.rect[2]*W, bh=r.rect[3]*H;
    if (img){
      const s = Math.max(bw/img.naturalWidth, bh/img.naturalHeight) * t.zoom;
      const dw = img.naturalWidth*s, dh = img.naturalHeight*s;
      c.drawImage(img, bx + bw/2 - dw/2 + t.ox*bw, by + bh/2 - dh/2 + t.oy*bh, dw, dh);
    } else {
      c.fillStyle = i ? "#AEB6C4" : "#C7CDD7";
      c.fillRect(bx,by,bw,bh);
    }
    c.restore();
  });

  // dividers
  const gap = Math.max(3, Math.round(Math.min(W,H) * 0.008));
  c.strokeStyle = "#FFFFFF";
  c.lineWidth = gap;
  c.lineCap = "butt";
  lay.dividers.forEach(d=>{
    c.beginPath();
    c.moveTo(d[0][0]*W, d[0][1]*H);
    c.lineTo(d[1][0]*W, d[1][1]*H);
    c.stroke();
  });

  // labels
  lay.regions.forEach((r,i)=>{
    drawLabel(c, W, H, r, r.label);
  });
}

function drawLabel(c, W, H, r, text){
  const fs = Math.round(Math.min(W,H) * 0.034);
  c.font = `700 ${fs}px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif`;
  const padX = fs*0.75, padY = fs*0.45, m = fs*0.7;
  const spaced = text.split("").join("\u200a");
  const tw = c.measureText(spaced).width;
  const pw = tw + padX*2, ph = fs + padY*2;

  const bx=r.rect[0]*W, by=r.rect[1]*H, bw=r.rect[2]*W, bh=r.rect[3]*H;
  let x, y;
  if (r.anchor==="br") { x = bx + bw - m - pw; y = by + bh - m - ph; }
  else                 { x = bx + m;           y = by + bh - m - ph; }
  // keep pill inside diagonal regions
  if (r.poly) {
    if (r.anchor==="bl") x = m;
    if (r.anchor==="br") x = W - m - pw;
  }

  c.save();
  c.beginPath();
  const rad = ph/2;
  c.moveTo(x+rad, y);
  c.arcTo(x+pw, y, x+pw, y+ph, rad);
  c.arcTo(x+pw, y+ph, x, y+ph, rad);
  c.arcTo(x, y+ph, x, y, rad);
  c.arcTo(x, y, x+pw, y, rad);
  c.closePath();
  c.fillStyle = "rgba(20,20,22,.6)";
  c.fill();
  c.fillStyle = "#FFFFFF";
  c.textBaseline = "middle";
  c.fillText(spaced, x+padX, y+ph/2 + fs*0.06);
  c.restore();
}

/* Preview sizing */
let previewScale = 1; // preview px per export-unit px
function sizePreview(){
  const [W,H] = DIMS[state.orientation];
  const cs = getComputedStyle(wrap.parentElement);
  const pad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const availW = Math.min(wrap.parentElement.clientWidth - pad, 520);
  const availH = Math.max(240, window.innerHeight * 0.48);
  const scale = Math.min(availW/W, availH/H);
  const cssW = Math.round(W*scale), cssH = Math.round(H*scale);
  wrap.style.width = cssW+"px";
  wrap.style.height = cssH+"px";
  const dpr = Math.min(window.devicePixelRatio||1, 3);
  canvas.width = Math.round(cssW*dpr);
  canvas.height = Math.round(cssH*dpr);
  previewScale = cssW / W;
}
window.addEventListener("resize", ()=>{ if(state.step===4){ sizePreview(); render(); }});

let rafPending = false;
function render(){
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(()=>{
    rafPending = false;
    const [W,H] = DIMS[state.orientation];
    ctx.setTransform(canvas.width/W, 0, 0, canvas.height/H, 0, 0);
    ctx.imageSmoothingQuality = "high";
    drawScene(ctx, W, H);
  });
}

/* ============================================================
   Gestures — pan, pinch, wheel, double-tap
============================================================ */
const pointers = new Map();
let gesture = null;

function ptInRegion(px, py, r){
  if (r.poly){
    let inside = false;
    const pts = r.poly;
    for (let i=0, j=pts.length-1; i<pts.length; j=i++){
      const xi=pts[i][0], yi=pts[i][1], xj=pts[j][0], yj=pts[j][1];
      if (((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) inside = !inside;
    }
    return inside;
  }
  const [x,y,w,h] = r.rect;
  return px>=x && px<=x+w && py>=y && py<=y+h;
}
function hitSlot(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  const px = (clientX - rect.left) / rect.width;
  const py = (clientY - rect.top) / rect.height;
  const lay = LAYOUTS[state.layout];
  if (ptInRegion(px,py,lay.regions[0])) return "before";
  if (ptInRegion(px,py,lay.regions[1])) return "after";
  return "before";
}

let lastTap = 0, lastTapSlot = null;

canvas.addEventListener("pointerdown", e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pointers.size===1){
    const slot = hitSlot(e.clientX, e.clientY);
    setSel(slot);
    gesture = { type:"pan", slot, x:e.clientX, y:e.clientY };
    const now = Date.now();
    if (now - lastTap < 300 && lastTapSlot===slot){
      state.t[slot] = { zoom:1, ox:0, oy:0 };
      render();
      gesture = null;
    }
    lastTap = now; lastTapSlot = slot;
  } else if (pointers.size===2){
    const [a,b] = [...pointers.values()];
    gesture = {
      type:"pinch",
      slot: gesture ? gesture.slot : hitSlot((a.x+b.x)/2,(a.y+b.y)/2),
      dist: Math.hypot(a.x-b.x, a.y-b.y),
      zoom0: null
    };
    gesture.zoom0 = state.t[gesture.slot].zoom;
  }
});

canvas.addEventListener("pointermove", e=>{
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (!gesture) return;
  const lay = LAYOUTS[state.layout];
  const idx = gesture.slot==="before" ? 0 : 1;
  const r = lay.regions[idx];
  const [W,H] = DIMS[state.orientation];
  const bwPx = r.rect[2]*W*previewScale, bhPx = r.rect[3]*H*previewScale;

  if (gesture.type==="pan" && pointers.size===1){
    const t = state.t[gesture.slot];
    t.ox += (e.clientX - gesture.x) / bwPx;
    t.oy += (e.clientY - gesture.y) / bhPx;
    gesture.x = e.clientX; gesture.y = e.clientY;
    clampT(gesture.slot);
    render();
  } else if (gesture.type==="pinch" && pointers.size===2){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    state.t[gesture.slot].zoom = gesture.zoom0 * (d / gesture.dist);
    clampT(gesture.slot);
    render();
  }
});

function endPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size===0) gesture = null;
  else if (pointers.size===1){
    const [a] = [...pointers.values()];
    gesture = { type:"pan", slot: gesture ? gesture.slot : "before", x:a.x, y:a.y };
  }
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);

canvas.addEventListener("wheel", e=>{
  e.preventDefault();
  const slot = hitSlot(e.clientX, e.clientY);
  setSel(slot);
  state.t[slot].zoom *= e.deltaY < 0 ? 1.06 : 0.94;
  clampT(slot);
  render();
}, {passive:false});

/* ============================================================
   Editor controls
============================================================ */
const selSeg = document.getElementById("selSeg");
function setSel(slot){
  state.sel = slot;
  selSeg.querySelectorAll("button").forEach(b=> b.classList.toggle("on", b.dataset.sel===slot));
}
selSeg.addEventListener("click", e=>{
  const b = e.target.closest("button");
  if (b) setSel(b.dataset.sel);
});
document.getElementById("zoomIn").addEventListener("click", ()=>{
  state.t[state.sel].zoom *= 1.15; clampT(state.sel); render();
});
document.getElementById("zoomOut").addEventListener("click", ()=>{
  state.t[state.sel].zoom /= 1.15; clampT(state.sel); render();
});
document.getElementById("swapBtn").addEventListener("click", ()=>{
  [state.imgs.before, state.imgs.after] = [state.imgs.after, state.imgs.before];
  [state.t.before, state.t.after] = [state.t.after, state.t.before];
  const bp = document.getElementById("beforePreview"), ap = document.getElementById("afterPreview");
  [bp.innerHTML, ap.innerHTML] = [ap.innerHTML, bp.innerHTML];
  render();
  toast("Photos swapped");
});
document.getElementById("resetBtn").addEventListener("click", ()=>{
  state.t.before = { zoom:1, ox:0, oy:0 };
  state.t.after  = { zoom:1, ox:0, oy:0 };
  render();
  toast("Zoom & position reset");
});

/* Retake via bottom sheet */
const sheet = document.getElementById("sheet");
const sheetBackdrop = document.getElementById("sheetBackdrop");
function openSheet(slot){
  state.captureTarget = slot;
  sheet.classList.add("show");
  sheetBackdrop.classList.add("show");
}
function closeSheet(){
  sheet.classList.remove("show");
  sheetBackdrop.classList.remove("show");
}
document.getElementById("retakeBeforeBtn").addEventListener("click", ()=>openSheet("before"));
document.getElementById("retakeAfterBtn").addEventListener("click", ()=>openSheet("after"));
document.getElementById("sheetCamera").addEventListener("click", ()=>{ closeSheet(); inputCamera.click(); });
document.getElementById("sheetGallery").addEventListener("click", ()=>{ closeSheet(); inputGallery.click(); });
document.getElementById("sheetCancel").addEventListener("click", closeSheet);
sheetBackdrop.addEventListener("click", closeSheet);

/* ============================================================
   Export — download & share
============================================================ */
function exportBlob(){
  return new Promise(resolve=>{
    const [W,H] = DIMS[state.orientation];
    const out = document.createElement("canvas");
    out.width = W*EXPORT_SCALE;
    out.height = H*EXPORT_SCALE;
    const oc = out.getContext("2d");
    oc.setTransform(EXPORT_SCALE,0,0,EXPORT_SCALE,0,0);
    oc.imageSmoothingQuality = "high";
    drawScene(oc, W, H);
    out.toBlob(resolve, "image/png");
  });
}
function fileName(){
  const d = new Date();
  const p = n=>String(n).padStart(2,"0");
  return `before-after-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.png`;
}
document.getElementById("downloadBtn").addEventListener("click", async e=>{
  const btn = e.currentTarget;
  btn.disabled = true;
  const blob = await exportBlob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fileName();
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  btn.disabled = false;
  toast("PNG saved");
});
const shareBtn = document.getElementById("shareBtn");
shareBtn.addEventListener("click", async ()=>{
  shareBtn.disabled = true;
  try {
    const blob = await exportBlob();
    const file = new File([blob], fileName(), { type:"image/png" });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:"Before · After" });
    } else {
      // fallback: download instead
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = fileName();
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      toast("Sharing isn't available here — saved the PNG instead");
    }
  } catch (err) {
    if (err && err.name !== "AbortError") toast("Couldn't share — try Save PNG");
  }
  shareBtn.disabled = false;
});

/* ============================================================
   Toast + boot
============================================================ */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

goto(0);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuickQR - Custom QR Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#1e293b;--muted:#64748b;--line:#e2e8f0;--soft:#f1f5f9;--acc:#0d9488;--acc2:#0f766e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--line:#334155;--soft:#0f172a}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--line:#334155;--soft:#0f172a}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
header{text-align:center;margin-bottom:20px}
.logo{display:inline-flex;padding:12px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));font-size:26px;line-height:1}
h1{margin:10px 0 2px;font-size:34px;font-weight:800}
header p{margin:0;color:var(--acc);font-size:14px;font-weight:500}
main{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 20px 30px -10px rgba(13,148,136,.12)}
.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin:0 0 8px 2px}
section{margin-bottom:22px}
#types{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--soft);color:var(--text);padding:8px 12px;border-radius:999px;font:600 13px Inter,sans-serif;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px 2px}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=datetime-local],textarea,select{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:400 14px Inter,sans-serif;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 2px rgba(13,148,136,.25)}
textarea{resize:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.chk input{width:auto}
.colors{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:14px}
.cbox{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;font-weight:600}
.cbox code{color:var(--muted);font-size:11px;margin-right:6px}
input[type=color]{-webkit-appearance:none;appearance:none;width:30px;height:30px;border:0;padding:0;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
#presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pre{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
#out{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:270px;border:2px dashed var(--line);border-radius:18px;padding:20px;text-align:center;color:var(--muted)}
#qrcode img,#qrcode canvas{display:block;margin:0 auto;padding:12px;background:#fff;border-radius:12px;max-width:100%}
#qrcode img{width:auto}
#data{max-width:100%;margin-top:14px;font:11px ui-monospace,monospace;color:var(--muted);word-break:break-all;max-height:64px;overflow:auto}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.btn{border:0;border-radius:999px;padding:10px 22px;font:600 14px Inter,sans-serif;cursor:pointer;background:var(--acc);color:#fff}
.btn.alt{background:var(--soft);color:var(--text);border:1px solid var(--line)}
.hidden{display:none!important}
footer{margin-top:20px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="logo">▦</div>
  <h1>QuickQR</h1>
  <p>Instant custom QR codes for links, contacts, Wi-Fi and more</p>
</header>

<main>
  <section>
    <span class="lbl">1. Choose type</span>
    <div id="types"></div>
  </section>

  <section>
    <span class="lbl">2. Enter details</span>
    <div id="fields"></div>
  </section>

  <section class="colors">
    <span class="lbl">3. Customize</span>
    <div class="row">
      <div class="cbox"><span>Pattern</span><span><code id="fg-code">#0f766e</code><input type="color" id="fg" value="#0f766e"></span></div>
      <div class="cbox"><span>Background</span><span><code id="bg-code">#ffffff</code><input type="color" id="bg" value="#ffffff"></span></div>
    </div>
    <div id="presets"></div>
  </section>

  <div id="out">
    <div id="qrcode"></div>
    <div id="ph">
      <div style="font-size:40px;opacity:.35">▦</div>
      <p style="margin:4px 0 0;font-size:14px;font-weight:600">Your QR code will appear here</p>
      <p style="margin:4px 0 0;font-size:12px">Fill in the details above</p>
    </div>
    <div id="data" class="hidden"></div>
    <div class="btns hidden" id="btns">
      <button class="btn" id="dl">Download PNG</button>
      <button class="btn alt" id="cp">Copy data</button>
    </div>
  </div>
</main>

<footer>© QuickQR Tool · Free, instant and customizable</footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s || '').replace(/([\\;,:"])/g, '\\$1');
const dt = s => s ? s.replace(/[-:]/g, '').slice(0, 15).padEnd(15, '0') : '';
const enc = encodeURIComponent;

// Each type: label, icon, fields, and a builder returning the QR payload ('' = incomplete)
const TYPES = {
  text: { l: 'Text / URL', i: '🔗', f: [{ id: 'v', l: 'Link or text', t: 'area', p: 'Paste a link or type any text...' }],
    b: d => d.v },
  num: { l: 'Number / Code', i: '🔢', f: [{ id: 'n', l: 'Number or code (plain digits, no link)', t: 'tel', p: 'e.g. 1603079620322891387964001' }],
    b: d => d.n ? d.n.replace(/\s+/g, '') : '' },
  search: { l: 'Web search', i: '🔍', f: [
      { id: 'e', l: 'Search on', t: 'sel', o: [['Google', 'https://www.google.com/search?q='], ['Bing', 'https://www.bing.com/search?q='], ['DuckDuckGo', 'https://duckduckgo.com/?q='], ['YouTube', 'https://www.youtube.com/results?search_query='], ['Google Maps', 'https://www.google.com/maps/search/?api=1&query='], ['Wikipedia', 'https://en.wikipedia.org/w/index.php?search=']] },
      { id: 'q', l: 'Search query', p: 'e.g. psychology of habits' }],
    b: d => d.q ? (d.e || TYPES.search.f[0].o[0][1]) + enc(d.q) : '' },
  email: { l: 'Email', i: '✉️', f: [
      { id: 'to', l: 'To', t: 'email', p: 'name@example.com' },
      { id: 's', l: 'Subject', p: 'Optional' },
      { id: 'm', l: 'Message', t: 'area', p: 'Optional' }],
    b: d => d.to ? 'mailto:' + d.to + '?subject=' + enc(d.s || '') + '&body=' + enc(d.m || '') : '' },
  phone: { l: 'Phone', i: '📞', f: [{ id: 'n', l: 'Phone number', t: 'tel', p: '+1 250 555 0123' }],
    b: d => d.n ? 'tel:' + d.n.replace(/[^\d+]/g, '') : '' },
  sms: { l: 'SMS', i: '💬', f: [
      { id: 'n', l: 'Phone number', t: 'tel', p: '+1 250 555 0123' },
      { id: 'm', l: 'Message', t: 'area', p: 'Optional pre-filled text' }],
    b: d => d.n ? 'SMSTO:' + d.n.replace(/[^\d+]/g, '') + ':' + (d.m || '') : '' },
  wa: { l: 'WhatsApp', i: '🟢', f: [
      { id: 'n', l: 'Number with country code', t: 'tel', p: '12505550123' },
      { id: 'm', l: 'Message', t: 'area', p: 'Optional pre-filled text' }],
    b: d => d.n ? 'https://wa.me/' + d.n.replace(/\D/g, '') + (d.m ? '?text=' + enc(d.m) : '') : '' },
  wifi: { l: 'Wi-Fi', i: '📶', f: [
      { id: 's', l: 'Network name (SSID)', p: 'MyNetwork' },
      { id: 'p', l: 'Password', p: 'Leave empty for open networks' },
      { id: 'a', l: 'Security', t: 'sel', o: [['WPA/WPA2/WPA3', 'WPA'], ['WEP', 'WEP'], ['None', 'nopass']] },
      { id: 'h', l: 'Hidden network', t: 'chk' }],
    b: d => d.s ? 'WIFI:T:' + (d.a || 'WPA') + ';S:' + esc(d.s) + ';' + (d.a === 'nopass' ? '' : 'P:' + esc(d.p) + ';') + (d.h ? 'H:true;' : '') + ';' : '' },
  geo: { l: 'Location', i: '📍', f: [
      { id: 'a', l: 'Latitude', t: 'number', p: '50.6745' },
      { id: 'o', l: 'Longitude', t: 'number', p: '-120.3273' }],
    b: d => d.a && d.o ? 'geo:' + d.a + ',' + d.o : '' },
  vcard: { l: 'Contact', i: '👤', f: [
      { id: 'fn', l: 'First name' }, { id: 'ln', l: 'Last name' },
      { id: 'ph', l: 'Phone', t: 'tel' }, { id: 'em', l: 'Email', t: 'email' },
      { id: 'org', l: 'Organization' }, { id: 'ti', l: 'Job title' }, { id: 'u', l: 'Website', p: 'https://' }],
    b: d => (d.fn || d.ln) ? ['BEGIN:VCARD', 'VERSION:3.0', 'N:' + (d.ln || '') + ';' + (d.fn || ''), 'FN:' + [d.fn, d.ln].filter(Boolean).join(' '),
      d.org && 'ORG:' + d.org, d.ti && 'TITLE:' + d.ti, d.ph && 'TEL:' + d.ph, d.em && 'EMAIL:' + d.em, d.u && 'URL:' + d.u, 'END:VCARD'].filter(Boolean).join('\n') : '' },
  event: { l: 'Event', i: '📅', f: [
      { id: 't', l: 'Event title' },
      { id: 'st', l: 'Starts', t: 'datetime-local' }, { id: 'en', l: 'Ends', t: 'datetime-local' },
      { id: 'lo', l: 'Location' }, { id: 'de', l: 'Description', t: 'area' }],
    b: d => d.t && d.st ? ['BEGIN:VEVENT', 'SUMMARY:' + d.t, 'DTSTART:' + dt(d.st), 'DTEND:' + dt(d.en || d.st), d.lo && 'LOCATION:' + d.lo, d.de && 'DESCRIPTION:' + d.de.replace(/\n/g, '\\n'), 'END:VEVENT'].filter(Boolean).join('\n') : '' },
  social: { l: 'Social profile', i: '⭐', f: [
      { id: 'p', l: 'Platform', t: 'sel', o: [['Instagram', 'https://www.instagram.com/'], ['YouTube', 'https://www.youtube.com/@'], ['TikTok', 'https://www.tiktok.com/@'], ['X (Twitter)', 'https://x.com/'], ['LinkedIn', 'https://www.linkedin.com/in/'], ['Facebook', 'https://www.facebook.com/']] },
      { id: 'u', l: 'Username', p: 'yourhandle' }],
    b: d => d.u ? (d.p || TYPES.social.f[0].o[0][1]) + enc(d.u.replace(/^@/, '')) : '' }
};
const PRESETS = [['#0f766e', '#ffffff'], ['#1e293b', '#ffffff'], ['#2563eb', '#eff6ff'], ['#059669', '#ecfdf5'], ['#7c3aed', '#f5f3ff'], ['#dc2626', '#fef2f2'], ['#ffffff', '#0f172a']];

let cur = 'text', payload = '';
const vals = {}; Object.keys(TYPES).forEach(k => vals[k] = {});

function drawTypes() {
  $('types').innerHTML = Object.entries(TYPES).map(([k, t]) =>
    `<button type="button" class="chip${k === cur ? ' on' : ''}" data-k="${k}">${t.i} ${t.l}</button>`).join('');
}

function drawFields() {
  const v = vals[cur], pair = f => ['datetime-local', 'number'].includes(f.t);
  const html = TYPES[cur].f.map(f => {
    const val = v[f.id] ?? '';
    let c;
    if (f.t === 'area') c = `<textarea rows="3" data-id="${f.id}" placeholder="${f.p || ''}">${val}</textarea>`;
    else if (f.t === 'sel') c = `<select data-id="${f.id}">${f.o.map(o => `<option value="${o[1]}"${val === o[1] ? ' selected' : ''}>${o[0]}</option>`).join('')}</select>`;
    else if (f.t === 'chk') return `<div class="fld"><label class="chk"><input type="checkbox" data-id="${f.id}"${val ? ' checked' : ''}> ${f.l}</label></div>`;
    else c = `<input type="${f.t || 'text'}" data-id="${f.id}" placeholder="${f.p || ''}" value="${String(val).replace(/"/g, '&quot;')}">`;
    return `<div class="fld"><label>${f.l}</label>${c}</div>`;
  });
  $('fields').innerHTML = html.join('');
  // fill select defaults into state
  TYPES[cur].f.filter(f => f.t === 'sel').forEach(f => { if (v[f.id] === undefined) v[f.id] = f.o[0][1]; });
}

function generate() {
  const fg = $('fg').value, bg = $('bg').value;
  $('fg-code').textContent = fg; $('bg-code').textContent = bg;
  payload = TYPES[cur].b(vals[cur]) || '';
  $('qrcode').innerHTML = '';
  const empty = !payload;
  $('ph').classList.toggle('hidden', !empty);
  $('btns').classList.toggle('hidden', empty);
  $('data').classList.toggle('hidden', empty);
  if (empty) return;
  $('data').textContent = payload;
  try {
    new QRCode($('qrcode'), { text: payload, width: 220, height: 220, colorDark: fg, colorLight: bg, correctLevel: QRCode.CorrectLevel.M });
  } catch (e) {
    $('btns').classList.add('hidden');
    $('data').textContent = 'Too much data for one QR code. Please shorten the content.';
  }
}

$('types').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  cur = b.dataset.k; drawTypes(); drawFields(); generate();
});
const onField = e => {
  const id = e.target.dataset.id; if (!id) return;
  vals[cur][id] = e.target.type === 'checkbox' ? e.target.checked : e.target.value.trim();
  generate();
};
$('fields').addEventListener('input', onField);
$('fields').addEventListener('change', onField);
$('fg').addEventListener('input', generate);
$('bg').addEventListener('input', generate);

$('presets').innerHTML = PRESETS.map(p => `<button type="button" class="pre" data-fg="${p[0]}" data-bg="${p[1]}" style="background:linear-gradient(135deg,${p[0]} 50%,${p[1]} 50%)" aria-label="Color preset"></button>`).join('');
$('presets').addEventListener('click', e => {
  const b = e.target.closest('.pre'); if (!b) return;
  $('fg').value = b.dataset.fg; $('bg').value = b.dataset.bg; generate();
});

$('dl').addEventListener('click', () => {
  const img = $('qrcode').querySelector('img'), cv = $('qrcode').querySelector('canvas');
  const url = img && img.src.startsWith('data:image') ? img.src : cv ? cv.toDataURL('image/png') : '';
  if (!url) return;
  const a = document.createElement('a');
  a.download = 'qrcode-' + cur + '-' + Date.now() + '.png'; a.href = url;
  document.body.appendChild(a); a.click(); a.remove();
});
$('cp').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(payload); $('cp').textContent = 'Copied'; }
  catch (e) { $('cp').textContent = 'Copy not available'; }
  setTimeout(() => $('cp').textContent = 'Copy data', 1500);
});

drawTypes(); drawFields(); generate();
</script>
</body>
</html>
